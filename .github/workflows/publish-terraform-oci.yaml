---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Terraform: Build OCI artifacts"

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - infrastructure/terraform/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-files:
    name: Generate matrix for building images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        run: sudo apt-get install -y jo

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          dir_names: true
          json: true
          files: |
            infrastructure/terraform/**

      - name: List all changed files
        env:
          ALL_CHANGED_FILES: "${{ steps.changed-files.outputs.all_changed_files }}"
        run: |
          echo "${ALL_CHANGED_FILES}"

      - name: Store changed projects
        id: set-matrix
        env:
          ALL_CHANGED_FILES: "${{ steps.changed-files.outputs.all_changed_files }}"
        run: |
          if [[ "${ALL_CHANGED_FILES}" == "[]" ]]; then
            MATRIX="{\"project\":$(find infrastructure/terraform -type f -name .terraform.lock.hcl | xargs dirname | jo -a)}"
          else
            # tj-actions/changed-files' output has been observed coming through
            # this env var with literal backslash-escaped quotes
            # (["infrastructure/terraform/security/authentik"] became
            # [\"infrastructure/terraform/security/authentik\"]), producing
            # invalid JSON once embedded below - fromJSON() on the matrix then
            # fails with no visible error: the "publish" job just never runs
            # and the whole workflow silently reports failure. Strip any such
            # escaping defensively before use.
            CLEAN_FILES="$(printf '%s' "${ALL_CHANGED_FILES}" | sed 's/\\"/"/g')"
            MATRIX="{\"project\":${CLEAN_FILES}}"
          fi
          if ! jq -e . <<<"${MATRIX}" >/dev/null; then
            echo "::error::Generated matrix is not valid JSON: ${MATRIX}"
            exit 1
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  publish:
    runs-on: ubuntu-latest
    needs:
      - changed-files
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.changed-files.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        env:
          # renovate: datasource=github-releases depName=fluxcd/flux2
          FLUX_VERSION: v2.9.4
        run: |
          curl -sL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin flux

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Owner Name
        env:
          REPO_OWNER: "${{ github.repository_owner }}"
        run: |
          echo "REPO_OWNER_LC=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Publish OCI
        env:
          MATRIX_PROJECT: "${{ matrix.project }}"
        run: |
          flux push artifact "oci://ghcr.io/${REPO_OWNER_LC}/terraform/$(basename "${MATRIX_PROJECT}"):$(git rev-parse --short HEAD)" \
            --path="./${MATRIX_PROJECT}" \
            --source="$(git config --get remote.origin.url)" \
            --revision="$(git branch --show-current)/$(git rev-parse HEAD)"

      - name: Tag OCI
        env:
          MATRIX_PROJECT: "${{ matrix.project }}"
        run: |-
          flux tag artifact "oci://ghcr.io/${REPO_OWNER_LC}/terraform/$(basename "${MATRIX_PROJECT}"):$(git rev-parse --short HEAD)" \
            --tag main
