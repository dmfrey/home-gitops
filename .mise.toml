[env]
KUBECONFIG = "{{config_root | canonicalize}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root | canonicalize}}/.minijinja.toml"
TALOSCONFIG = "{{config_root | canonicalize}}/talosconfig"
LEFTHOOK_OUTPUT = "false"

_.file = ["{{config_root}}/onepassword.env"]

[hooks]
postinstall = "lefthook install"

[tools]
"aqua:evilmartians/lefthook" = "2.1.11"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.29.0"
"just" = "1.58.0"
"uv" = "0.12.5"
# flux-local is deprecated/sunsetted upstream in favor of flate (and
# konflate) - our own .github/workflows/flate.yaml already uses flate in
# CI, this pins the same tool for local `just kube apply-ks`/`delete-ks`
# rendering (kubernetes/mod.just's render-local-ks) instead of running two
# different Flux renderers.
"github:home-operations/flate" = "v0.6.0"
"npm:oxfmt" = "0.65.0"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:charmbracelet/gum" = "2.0.0"
# Mise's own talosctl tool (resolves to aqua:siderolabs/talos, same as the
# per-node factory images and tuppr's TalosUpgrade CR) so Renovate's Talos
# Group has a second real member and can actually satisfy
# minimumGroupSize:2 automatically - matches github.com/onedr0p/home-ops.
"talos" = "1.13.9"
# The system helmfile most people have on PATH is often stale (this repo's
# was 0.171.0, ~2 years old) and silently fails on newer helmfile.yaml
# syntax like `bases:`/`defaultInherit:` (used by bootstrap/helmfile.d/
# since the single-source-of-truth chart/version refactor) with an
# "unmarshal errors: field ... not found" error rather than anything
# obviously version-related.
"aqua:helmfile/helmfile" = "1.7.4"
# Previously an untracked standalone /usr/local/bin/flux at v2.5.1, which
# predates source-controller's OCIRepository v1beta2->v1 promotion and
# failed to reconcile OCIRepository sources ("no matches for
# source.toolkit.fluxcd.io/v1beta2"). Pinned here to match CI's
# FLUX_VERSION (.github/workflows/publish-terraform-oci.yaml).
"flux2" = "2.9.4"
# Same v1beta2/v1 staleness as flux2 above, on the CLI half of the
# flux-operator-mcp server (~/.local/bin/flux-operator-mcp was 0.45.1);
# pinned to keep it tracked and current going forward.
"flux-operator-mcp" = "0.58.1"
