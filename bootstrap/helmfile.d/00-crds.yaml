---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.
helmDefaults:
  args:
    - --include-crds
    - --no-hooks

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: cloudflare-dns
    namespace: network
  - name: envoy-gateway
    namespace: network
  - name: grafana-operator
    namespace: observability
    # kubernetes/apps/observability/grafana-operator doesn't exist - the
    # app's git directory is named `grafana` even though the live
    # HelmRelease/OCIRepository resources are both named `grafana-operator`
    # (confirmed matches this release name). Renaming that directory would
    # touch a path Flux actually reconciles from (plus a dependent
    # grafana-instance Kustomization), so this one release keeps an
    # explicit override instead of relying on the templated lookup.
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.24.0
  - name: kube-prometheus-stack
    namespace: observability
