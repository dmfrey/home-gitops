---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APP}-nfs-scaler-unstick
spec:
  # The nfs-scaler HPA (horizontalpodautoscaler.yaml) has minReplicas: 0. Once
  # a scale-down hits 0 replicas, the HPA controller can get stuck reporting
  # "scaling is disabled since the replica count of the target is zero" and
  # never scales back up on its own, even once the nfs_probe metric goes
  # healthy again - a known Kubernetes HPA scale-from-zero limitation, not
  # specific to this app. This nudges replicas back to 1 whenever it finds
  # them at 0; the HPA's own scaleDown policy (15s periodSeconds, 0s
  # stabilization) will scale back to 0 within moments if the probe is
  # genuinely still unhealthy, so this is a safe no-op in that case.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: ${APP}-nfs-scaler-unstick
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: unstick
              image: docker.io/rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
              env:
                - name: HOME
                  value: /tmp
              command:
                - sh
                - -c
                - |
                  kubectl scale ${CONTROLLER:=Deployment} ${NFS_SCALER_TARGET:=${APP}} --replicas=1 --current-replicas=0 || true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: tmp
              emptyDir: {}
