---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}-nfs-scaler-unstick
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-nfs-scaler-unstick
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-nfs-scaler-unstick
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-nfs-scaler-unstick
subjects:
  - kind: ServiceAccount
    name: ${APP}-nfs-scaler-unstick
