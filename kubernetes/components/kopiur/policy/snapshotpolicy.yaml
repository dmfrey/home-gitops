---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  # Consumer-side opt-in for credential projection (necessary but not
  # sufficient alone - the ClusterRepository owner must also set
  # credentialProjection.allowed: true, which it does). The mover Job runs
  # in the app's own namespace and loads creds via namespace-local envFrom,
  # but the garage ClusterRepository's Secret lives in kopiur-system.
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  mover:
    cache:
      # 2026-09-09: default raised 1Gi -> 5Gi (via an interim 2Gi). Every
      # mover Job's own KOPIA_LOG_DIR (cli-logs/content-logs) lives on this
      # same PVC and settles at a kopia-imposed steady-state of ~700-850MB
      # regardless of app or snapshot frequency (its own file-count
      # retention caps growth, not available space - confirmed via a
      # fleet-wide sweep, filed upstream as home-operations/kopiur#452, not
      # CRD-tunable). At 1Gi that left near-zero headroom for the actual
      # content cache and eventually failed snapshots outright with "no
      # space left on device" before backup logic even ran. Matches
      # github.com/onedr0p/home-ops's own proven-in-production default for
      # this exact field (they call it ${KOPIUR_CAPACITY:=5Gi} there).
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      mode: Persistent
      # Hardcoded (not the shared ${KOPIUR_STORAGECLASS} used by the actual
      # app-data PVC below and the deep-verify scratch target) - this cache
      # is disposable scratch/log space, not real backup content, so it
      # doesn't need Ceph's replication/HA. openebs-hostpath is node-local
      # single-copy storage on each node's dedicated small NVMe/SATA drive
      # (128GB, sitting at ~2% utilized before this), same tier already
      # used for actions-runner-controller's ephemeral work volumes.
      # Matches onedr0p/home-ops's own pattern exactly - they hardcode
      # this same field to their own dedicated "slow" storage class
      # (miroir-slow) rather than sharing it with the app-data PVC's
      # storage class variable.
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      fsGroupChangePolicy: OnRootMismatch
  repository:
    kind: ClusterRepository
    name: garage
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  # Both opt-in; absent means no verification runs at all. quick is cheap
  # blob-level sampling; deep actually restores into a scratch PVC on a
  # slower cadence, proving restorability automatically instead of relying
  # on one-off manual scratch-restores.
  verification:
    quick:
      schedule:
        cron: "H H * * *"
    deep:
      schedule:
        cron: "H H * * 0"
      # Without this, the deep-verify scratch-restore target falls back to a
      # node-local emptyDir, which isn't guaranteed to have room for a full
      # restore of the app's actual data - confirmed failing with "no space
      # left on device" on garage-system/garage's PVC (~10GB actual usage).
      # Default here is deliberately small/generic; any app with real data
      # anywhere close to this size should override KOPIUR_VERIFY_CAPACITY
      # explicitly in its own ks.yaml, matching (or exceeding) its
      # KOPIUR_CAPACITY.
      capacity: ${KOPIUR_VERIFY_CAPACITY:=5Gi}
      storageClassName: ${KOPIUR_STORAGECLASS:=ceph-block}
    verifyFilesPercent: 100
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
