---
# Throwaway dry run of the Envoy startup migration (home-gitops#5455,
# dmfrey/envoy#43/#91): a CNPG restore of the pre-7ab256e production backup
# plus a scratch Envoy, so the templating-009 migration can be timed and
# checked without touching production data. Lives in the log-ai namespace on
# purpose: Alloy drops everything from "log-ai" before the Envoy fan-out, so
# the scratch pods' logs cannot feed back into the production reducer. Remove
# the ./envoy-dr entry (and this directory) to tear it down.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-dr-infra
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: datastore
    - name: rabbitmq-cluster-operator
      namespace: datastore
  interval: 1h
  path: ./kubernetes/apps/log-ai/envoy-dr/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: log-ai
  wait: false
