---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Scratch Envoy backend for the startup-migration dry run (home-gitops#5455,
# dmfrey/envoy#43/#91): image 42e6890 against a restore of the pre-7ab256e
# production database (envoy-dr-cnpg). Same resources as production, own
# broker, no frontend, no route, nothing in Alloy points at it. Watch the
# Liquibase lines in the startup log for the migration time and result.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-dr
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-dr
  interval: 1h
  timeout: 20m
  values:
    controllers:
      backend:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 60
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy
              tag: 42e68905cd1999bb8107cffd09c09dee04100c18@sha256:01496aa96b473a486be54bd87b4db93992b2330b8174018ed1336fb487d252f8
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: dryrun
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              LOGGING_LEVEL_COM_BROADCOM_TANZU_ENVOY: info
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-cnpg-app
                    key: password
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-dr-rabbitmq-default-user
                    key: password
              # Same AI settings as production. The load test sends no
              # documents, so nothing is embedded or chatted with.
              SPRING_AI_OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              SPRING_AI_OPENAI_API_KEY: ""
              SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-embed-text
              SPRING_AI_OPENAI_CHAT_MODEL: qwen3:8b
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

    # In-cluster only; no route.
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
