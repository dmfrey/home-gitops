---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Scratch copy of log-ai/envoy-db/cnpg-cluster.yaml, same image and sizing so
# the load-test numbers compare, minus everything that persists data off the
# cluster: no barman/Garage archiving, no ScheduledBackup. Throwaway.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: envoy-lt-cnpg
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-1.1.1@sha256:bb7eb8442f76b1e74911f28585019a77022911f8cfa2ddcfb166ea6af85abd09

  managed:
    services:
      disabledDefaultServices:
        - ro

  bootstrap:
    initdb:
      dataChecksums: true
      database: envoy
      owner: envoy
      encoding: "UTF8"
      localeCollate: en_US.utf8
      localeCType: en_US.utf8

  monitoring:
    enablePodMonitor: false

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 128MB

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  storage:
    storageClass: ceph-block
    size: 5Gi

  walStorage:
    storageClass: ceph-block
    size: 2Gi
