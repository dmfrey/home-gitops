---
# Throwaway Envoy for the load test (home-gitops#5440, dmfrey/envoy#11): a
# second backend with its own database and broker so a replay at 20x/50x never
# touches the production templates/counts/anomalies. Lives in the log-ai
# namespace on purpose: Alloy's fan-out drops everything from the "log-ai"
# namespace before it reaches Envoy, so this deployment's own logs (and its
# database/broker logs) cannot feed back into the production reducer. Remove
# the whole ./envoy-lt entry (and this directory) to tear it down.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-lt-infra
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: datastore
    - name: rabbitmq-cluster-operator
      namespace: datastore
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: envoy-lt-cnpg
      namespace: log-ai
    - apiVersion: rabbitmq.com/v1beta1
      kind: RabbitmqCluster
      name: envoy-lt-rabbitmq
      namespace: log-ai
  interval: 1h
  path: ./kubernetes/apps/log-ai/envoy-lt/infra
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: log-ai
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-lt
spec:
  dependsOn:
    - name: envoy-lt-infra
  interval: 1h
  path: ./kubernetes/apps/log-ai/envoy-lt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: log-ai
  wait: false
