---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Scratch copy of the production Envoy backend (log-ai/app/helmrelease.yaml)
# for the load test (home-gitops#5440, dmfrey/envoy#11): same image digest and
# resources, its own database and broker, no frontend, no route, nothing in
# Alloy points at it. Only the in-cluster replayer talks to /v1/logs. Keep the
# image in step with production when comparing numbers.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-lt
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-lt
  interval: 1h
  values:
    controllers:
      backend:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 60
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy
              tag: 0f34a4d8f59029cb41366f4b4491b503f5b2cc74@sha256:049dd4df9551cf9cc1d451635cf2c50b2728927769d6de68272c50f65a334fa6
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: loadtest
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              LOGGING_LEVEL_COM_BROADCOM_TANZU_ENVOY: info
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-cnpg-app
                    key: password
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-lt-rabbitmq-default-user
                    key: password
              # Same AI settings as production. The load test sends no
              # documents, so nothing is embedded or chatted with.
              SPRING_AI_OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              SPRING_AI_OPENAI_API_KEY: ""
              SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-embed-text
              SPRING_AI_OPENAI_CHAT_MODEL: qwen3:8b
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

    # In-cluster only; no route.
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
