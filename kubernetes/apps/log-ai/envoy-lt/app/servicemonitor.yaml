---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
# Scrapes the scratch backend so envoy_reducer_*, JVM and heap series are
# recorded per run. Distinct from production's "envoy-backend" monitor by the
# service label, so the series are separable (service="envoy-lt").
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-lt
spec:
  selector:
    matchLabels:
      app.kubernetes.io/service: envoy-lt
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
