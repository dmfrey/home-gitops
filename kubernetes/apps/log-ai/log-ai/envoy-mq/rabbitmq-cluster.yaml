---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rabbitmq.com/rabbitmqcluster_v1beta1.json
# Broker for Envoy's anomaly events (the reducer publishes them via Spring
# AMQP). The queue only carries transient events, so unlike spring-notes-mq
# there is deliberately no kopiur SnapshotPolicy/Restore here: a lost PVC costs
# a few undelivered events, not data. Add backup only if that changes.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: envoy-rabbitmq
spec:
  replicas: 1
  # renovate: datasource=docker depName=rabbitmq versioning=loose
  image: rabbitmq:4.4-management@sha256:d6e0b463f6b4e1e840da82f28aa117c00b1b6a3009b1f418bd270741de0d8871
  rabbitmq:
    additionalConfig: |
      # The operator default (2GB) is larger than these PVCs, which raises a
      # permanent free-disk alarm that blocks every publisher. Events are
      # transient, so a small absolute floor is enough.
      disk_free_limit.absolute = 500MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: ceph-block
    storage: 2Gi
