---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: datastore
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: envoy-cnpg
      namespace: log-ai
  interval: 1h
  path: ./kubernetes/apps/log-ai/log-ai/envoy-db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: log-ai
  wait: false
# Future app (the reducer, built in a separate repo). Uncomment once its
# manifests exist under ./kubernetes/apps/log-ai/log-ai/app. Embedding
# dimension note for that app: it is fixed by the model (768 for
# nomic-embed-text), the same constraint documented in the spring-notes
# HelmRelease.
