---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Envoy log reducer (production), reachable over the Cloudflare tunnel
# (envoy-external) since 2026-10-24; it was internal-only before. One parent only
# (never both gateways: two CNAME targets made the UDM dnsmasq churn, #5333).
# Sign-in (Authentik) gates /api and /mcp. Its exemplars are real log lines, so
# everything unauthenticated must stay unreachable from the internet: /v1
# (ingest) and /actuator are internal-only by design, and /otlp answers 404
# because the frontend nginx proxies it to Alloy with no auth, so anyone could
# push traces into the observability stack. /api, /mcp and the OAuth
# protected-resource metadata go to the backend, everything else to the UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy
  annotations:
    # gatus-sidecar derives the URL from the first path match (/v1), which this
    # route answers with 404, so the check would always be red. Probe the UI
    # instead: it needs no sign-in and proves tunnel, gateway and frontend are up.
    gatus.home-operations.com/endpoint: |-
      url: "https://project-envoy.dmfrey.com/"
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - project-envoy.dmfrey.com
  parentRefs:
    # Naming: "envoy-external" is the Gateway that runs the Envoy *proxy*
    # (Envoy Gateway). It is unrelated to this app, the Envoy log reducer.
    #
    # https listener only (sectionName), like jellyfin and others: no plain-http
    # endpoint; http falls through to the cluster's catch-all 301 redirect.
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    # Ingest, actuator and the unauthenticated /otlp proxy must not be reachable
    # through the hostname (in-cluster use goes via the Service).
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /actuator
        - path:
            type: PathPrefix
            value: /otlp
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: envoy-not-found
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /mcp
        # MCP clients discover the authorization server here (RFC 9728); left
        # to the catch-all it would return the SPA page from the frontend.
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: envoy
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: envoy-frontend
          port: 80
