---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Pull secret for the private ghcr.io/dmfrey/envoy image. Built from a GitHub
# token with read:packages, kept in the 1Password item "envoy" (fields
# GHCR_USERNAME and GHCR_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name envoy-ghcr-pull
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"username":"{{ .GHCR_USERNAME }}","password":"{{ .GHCR_TOKEN }}","auth":"{{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: envoy
