---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  json: |-
    {
      "uid": "envoy-production",
      "title": "Envoy (Production)",
      "tags": [
        "envoy",
        "log-ai",
        "production"
      ],
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Backend pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(jvm_info{namespace=\"log-ai\", job=\"envoy\"}, pod)",
            "refresh": 2,
            "includeAll": true,
            "allValue": "envoy-backend-.*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "panels": [],
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Uptime",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "max(process_uptime_seconds{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Process CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "max(process_cpu_usage{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          }
        },
        {
          "type": "gauge",
          "title": "Heap Used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", area=\"heap\"}) * 100 / sum(jvm_memory_max_bytes{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", area=\"heap\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 4,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Heap After GC",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "max(jvm_gc_live_data_size_bytes{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "description": "Live data after the last full GC; the leak indicator. Compare across releases.",
          "id": 5,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Ingest Queue Depth",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1000
                  },
                  {
                    "color": "red",
                    "value": 5000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "max(envoy_reducer_ingest_queue_depth{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 6,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Log Records/s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(rate(envoy_reducer_log_records_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 7,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Windows Opened (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(envoy_reducer_detection_windows_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", event=\"opened\"}[24h])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 8,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Notifications Pending",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "max(envoy_reducer_notifications_pending{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"})",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 9,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Tickets Filed (24h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(envoy_reducer_tickets_filed_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", outcome=\"ok\"}[24h])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 10,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Log Errors (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(logback_events_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", level=\"error\"}[5m])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 11,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "HTTP 5xx (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", status=~\"5..\"}[5m])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "id": 12,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Ingest 429s (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", uri=\"/v1/logs\", status=\"429\"}[5m])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "description": "Backpressure on OTLP ingest (/v1/logs). Non-zero means Alloy is being told to slow down.",
          "id": 13,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 5
          }
        },
        {
          "type": "row",
          "title": "Ingest (OTLP /v1/logs)",
          "collapsed": false,
          "panels": [],
          "id": 14,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          }
        },
        {
          "type": "timeseries",
          "title": "Log Records/s by Layer",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 30
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (infra_layer) (rate(envoy_reducer_log_records_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{infra_layer}}"
            }
          ],
          "id": 15,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 10
          }
        },
        {
          "type": "timeseries",
          "title": "Log Records/s by Component (top 10)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "topk(10, sum by (infra_layer, infra_component) (rate(envoy_reducer_log_records_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval])))",
              "refId": "A",
              "legendFormat": "{{infra_layer}}/{{infra_component}}"
            }
          ],
          "id": 16,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 10
          }
        },
        {
          "type": "timeseries",
          "title": "Records by Severity Class",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 30
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (class) (rate(envoy_reducer_ingest_severity_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{class}}"
            }
          ],
          "id": 17,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 10
          }
        },
        {
          "type": "timeseries",
          "title": "Ingest Queue Depth",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(envoy_reducer_ingest_queue_depth{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"})",
              "refId": "A",
              "legendFormat": "queue depth"
            }
          ],
          "description": "Records waiting to be drained into templates. A rising line means ingest is outrunning templating.",
          "id": 18,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 18
          }
        },
        {
          "type": "timeseries",
          "title": "/v1/logs Requests by Status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", uri=\"/v1/logs\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "{{status}}"
            }
          ],
          "id": 19,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 18
          }
        },
        {
          "type": "timeseries",
          "title": "/v1/logs Latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", uri=\"/v1/logs\"}[$__rate_interval])) / sum(rate(http_server_requests_seconds_count{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", uri=\"/v1/logs\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "avg"
            },
            {
              "expr": "max(http_server_requests_seconds_max{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\", uri=\"/v1/logs\"})",
              "refId": "B",
              "legendFormat": "max"
            }
          ],
          "description": "Mean and window-max; this service does not export request-latency histograms.",
          "id": 20,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 18
          }
        },
        {
          "type": "row",
          "title": "Templating",
          "collapsed": false,
          "panels": [],
          "id": 21,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          }
        },
        {
          "type": "timeseries",
          "title": "Template Churn",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(envoy_reducer_templating_templates_new_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "new templates"
            },
            {
              "expr": "sum(rate(envoy_reducer_templating_folded_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "B",
              "legendFormat": "folded"
            },
            {
              "expr": "sum(rate(envoy_reducer_templating_converged_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "C",
              "legendFormat": "converged"
            },
            {
              "expr": "sum(rate(envoy_reducer_templating_evictions_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval])) or vector(0)",
              "refId": "D",
              "legendFormat": "evictions"
            },
            {
              "expr": "sum(rate(envoy_reducer_templating_counts_dropped_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval])) or vector(0)",
              "refId": "E",
              "legendFormat": "counts dropped"
            }
          ],
          "description": "New templates, merges of near-duplicates, and evictions. Counts dropped should stay at zero.",
          "id": 22,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 27
          }
        },
        {
          "type": "timeseries",
          "title": "Records Processed/s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(envoy_reducer_templating_records_processed_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "processed"
            },
            {
              "expr": "sum(rate(envoy_reducer_log_records_total{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval]))",
              "refId": "B",
              "legendFormat": "received"
            }
          ],
          "id": 23,
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 27
          }
        },
        {
          "type": "timeseries",
          "title": "Drain Duration by Source (top 10, mean)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "topk(10, sum by (source_key)(rate(envoy_reducer_templating_drain_duration_seconds_sum{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval])) / sum by (source_key)(rate(envoy_reducer_templating_drain_duration_seconds_count{namespace=\"log-ai\", job=\"envoy\", pod=~\"$pod\"}[$__rate_interval])))",
              "refId": "A",
              "legendFormat": "{{source_key}}"
            }
