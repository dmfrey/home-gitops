---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy
spec:
  chartRef:
    kind: OCIRepository
    name: envoy
  interval: 1h
  # Helm's default 5m action timeout rolled the upgrade back while the
  # templating-009 migration was still running (the backend only turns Ready
  # after Liquibase finishes). Keep this above the startup probe window.
  timeout: 20m
  values:
    controllers:
      backend:
        # Envoy keeps its Drain trees in memory and is single-instance by
        # design: exactly one replica, and Recreate so a rollout never runs
        # two at once.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: envoy-cnpg-app,envoy-rabbitmq-default-user,envoy-auth-secret
        pod:
          # Room for the @PreDestroy Drain snapshot on shutdown. Spring Boot's
          # graceful shutdown phase defaults to 30s, so this stays above it.
          terminationGracePeriodSeconds: 60
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy
              # renovate: datasource=docker depName=ghcr.io/dmfrey/envoy versioning=semver
              # Pinned to a commit-SHA tag: release-please has not cut a vX.Y.Z
              # release yet. Move to the semver tag (vX.Y.Z@sha256:...) once the
              # first release exists. 9083e54: flush drains counts before
              # templates and drops unresolvable count rows one at a time (counter
              # envoy_reducer_templating_counts_dropped_total) instead of losing the
              # whole batch to a template_counts FK race (envoy#97/#98), plus
              # envoy#95's fix (#96); no migration. On top of 42e6890: one-time Liquibase migration
              # (templating-009) deletes leftover rows of merged-away templates and
              # repoints template_alias/counts/history to the survivor (counts as
              # one aggregated upsert, ~46s on a restore of production), and the
              # runtime merge retires the loser row too (envoy#43/#90/#91/#94),
              # plus the envoy#92 fix (#93). Never 820f989 or 7ab256e: both fail
              # startup in templating-009 and would poison its Liquibase checksum.
              # On top of 0f34a4d: UI refactor - knowledge search, template
              # detail chart, anomalies inbox, tool-call audit view (envoy#48-51,
              # new tool_calls table). On top of a700b99: chat search_docs drops the version filter,
              # caps at 8 results and de-duplicates citations per document
              # (envoy#62). On top of ffa0ca8: chat search_docs no longer exposes the
              # doc_type filter (envoy#60). On top of d5c0239: case-insensitive product/version doc
              # filters so chat citations resolve, search_docs INFO logging
              # (envoy#56). On top of a45609a: chat title-generation call no longer
              # trips the search_docs ToolContext requirement, chat prompt v2
              # (envoy#56); frontend 63b5312: real URLs + list/detail layout
              # (envoy#47). On top of cb7c868: chat over the knowledge base (envoy#13,
              # new chat_sessions/chat_messages changeset) and the tree.clusters gauge
              # registers once per source (envoy#21), on top of f7a0d14: a converged-at-runtime loser cluster is
              # retired from the Drain tree/aggregator right after its merge instead
              # of being re-merged on every 60s flush (envoy#43/#46), on top of
              # aec2c91: template_counts for a merged-away
              # template id are redirected to the survivor via template_alias and
              # the counts save is isolated like the templates save (envoy#41),
              # on top of a1c2e0d: runtime template-convergence conflicts
              # merge into the surviving row instead of aborting the whole flush
              # (envoy#39), each template in a flush batch is isolated, the
              # shutdown snapshot runs even if the flush throws, the shutdown
              # order is fixed (envoy#38), and a full admin reset no longer wipes
              # the knowledge base (envoy#31). Builds on 4f2d738: one-time dedupe of templates with
              # duplicate (source_key, template_text) rows (re-run as 007 because
              # bdf0414 created more after 006 ran), a fix so evicted Drain
              # clusters are no longer recreated under new ids, a UNIQUE index on
              # (source_key, md5(template_text)) (a plain index on the raw text
              # failed on templates over ~2.7 KB, see home-gitops#5380), and
              # total_count / exemplars that survive a restart. On top of bdf0414
              # (structure-aware templating) and e7c2a55 (phase 3 AI client,
              # knowledge ingestion, async embedding, assist tools, ordered
              # graceful shutdown, Drain eviction metrics).
              # Release A (home-gitops#5537): 202deb1 brings sign-in (envoy#23),
              # the MCP server, secret masking (envoy#20), the NEW_TEMPLATE
              # re-fire fix with its one-time cleanup (envoy#171), in-memory
              # convergence (envoy#173), the paged anomalies API (envoy#175) and
              # the warm-up clock fix (envoy#168). Liquibase runs eleven
              # changesets at startup, detection-004 deleting the re-fired
              # anomalies. Rollback is a restore of the envoy-cnpg-pre-202deb1
              # backup, not an image revert. Previous:
              # 9083e54eb17dcf20c7b8efb755184f3ac75ab728@sha256:b1a95ee1e7691d28102265196e17b11e0523e4dcf3c9d413941039254079c1b4.
              # 9067af7 (#5585): metric cardinality fix (envoy#188/#190), scoped
              # Reset, logfmt masking, paged MCP. Previous (release A): 202deb1f639be3d8054e3ef12853aec1fd438a52@sha256:03d971f05d4863eb2d5f7afcbf4cfb1db658e81293a91a649541e1cc0b2d3663.
              # c513c4d (#5611): heap dump endpoint on by default (envoy#197), mask counts on
              # /admin/system (envoy#206), POST /api/deploys deploy-awareness (envoy#208),
              # doc links and inbox grouping. One new Liquibase changeset, deploys-001 (empty
              # table). Rollback: revert the images (the table is unused by the old image) or
              # restore envoy-cnpg-pre-c513c4d. Previous (9067af7): 9067af7814b81cbeb038584dd805b6a1d7584f30@sha256:d5582ea09928bec05a1ba2576dd66d4369364a4481a72afdf6b01f8c1734acba.
              # home-gitops#5645: 245d884 ships the step 4 round (envoy #211-#220: maintenance windows, hourly
              # rollup, detectors, windows, triage, event publishing, incident memory; all off by default) plus
              # incident citations in chat (#232) and the eval/knowledge-upload fixes (#16). Twelve additive
              # changesets (maintenance-001 .. incidents-001). Rollback: revert the images (additive schema) or
              # restore envoy-cnpg-pre-245d884. Previous (c513c4d): c513c4dd90b45993b3b2cadfe03f321022028102@sha256:9775cbd8b5a409cc9a90e14783bb48835078463af63cf4d89ecdf3d536c9b1fc.
              # home-gitops#5656: b75ebe6 adds masking of scale-suffixed counts (envoy#240), chat prompt v6
              # (#238, #239, #241) and the doc-link word gate (#237); one additive changeset (detection-015).
              # Rollback: revert the images. Previous (245d884): 245d884e836e1b2d7a247430e098a86e3ee10b8a@sha256:b5cefa2ce13f6e7da7539839e6b56b4c7c304dd3d3943d499f1581ff682fee32.
              # home-gitops#5677: 5669bc4 fixes the hourly-rollup / retire-fold deadlock on
              # template_counts_hourly (envoy#246): both writers now take row locks in the same order.
              # No changesets, no config. Backend only; the frontend stays on c72f408.
              # Rollback: revert the image. Previous (b75ebe6): b75ebe648037413d2bc9f60d9b3bfee59a51bab5@sha256:0d6d17500bde3e824b6729aa1b16972e325457749d6f60857aed1b1dc314e079.
              # home-gitops#5688: f144461 scopes window joins (envoy#266), closes windows against
              # post-placement state (envoy#263), returns incident summaries with a one-incident tool
              # (envoy#264, #254, #238), sweeps hourly rows orphaned by a concurrent merge (envoy#251),
              # chat prompt v9. No changesets, no config. Backend only. Rollback: revert the image
              # (no schema change; backup envoy-cnpg-pre-f144461 is a precaution). Previous (5669bc4): 5669bc4881949df3fc23d78cc07ff82f313a52db@sha256:9ac322ad27a3344246c63cbedd05f39a5ba95cea6442b1c41a5d4a45911dacd8.
              # home-gitops#5722: b187205 holds WINDOW_OPENED until the window has settled (envoy#276),
              # locks outbox rows in id order (#281), matches window subscriptions on any source (#273),
              # escapes the HTML email (#260), says when get_anomalies is partial (#254), bounds window
              # age (#288), and stops scanning the whole minute table for stats (#274). One additive
              # changeset (detection-016, a nullable announced_at column plus its backfill). The same
              # change sets -XX:MaxDirectMemorySize=64M below (envoy#293). Rollback: revert the images;
              # the flag can stay. Previous (f144461): f1444613299c7bb4812f298d00ac1190f13a9ddb@sha256:8fbf3486f29cf6582360a067b3d3f9e7911d0a8b476e038538d1811dbbc9df8b.
              # home-gitops#5736: 669e411 adds two Netty direct-memory gauges
              # (envoy_reducer_netty_direct_memory_used_bytes / _max_bytes) and logs a failed OIDC
              # sign-in at ERROR with its cause chain (envoy#293, PR #294). No changesets, no config;
              # keep -XX:MaxDirectMemorySize=64M below. Rollback: revert the images.
              # Previous (b187205): b1872058a16847116209fd44705396784979e091@sha256:0e4e309e16502744d49fd61fb12f0c6b49c3f30ceeb44044ec83df60c4cc1c6d.
              # home-gitops#5749: 8a894c5 (raw-log guards, prompt v11, incident email fixes). Changeset
              # notifications-003 makes idx_notification_deliveries_open_digest UNIQUE: rolling back needs
              # the images reverted AND the old non-unique index recreated (SQL in #5749); restore
              # envoy-cnpg-pre-8a894c5 only if the changeset itself fails. Keep -XX:MaxDirectMemorySize=64M.
              # Previous (669e411): 669e411fc9355b4775c242c7278983f019d319e3@sha256:e24127f08e5f1f65ba242ddd5e2c75ff355634b7571ac2e01c24c1ab324d2810.
              # home-gitops#5763: 67b4a86 (raw-log clamp and label refusals, prompt v12, incident email
              # members, folder mask via config). No changesets. Keep -XX:MaxDirectMemorySize=64M.
              # Rollback: revert both images (the three MASKING_ADDITIONALMASKS_0 vars may stay).
              # Previous (8a894c5): 8a894c50fe790d83cf9ad24bebbabdda52af5d52@sha256:ea430cee24f71123734c5211751445c0a320d8430fbdb46fd8004b8becc8d8f7.
              tag: 67b4a86bf96b96e5f85694fc7170b5f835b80116@sha256:690e491f50e84f8f79c1fa5f842139682223aa7b346d8393f7f86d354cc5f2dd
            # Authentik client id/secret for the "envoy" application, from the
            # 1Password item project-envoy (see externalsecret.yaml).
            envFrom:
              - secretRef:
                  name: envoy-auth-secret
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: homelab
              # Sign-in (envoy#23). Auth is on by default, so the pod will not
              # start without the client id/secret (envFrom above) and these.
              # The Authentik application is `envoy` (browser, confidential) and
              # `envoy-mcp` (public PKCE client used by MCP clients). Ticketing
              # and notifications stay off until release B (home-gitops#5537).
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE: openid,profile,email
              SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SSO_ISSUER_URI: https://auth.dmfrey.com/application/o/envoy/
              SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.dmfrey.com/application/o/envoy-mcp/
              ENVOY_REDUCER_AUTH_ACCOUNT_URL: https://auth.dmfrey.com/if/user/
              # Deployment-specific mask (envoy#325, #327; home-gitops#5763): soularr's
              # "Folder: <name> in cache." / "not in cache." lines minted ~216 templates a day
              # from album names. Appended after the built-in masks (so a folder like
              # "1999 Greatest Hits" arrives as "<NUM> ..." and is still masked); applies to every
              # source but only matches the Folder: label ahead of that fixed tail. Indexed env
              # vars avoid escaping the regex backslashes inside SPRING_APPLICATION_JSON; the
              # single quotes keep them literal.
              ENVOY_REDUCER_TEMPLATING_MASKING_ADDITIONALMASKS_0_NAME: folder-before-cache-tail
              ENVOY_REDUCER_TEMPLATING_MASKING_ADDITIONALMASKS_0_PATTERN: '(?<=\bFolder:\s)[^\n]+?(?=\s(?:not\s)?in cache\.)'
              ENVOY_REDUCER_TEMPLATING_MASKING_ADDITIONALMASKS_0_PLACEHOLDER: <VALUE>
              # Anomaly window grouping (envoy#217, home-gitops#5678). Turns on grouping only: the
              # RATE_CHANGE and DISAPPEARANCE/SOURCE_SILENT detectors, window triage and event
              # publishing stay off. Other window settings keep their defaults (join-gap 10m,
              # close-after 30m, lookback 2h, max-per-sweep 500, sweep-interval 2m).
              ENVOY_REDUCER_DETECTION_WINDOWS_ENABLED: "true"
              # Ticket filing through the in-cluster RT MCP server (home-gitops#5508). Enabled 2026-10-20
              # after the day-7 review (envoy#8). Files into the production "Envoy" queue and has
              # no automatic rules yet (manual "Create ticket" button only; rules are a later
              # change). The MCP has no auth of its own.
              ENVOY_REDUCER_TICKETS_ENABLED: "true"
              ENVOY_REDUCER_TICKETS_TRACKER: rt
              ENVOY_REDUCER_TICKETS_BASE_URL: https://project-envoy.dmfrey.com
              ENVOY_REDUCER_TICKETS_MCP_URL: http://rt-mcp.observability.svc.cluster.local:8013/mcp
              ENVOY_REDUCER_TICKETS_CREATE_TOOL: create_ticket_tool
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_QUEUE: Envoy
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_SUBJECT: "{subject}"
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_TEXT: "{body}"
              # Matches RT's real reply (verified on staging 2026-10-14).
              ENVOY_REDUCER_TICKETS_CREATE_SUCCESS_PATTERN: 'Ticket #(\d+) created'
              ENVOY_REDUCER_TICKETS_CREATE_URL_TEMPLATE: https://tickets.dmfrey.com/Ticket/Display.html?id={id}
              # Ticket status polling (envoy#147). Shape taken from a real
              # get_ticket_tool reply (2026-10-14): argument ticket_id, and a line
              # "  Status: new". Anchored to line start so a "Status:" inside a
              # subject can't match. No match is stored as unknown, not an error.
              ENVOY_REDUCER_TICKETS_STATUS_TOOL: get_ticket_tool
              # The tool's argument is "ticket_id", but Spring maps the env var
              # ..._ARGUMENTS_TICKET_ID to the key "ticket.id" (an env var cannot
              # carry an underscore in a map key), and the tool then rejects the
              # call. So this one argument goes in as JSON.
              ENVOY_REDUCER_TICKETS_STATUS_PATTERN: '(?m)^\s*Status: (\w+)\s*$'
              ENVOY_REDUCER_TICKETS_STATUS_CLOSED_VALUES: resolved,rejected,deleted
              # Anomaly notification email (home-gitops#5502). Goes out through the
              # cluster's smtp-relay, which has no inbound auth and no TLS; it holds
              # the upstream credentials and uses STARTTLS on its own outbound hop,
              # so Envoy sets no username, password or STARTTLS. The relay's only
              # configured sender is the noreply address below. Only people
              # who subscribed at /settings/notifications receive anything.
              SPRING_MAIL_HOST: smtp-relay.kube-system.svc.cluster.local
              SPRING_MAIL_PORT: "25"
              ENVOY_REDUCER_NOTIFICATIONS_ENABLED: "true"
              ENVOY_REDUCER_NOTIFICATIONS_EMAIL_ENABLED: "true"
              ENVOY_REDUCER_NOTIFICATIONS_EMAIL_FROM: noreply@homelab5767.cc
              ENVOY_REDUCER_NOTIFICATIONS_BASE_URL: https://project-envoy.dmfrey.com
              # Narrow each anomaly's doc search to the product its source belongs to
              # (home-gitops#5644, envoy#17): relevance scores alone cannot tell a good
              # match from a bad one. Values match the lowercase `product` tag exactly as
              # uploaded (see /knowledge). Only sources with one obvious owner are
              # mapped; the rest keep searching everything. SPRING_APPLICATION_JSON,
              # because a plain env var cannot carry map keys containing '/' (or an underscore, as in
              # the ticket status argument ticket_id). The keys are in
              # bracket form: Spring drops every character outside [a-z0-9-.] from an unbracketed
              # Map key, so a bare infra/storage would have bound as infrastorage and matched nothing.
              SPRING_APPLICATION_JSON: '{"envoy":{"reducer":{"detection":{"doc-links":{"source-products[infra/storage]":{"product":"ceph"},"source-products[infra/talos]":{"product":"talos"},"source-products[infra/object-storage]":{"product":"garage"},"source-products[platform/flux-system]":{"product":"flux"}}},"tickets":{"status":{"arguments":{"ticket_id":"{externalId}"}}}}}}'
              # Raw-log tool (query_raw_logs, envoy#16/#5647). The property default is
              # http://localhost:3100, i.e. the pod itself, so every call was refused.
              # The Loki gateway is the same path Grafana's datasource uses; Loki has
              # auth_enabled: false, so no tenant header is needed.
              ENVOY_REDUCER_ASSIST_LOKI_BASE_URL: http://loki-gateway.observability.svc.cluster.local
              # Same pod-instance wiring as spring-notes. Name must sort before
              # OTEL_RESOURCE_ATTRIBUTES: the chart renders env alphabetically
              # and $(VAR) only expands if VAR is defined earlier.
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              # Metrics come from the ServiceMonitor scrape of
              # /actuator/prometheus. The app also defaults to pushing the same
              # meters over OTLP, which would create a second series per meter.
              # Traces still go to Alloy over OTLP.
              MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              # The app defaults its own package to debug. Info here keeps the
              # per-request lines out of the pipeline, and matters once Alloy
              # ships logs back into Envoy.
              LOGGING_LEVEL_COM_BROADCOM_TANZU_ENVOY: info
              # CNPG auto-creates envoy-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: password
              # RabbitMQ Cluster Operator auto-creates envoy-rabbitmq-default-user
              # with host/port/username/password, same shape as CNPG's app secret.
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: password
              # Phase 3 AI client: Ollama's OpenAI-compatible endpoint. The API
              # key is present but explicitly empty: that is Spring AI's
              # no-auth signal for a keyless server (unset is not the same).
              SPRING_AI_OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              SPRING_AI_OPENAI_API_KEY: ""
              # Non-deprecated names (Spring AI 2.0.1). The older ..._OPTIONS_MODEL
              # names write a different key than Envoy's own application.yml
              # default (spring.ai.openai.chat.model: qwen2.5:0.5b), so the
              # override might not have won. Values unchanged.
              SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-embed-text
              # qwen3:8b confirmed by the tool-calling test on dmfrey/envoy#12
              # (args 18/21 vs 12/21 for qwen2.5:7b-instruct, same tool accuracy,
              # 3.4 s median latency; thinking arrives in a separate field).
              SPRING_AI_OPENAI_CHAT_MODEL: qwen3:8b
              # Write a heap dump when the JVM runs out of heap (envoy#189), so the
              # next OOM can be diagnosed. The Paketo launcher appends its own memory
              # flags after this, so they are kept. The dump goes to the emptyDir at
              # /dumps below (about the size of the heap, ~1.3 GiB).
              # envoy#293 (2026-10-23): Netty's direct-memory cap was the buildpack default of
              # 10 MiB and ran out after about 16 h, which broke SSO sign-in (new TLS connections
              # could not allocate buffers). An explicit flag is kept by the memory calculator, which
              # subtracts it from the heap budget (about 54 MiB less -Xmx; heap after GC is ~130 MiB).
              JAVA_TOOL_OPTIONS: -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps -XX:MaxDirectMemorySize=64M
            probes:
              # The first start runs the Liquibase migrations, so give startup
              # room (up to 600s) before liveness takes over. 150s was too
              # short for templating-009 (retires ~20k aliased template rows
              # in one transaction): the probe killed the pod mid-migration,
              # which rolled back and retried forever (2026-10-11).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy-frontend
              # renovate: datasource=docker depName=ghcr.io/dmfrey/envoy-frontend versioning=semver
              # The frontend image is only rebuilt when frontend files change, so it
              # can lag the backend's commit: 4350f59 (knowledge admin UI) is
              # still its latest build.
              # Release A: 8a5ab21 (sign-in and sign-out flows, deep links, paged
              # anomalies inbox). Deploy with the matching backend. Previous:
              # 7272872da1c8a7a900c760fc4e8fd6200f8a0285@sha256:a65d962e0e949d5acb258264357a91d4ff80bb4e7c75f0a72cbcc4810fb20005.
              # 1650590 (#5585): scoped Reset page. Previous: 8a5ab21d96b0534171aca8d48ec04c5f3786d35b@sha256:7d828df8e91caa49769d58e1800564d7337ebde0be5f97a599311eb0c58c5dec.
              # ffa19ec (#5611): error panel instead of a blank screen (envoy#209), plus the
              # chat, inbox and doc-link UI that shipped with 972c289. Previous (1650590): 1650590ec642a24c01d9d0e9740e1efcdeea810a@sha256:2d6bbd37fb732ce30e57147e630bfb31009a8847a6d2afce6749935527785eec.
              # home-gitops#5645: 245d884, same commit as the backend. Previous (ffa19ec): ffa19ecffc886201da3cfd7fec585fcfb1b6214d@sha256:152047ede2360664963d75007d88749d0acee2de46b81a63989d6de115523f92.
              # home-gitops#5656: c72f408 (no newer frontend build; #247 changed no frontend files).
              # Previous (245d884): 245d884e836e1b2d7a247430e098a86e3ee10b8a@sha256:e0fde006488b874ecf2944dd408a4938a518bc0c84d179c39cd18763d5868c16.
              # home-gitops#5722: fadd7d3 (HTML email, announce-after and stats label UI).
