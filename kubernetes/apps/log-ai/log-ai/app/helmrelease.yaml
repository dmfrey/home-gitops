---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy
spec:
  chartRef:
    kind: OCIRepository
    name: envoy
  interval: 1h
  values:
    controllers:
      backend:
        # Envoy keeps its Drain trees in memory and is single-instance by
        # design: exactly one replica, and Recreate so a rollout never runs
        # two at once.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: envoy-cnpg-app,envoy-rabbitmq-default-user
        pod:
          # Room for the @PreDestroy Drain snapshot on shutdown. Spring Boot's
          # graceful shutdown phase defaults to 30s, so this stays above it.
          terminationGracePeriodSeconds: 60
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy
              # renovate: datasource=docker depName=ghcr.io/dmfrey/envoy versioning=semver
              # Pinned to a commit-SHA tag: release-please has not cut a vX.Y.Z
              # release yet. Move to the semver tag (vX.Y.Z@sha256:...) once the
              # first release exists. aec2c91: template_counts for a merged-away
              # template id are redirected to the survivor via template_alias and
              # the counts save is isolated like the templates save (envoy#41),
              # on top of a1c2e0d: runtime template-convergence conflicts
              # merge into the surviving row instead of aborting the whole flush
              # (envoy#39), each template in a flush batch is isolated, the
              # shutdown snapshot runs even if the flush throws, the shutdown
              # order is fixed (envoy#38), and a full admin reset no longer wipes
              # the knowledge base (envoy#31). Builds on 4f2d738: one-time dedupe of templates with
              # duplicate (source_key, template_text) rows (re-run as 007 because
              # bdf0414 created more after 006 ran), a fix so evicted Drain
              # clusters are no longer recreated under new ids, a UNIQUE index on
              # (source_key, md5(template_text)) (a plain index on the raw text
              # failed on templates over ~2.7 KB, see home-gitops#5380), and
              # total_count / exemplars that survive a restart. On top of bdf0414
              # (structure-aware templating) and e7c2a55 (phase 3 AI client,
              # knowledge ingestion, async embedding, assist tools, ordered
              # graceful shutdown, Drain eviction metrics).
              tag: aec2c91ac66ca4c8ad9735436206cbd19de00608@sha256:80fa12f01e9b639a85f22510d7f77d739a1c6f2dd4f12f91af87abc889f29672
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: homelab
              # Same pod-instance wiring as spring-notes. Name must sort before
              # OTEL_RESOURCE_ATTRIBUTES: the chart renders env alphabetically
              # and $(VAR) only expands if VAR is defined earlier.
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              # Metrics come from the ServiceMonitor scrape of
              # /actuator/prometheus. The app also defaults to pushing the same
              # meters over OTLP, which would create a second series per meter.
              # Traces still go to Alloy over OTLP.
              MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              # The app defaults its own package to debug. Info here keeps the
              # per-request lines out of the pipeline, and matters once Alloy
              # ships logs back into Envoy.
              LOGGING_LEVEL_COM_BROADCOM_TANZU_ENVOY: info
              # CNPG auto-creates envoy-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-cnpg-app
                    key: password
              # RabbitMQ Cluster Operator auto-creates envoy-rabbitmq-default-user
              # with host/port/username/password, same shape as CNPG's app secret.
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-rabbitmq-default-user
                    key: password
              # Phase 3 AI client: Ollama's OpenAI-compatible endpoint. The API
              # key is present but explicitly empty: that is Spring AI's
              # no-auth signal for a keyless server (unset is not the same).
              SPRING_AI_OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              SPRING_AI_OPENAI_API_KEY: ""
              # Non-deprecated names (Spring AI 2.0.1). The older ..._OPTIONS_MODEL
              # names write a different key than Envoy's own application.yml
              # default (spring.ai.openai.chat.model: qwen2.5:0.5b), so the
              # override might not have won. Values unchanged.
              SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-embed-text
              # qwen3:8b confirmed by the tool-calling test on dmfrey/envoy#12
              # (args 18/21 vs 12/21 for qwen2.5:7b-instruct, same tool accuracy,
              # 3.4 s median latency; thinking arrives in a separate field).
              SPRING_AI_OPENAI_CHAT_MODEL: qwen3:8b
            probes:
              # The first start runs the Liquibase migrations, so give startup
              # room (up to 150s) before liveness takes over.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy-frontend
              # renovate: datasource=docker depName=ghcr.io/dmfrey/envoy-frontend versioning=semver
              # The frontend image is only rebuilt when frontend files change, so it
              # can lag the backend's commit: 4350f59 (knowledge admin UI) is
              # still its latest build.
              tag: 4350f590ae0546b4c01650d12fc4ae90e3aa6832@sha256:94021160944dc4820f44aca33da5d9b22df1d73a0114402b98e0818b929d8fa6
            # Explicit port: the frontend has no app-template Service (its
            # Service is the standalone service-frontend.yaml), and a probe
            # with custom: false derives its port from the chart's service,
            # which rendered as port 0 and was rejected by the API server.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    # In-cluster only. The routed paths are defined in httproute.yaml;
    # /v1/logs (ingest) and /actuator are deliberately not reachable through the
    # gateway. This is the chart's only service, so app-template names it plain
    # "envoy" - which the frontend image needs: its nginx proxies /api/ to
    # http://envoy:8080 and resolves that name at startup, so a Service called
    # exactly "envoy" must exist or nginx refuses to start. Alloy's exporter
    # (PR B) uses the same name: http://envoy.log-ai.svc.cluster.local:8080.
    # The frontend's Service is the standalone service-frontend.yaml.
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
