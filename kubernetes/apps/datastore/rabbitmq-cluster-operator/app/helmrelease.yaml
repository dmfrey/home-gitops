---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq-cluster-operator

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: rabbitmq-cluster-operator

  values:
    # Bitnami pulled these tags from the free docker.io/bitnami/* namespace
    # (Broadcom's ongoing Bitnami Secure Images migration) - bitnamilegacy is
    # Bitnami's own frozen mirror of the last free images, same tags.
    clusterOperator:
      image:
        repository: bitnamilegacy/rabbitmq-cluster-operator
    msgTopologyOperator:
      image:
        repository: bitnamilegacy/rmq-messaging-topology-operator

  install:
    remediation:
      retries: -1

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  uninstall:
    keepHistory: false
