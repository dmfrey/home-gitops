---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name envoy-runner

spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-envoy

  interval: 1h

  values:
    githubConfigUrl: https://github.com/dmfrey/envoy
    githubConfigSecret: envoy-runner-secret

    minRunners: 1
    maxRunners: 3

    # Docker-in-Docker so Testcontainers works: the chart adds a privileged
    # docker:dind sidecar and points the runner at it over a shared socket.
    # Privileged means job code is close to root on the node - keep this
    # runner to a repo with trusted contributors and no fork PRs.
    containerMode:
      type: dind
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system

    template:
      spec:
        # Pod-level, so it covers the runner and the dind sidecar together (the
        # chart gives no way to set the sidecar's own resources). Without it the
        # pod is BestEffort and Talos's OOM controller kills it first under
        # memory pressure (2026-10-13: a Gradle + Testcontainers job died).
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            memory: 10Gi
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.0@sha256:7ece17219b5ce764fff8bd2206bf66a612580fdc82d84b0097fbe6f4e8729801
            command:
              - /home/runner/run.sh
        serviceAccountName: *name
