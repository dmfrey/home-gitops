---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name envoy-runner

spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-envoy

  interval: 1h

  values:
    githubConfigUrl: https://github.com/dmfrey/envoy
    githubConfigSecret: envoy-runner-secret

    minRunners: 1
    maxRunners: 3

    # Docker-in-Docker so Testcontainers works: the chart adds a privileged
    # docker:dind sidecar and points the runner at it over a shared socket.
    # Privileged means job code is close to root on the node - keep this
    # runner to a repo with trusted contributors and no fork PRs.
    containerMode:
      type: dind
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system

    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.338.0@sha256:c867ecdf82d4e8537ea8a41acc6addae09f069daec137e5614b87e4678a953e8
            command:
              - /home/runner/run.sh
        serviceAccountName: *name
