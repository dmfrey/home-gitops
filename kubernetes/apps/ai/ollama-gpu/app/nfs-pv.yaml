---
# UNAS Pro migration (2026-09-29): app-template's persistence.type: nfs
# shorthand maps to a plain Kubernetes v1.NFSVolumeSource, which has no
# mountOptions field at all - only PersistentVolume.spec.mountOptions
# supports it. The UNAS Pro speaks NFSv4.1 as of 2026-11-27 (was v3-only, hence the old vers=4.1) (confirmed
# via its own web UI) and Talos nodes default to NFSv4.1 (deliberate
# global /etc/nfsmount.conf tuning for the old QNAP, see
# talos/machineconfig.yaml.j2), so this mount needs an explicit static
# PV/PVC pair instead of the usual shorthand.
# 2026-11-16: restored to the rebuilt UNAS pool (copied back from the QNAP).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-gpu-models
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=4.1
  nfs:
    server: nas.internal
    path: /ai_models
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-gpu-models
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: ollama-gpu-models
  storageClassName: ""
