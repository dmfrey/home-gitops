---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama-gpu

spec:
  chartRef:
    kind: OCIRepository
    name: ollama-gpu

  interval: 1h

  valuesFrom:
    - kind: ConfigMap
      name: ollama-gpu-values

  values:
    controllers:
      ollama-gpu:
        type: statefulset
        # 2026-07-30: eGPU driver-load hang resolved (NVreg_EnableGpuFirmware=0,
        # see talos/nodes/192.168.30.12.yaml.j2) - RTX 3090 confirmed working via
        # gpu.nvidia.com ResourceSlice. Scaling up to test end-to-end.
        replicas: 1

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              tag: "0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2"

            env:
              TZ: America/New_York
              OLLAMA_HOST: 0.0.0.0
              OLLAMA_ORIGINS: "*"
              OLLAMA_MODELS: /models
              OLLAMA_KEEP_ALIVE: "-1"
              # Non-root has no /etc/passwd entry for uid 1000 by default and
              # /root itself is 0700 root:root anyway (confirmed unreachable
              # even though .ollama's own contents already had a permissive
              # group). Existing id_ed25519 (ollama.com push/pull signing
              # key) is 0600 owner-only regardless of path, so it'll
              # regenerate fresh here - this cluster doesn't push models
              # publicly, harmless.
              HOME: /home/ollama

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              claims:
                - name: gpu
              requests:
                cpu: 200m
                memory: 4Gi
              limits:
                memory: 24Gi

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: ollama-gpu
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: "kubernetes.io/hostname"
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - "{{ .Release.Name }}"

    service:
      app:
        # forceRename: Home Assistant's Ollama/LLM Vision integrations are
        # configured against "ollama.ai.svc.cluster.local" (the old CPU
        # ollama's Service name) - keep that hostname stable so nothing in
        # HA needs reconfiguring now that ollama-gpu serves traffic instead.
        forceRename: ollama
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.29.241
        ports:
          http:
            port: 11434

    route:
      app:
        hostnames:
          - ollama.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/ollama/.ollama

      models:
        type: nfs
        server: nas.internal
        path: /models
        globalMounts:
          - path: /models

      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
