---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama-gpu

spec:
  chartRef:
    kind: OCIRepository
    name: ollama-gpu

  interval: 1h

  valuesFrom:
    - kind: ConfigMap
      name: ollama-gpu-values

  values:
    controllers:
      ollama-gpu:
        type: statefulset
        # 2026-07-30: eGPU driver-load hang resolved (NVreg_EnableGpuFirmware=0,
        # see talos/nodes/192.168.30.12.yaml.j2) - RTX 3090 confirmed working via
        # gpu.nvidia.com ResourceSlice. Scaling up to test end-to-end.
        replicas: 1

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              tag: "0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec"

            env:
              TZ: America/New_York
              OLLAMA_HOST: 0.0.0.0
              OLLAMA_ORIGINS: "*"
              OLLAMA_MODELS: /models
              OLLAMA_KEEP_ALIVE: "-1"
              # Envoy calls Ollama's OpenAI-compatible /v1 routes, which cannot
              # set context size per request, so this server default applies to
              # every model and large tool results were being silently
              # truncated. Applies to all models (each uses more VRAM for its KV
              # cache); re-measure with a candidate loaded (home-gitops#5364).
              OLLAMA_CONTEXT_LENGTH: "32768"
              # Non-root has no /etc/passwd entry for uid 1000 by default and
              # /root itself is 0700 root:root anyway (confirmed unreachable
              # even though .ollama's own contents already had a permissive
              # group). Existing id_ed25519 (ollama.com push/pull signing
              # key) is 0600 owner-only regardless of path, so it'll
              # regenerate fresh here - this cluster doesn't push models
              # publicly, harmless.
              HOME: /home/ollama

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              claims:
                - name: gpu
              # 2026-11-19: OOMKilled at 24Gi (exit 137, 14:01Z). Working set sat at
              # 21-22Gi for hours with three models resident (qwen3:8b,
              # qwen2.5vl:7b, nomic-embed-text, all 100% GPU): llama.cpp's host-RAM
              # prompt cache is capped at 8Gi per server and fills with ~0.8Gi
              # entries from 15k-token prompts, on top of mmapped model page cache.
              # k8s-2 (64Gi) sat at 47% used, so raise the limit rather than shrink
              # the cache; request matches observed use since the pod is pinned here.
              requests:
                cpu: 200m
                memory: 16Gi
              limits:
                memory: 32Gi

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: ollama-gpu
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: "kubernetes.io/hostname"
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - "{{ .Release.Name }}"

    service:
      app:
        # forceRename: Home Assistant's Ollama/LLM Vision integrations are
        # configured against "ollama.ai.svc.cluster.local" (the old CPU
        # ollama's Service name) - keep that hostname stable so nothing in
        # HA needs reconfiguring now that ollama-gpu serves traffic instead.
        forceRename: ollama
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.29.241
        ports:
          http:
            port: 11434

    route:
      app:
        hostnames:
          - ollama.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/ollama/.ollama

      models:
        type: persistentVolumeClaim
        existingClaim: ollama-gpu-models
        globalMounts:
          - path: /models

      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
