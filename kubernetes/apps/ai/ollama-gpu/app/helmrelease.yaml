---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama-gpu

spec:

  chartRef:
    kind: OCIRepository
    name: ollama-gpu

  interval: 1h

  valuesFrom:
    - kind: ConfigMap
      name: ollama-gpu-values

  values:

    controllers:
      ollama-gpu:
        type: statefulset
        # 2026-07-30: eGPU driver-load hang resolved (NVreg_EnableGpuFirmware=0,
        # see talos/nodes/192.168.30.12.yaml.j2) - RTX 3090 confirmed working via
        # gpu.nvidia.com ResourceSlice. Scaling up to test end-to-end.
        replicas: 1

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              tag: "0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42"

            env:
              TZ: America/New_York
              OLLAMA_HOST: 0.0.0.0
              OLLAMA_ORIGINS: "*"
              OLLAMA_MODELS: /models
              OLLAMA_KEEP_ALIVE: "-1"

            resources:
              claims:
                - name: gpu
              requests:
                cpu: 200m
                memory: 4Gi
              limits:
                memory: 24Gi

        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: ollama-gpu
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: "kubernetes.io/hostname"
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - "{{ .Release.Name }}"

    service:
      app:
        # forceRename: Home Assistant's Ollama/LLM Vision integrations are
        # configured against "ollama.ai.svc.cluster.local" (the old CPU
        # ollama's Service name) - keep that hostname stable so nothing in
        # HA needs reconfiguring now that ollama-gpu serves traffic instead.
        forceRename: ollama
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.29.241
        ports:
          http:
            port: 11434

    route:
      app:
        hostnames:
          - ollama.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /root/.ollama

      models:
        type: nfs
        server: nas.internal
        path: /models
        globalMounts:
          - path: /models

      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
