---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencode

spec:
  chartRef:
    kind: OCIRepository
    name: opencode

  interval: 1h

  values:
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/anomalyco/opencode
              tag: 1.18.23@sha256:182959d5ae507fa2b3dcfd6ec247ad625b7f15539977dd0620f43f7e24c78229

            command:
              - opencode
            args:
              - web
              - --hostname
              - 0.0.0.0
              - --port
              - "4096"

            env:
              TZ: America/New_York
              # Points a plain, cross-project config file rather than relying
              # on $HOME/.config resolution inside the container.
              OPENCODE_CONFIG: /config/opencode.json

            envFrom:
              - secretRef:
                  name: opencode-secret

            probes:
              # httpGet can't carry the Basic-auth credentials opencode now
              # requires on every path (including /) once
              # OPENCODE_SERVER_PASSWORD is set (unauthenticated / worked on
              # 1.0.196, no longer does as of 1.18.15) - exec + wget's
              # userinfo-in-URL auth lets the probe read the password from
              # its own env (envFrom: opencode-secret) instead of embedding
              # it in this manifest.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - wget -q -O /dev/null "http://opencode:$${OPENCODE_SERVER_PASSWORD}@127.0.0.1:4096/"
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes

            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        ports:
          http:
            port: 4096

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] < 400"]
            url: "http://opencode-app.ai.svc.cluster.local"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: OpenCode
          gethomepage.dev/icon: opencode.png
          gethomepage.dev/description: Shared AI coding agent session (local Ollama).
          gethomepage.dev/pod-selector: app.kubernetes.io/name=opencode
        hostnames:
          - opencode.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      outpost:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /outpost.goauthentik.io/ping
            conditions: ["[STATUS] == 204"]
        hostnames:
          - opencode.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
            backendRefs:
              - name: ak-outpost-authentik-embedded-outpost
                namespace: security
                port: 9000

    persistence:
      # Confirmed via kubectl exec into a debug pod running this exact image:
      # session/history state lives under the XDG data dir, not
      # /root/.opencode (that was a bad guess from a community Docker
      # example for an older version). A single PVC can only be mounted at
      # one path without cross-contaminating content, so this covers the
      # primary data dir only - /root/.local/state/opencode is left on the
      # ephemeral container filesystem (observed empty besides being XDG
      # boilerplate; nothing user-visible was found there).
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /root/.local/share/opencode

      config:
        type: configMap
        name: opencode-config
        globalMounts:
          - path: /config/opencode.json
            subPath: opencode.json
            readOnly: true
