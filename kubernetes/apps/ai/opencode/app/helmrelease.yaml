---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencode

spec:
  chartRef:
    kind: OCIRepository
    name: opencode

  interval: 1h

  values:
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/anomalyco/opencode
              tag: 1.18.26@sha256:494e9bc5de428686aa6656141f231a67aa4d2e8abd55080367277edb88c3f3ba

            command:
              - opencode
            args:
              - web
              - --hostname
              - 0.0.0.0
              - --port
              - "4096"

            env:
              TZ: America/New_York
              # Non-root has no /etc/passwd entry for uid 1000, so $HOME
              # would otherwise resolve to "/" (unwritable) - point it
              # somewhere real. XDG_DATA_HOME is a clean top-level mount
              # rather than nested under $HOME: nesting a second volume
              # inside the $HOME emptyDir makes kubelet auto-create the
              # intermediate .local/.local-share dirs as root-owned 0755
              # (not group-writable), breaking sibling mkdir for
              # .local/state - confirmed via a throwaway fact-finding rig
              # (hardening-test namespace, 2026-08-29).
              HOME: /home/opencode
              XDG_DATA_HOME: /data
              # Points a plain, cross-project config file rather than relying
              # on $HOME/.config resolution inside the container.
              OPENCODE_CONFIG: /config/opencode.json

            envFrom:
              - secretRef:
                  name: opencode-secret

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            probes:
              # httpGet can't carry the Basic-auth credentials opencode now
              # requires on every path (including /) once
              # OPENCODE_SERVER_PASSWORD is set (unauthenticated / worked on
              # 1.0.196, no longer does as of 1.18.15) - exec + wget's
              # userinfo-in-URL auth lets the probe read the password from
              # its own env (envFrom: opencode-secret) instead of embedding
              # it in this manifest.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - wget -q -O /dev/null "http://opencode:$${OPENCODE_SERVER_PASSWORD}@127.0.0.1:4096/"
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes

            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: 4096

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] < 400"]
            url: "http://opencode-app.ai.svc.cluster.local"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: OpenCode
          gethomepage.dev/icon: opencode.png
          gethomepage.dev/description: Shared AI coding agent session (local Ollama).
          gethomepage.dev/pod-selector: app.kubernetes.io/name=opencode
        hostnames:
          - opencode.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
      outpost:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /outpost.goauthentik.io/ping
            conditions: ["[STATUS] == 204"]
        hostnames:
          - opencode.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
            backendRefs:
              - name: ak-outpost-authentik-embedded-outpost
                namespace: security
                port: 9000

    persistence:
      # Confirmed via kubectl exec into a debug pod running this exact image:
      # session/history state lives under the XDG data dir ($XDG_DATA_HOME
      # or, if unset, $HOME/.local/share), not /root/.opencode (that was a
      # bad guess from a community Docker example for an older version).
      # Mounted at a clean top-level path via XDG_DATA_HOME above rather
      # than nested under /home/opencode - see the env var comment.
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data

      config:
        type: configMap
        name: opencode-config
        globalMounts:
          - path: /config/opencode.json
            subPath: opencode.json
            readOnly: true

      # $HOME for everything else opencode/Bun write there directly
      # (.local/state, .cache, .config defaults) - not nested with any
      # other volume, so the app's own mkdir calls just work.
      home:
        type: emptyDir
        globalMounts:
          - path: /home/opencode

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
