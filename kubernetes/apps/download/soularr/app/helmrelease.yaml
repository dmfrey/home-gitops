---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soularr
spec:
  chartRef:
    kind: OCIRepository
    name: soularr
  interval: 1h
  values:
    controllers:
      soularr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mrusse/soularr
              tag: 1.2.2@sha256:c4f97924fabfce4e0de539d821ea7d20519b95c4815a707bacfc9d7212597f20
            env:
              TZ: America/New_York
              SCRIPT_INTERVAL: 300
              WEBUI_ENABLED: true
            probes:
              # No dedicated health endpoint upstream - "/" is a plain Flask
              # route on the bundled webui, good enough as a liveness signal.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8265
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Soularr
          gethomepage.dev/description: Lidarr <-> Soulseek Bridge
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # soularr reads/writes config.ini and soularr.log under /data, not
      # /config - the app-template default mount path (matching the
      # persistence key name) is wrong for this app.
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      config-file:
        type: secret
        name: "{{ .Release.Name }}-secret"
        globalMounts:
          - path: /data/config.ini
            subPath: config.ini
      # Must match slskd's own `directories.downloads` path physically -
      # this is how soularr verifies a download actually landed before
      # triggering Lidarr's import.
      downloads:
        type: nfs
        server: nas.internal
        path: /media
        globalMounts:
          - path: /downloads
            subPath: downloads/slskd/complete
