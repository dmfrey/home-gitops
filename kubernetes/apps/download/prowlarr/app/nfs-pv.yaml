---
# Prowlarr's own config backups, on the same physical app_backups NFS
# export the media-namespace app-backups PV/PVC uses (see
# kubernetes/apps/media/app-backups/app/nfs-pv.yaml) - PVCs are
# namespace-scoped, so this is a separate Kubernetes object pointing at
# the identical underlying share.
# 2026-11-12 UNAS BAD BLOCKS: pointed at the QNAP (192.168.30.2) copy until the UNAS pool is
# rebuilt. PV spec.nfs is immutable: changing it means deleting the PV and PVC first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-backups-prowlarr
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /app_backups
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-backups-prowlarr
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: app-backups-prowlarr
  storageClassName: ""
