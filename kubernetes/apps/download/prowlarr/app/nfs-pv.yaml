---
# Prowlarr's own config backups, on the same physical app_backups NFS
# export the media-namespace app-backups PV/PVC uses (see
# kubernetes/apps/media/app-backups/app/nfs-pv.yaml) - PVCs are
# namespace-scoped, so this is a separate Kubernetes object pointing at
# the identical underlying share.
# 2026-11-16: UNAS pool rebuilt (RAID6, new pool UUID); restored from the QNAP copy.
# PV spec.nfs is immutable: changing it means deleting the PV and PVC first. The
# share's export path ends in /.data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-backups-prowlarr
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=4.1
  nfs:
    server: nas.internal
    path: /app_backups
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-backups-prowlarr
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: app-backups-prowlarr
  storageClassName: ""
