---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flaresolverr-restart
spec:
  # FlareSolverr launches a real headless Chromium instance per
  # request/session; memory grows steadily over days and doesn't fully
  # release between launches (known characteristic, not a bug with a
  # clean upstream fix - was hitting OOMKilled every ~4-5 days on the
  # old 1Gi limit). Recycle nightly, well before it ever gets close to
  # the (now 2Gi) limit, instead of waiting for the kernel to kill it
  # mid-request.
  schedule: "0 8 * * *" # 4am America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flaresolverr-restart
        spec:
          serviceAccountName: flaresolverr-restart
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: restart
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              env:
                - name: HOME
                  value: /tmp
              command:
                - sh
                - -c
                - |
                  kubectl get pods -l app.kubernetes.io/name=flaresolverr -o name \
                    | xargs -r -n1 kubectl delete --ignore-not-found=true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: tmp
              emptyDir: {}
