---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cross-seed

spec:
  chartRef:
    kind: OCIRepository
    name: cross-seed

  interval: 1h

  values:
    controllers:
      cross-seed:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.7@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225

            env:
              CROSS_SEED_PORT: &port 80
              TZ: America/New_York

            args:
              - daemon

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        statefulset:
          volumeClaimTemplates:
            - name: config
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 5Gi

    defaultPodOptions:
      labels:
        setGateway: "false"

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      secret-file:
        type: secret
        name: "{{ .Release.Name }}-secret"
        globalMounts:
          - path: /config/config.js
            subPath: config.js

      media:
        type: persistentVolumeClaim
        existingClaim: downloads-staging
        globalMounts:
          - path: /media/downloads

      # Cross-filesystem hardlink fix (2026-09-29): cross-seed's linkDir for
      # the series category must live on the SAME NFS export as sonarr's
      # library (media-tv), same reasoning as qbittorrent's media-tv mount
      # above - mounted at the PVC root, no subPath.
      media-tv:
        type: persistentVolumeClaim
        existingClaim: media-tv-downloads
        globalMounts:
          - path: /media/tv

      # Same cross-filesystem hardlink fix as media-tv above, for the
      # "music" category (Lidarr's library). Mounted at a different
      # container path than Lidarr's own /media/music - see qbittorrent's
      # matching comment for why (DownloadClientRootFolderCheck warning).
      media-music:
        type: persistentVolumeClaim
        existingClaim: media-music-downloads
        globalMounts:
          - path: /media/music-downloads

      # Same cross-filesystem hardlink fix as media-music above, for the
      # "movie" category (Radarr's library).
      media-movies:
        type: persistentVolumeClaim
        existingClaim: media-movies-downloads
        globalMounts:
          - path: /media/movies-downloads
