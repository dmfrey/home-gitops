---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster

spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster

  interval: 1h

  values:
    monitoring:
      enabled: true
      createPrometheusRules: true

    toolbox:
      enabled: true

    route:
      dashboard:
        host:
          name: rook.dmfrey.com
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network

    cephClusterSpec:
      cephConfig:
        global:
          bdev_async_discard_threads: "1" # quote
          bdev_enable_discard: "true" # quote
          bluestore_cache_size_ssd: "4294967296" # 4Gi

          device_failure_prediction_mode: local # requires mgr module
          mon_warn_on_slow_ping_ratio: "0.5"
          osd_class_update_on_start: "false" # quote
          osd_client_watch_timeout: "60"
          osd_memory_target: "4294967296" # 4Gi

        mgr:
          mgr/crash/warn_recent_interval: "7200" # 2 hours (default is 1209600 = 2 weeks)

      cleanupPolicy:
        wipeDevicesFromOtherClusters: true

      crashCollector:
        disable: false

      csi:
        readAffinity:
          enabled: true

      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090

      # Mutes the HEALTH_WARN codes generated by the cephx CSI aes/aes256k gap
      # above (project_cephx_aes256k_kernel_gap) - same known, accepted
      # tradeoff, just silenced at the Ceph level instead of alerting.
      # Confirmed against onedr0p/home-ops, who are in the identical
      # kernel-gap situation. Also unblocks tuppr's KubernetesUpgrade, whose
      # healthCheck gate requires status.ceph.health == HEALTH_OK.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute

      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: false # rook/rook#18124: Ceph Tentacle v20.2.3+ prometheus module polls node_proxy_fullreport() every ~15s, which Rook's orchestrator backend doesn't implement; crash gets recorded before the module's own try/except can catch it, causing permanent RECENT_MGR_MODULE_CRASH and (once records pile up) the crash module's own dict-iteration EIO failure. No upstream fix yet; documented workaround is disabling this module. Rook operator itself doesn't depend on it (OSD/node management here is GitOps-driven via storage.nodes, not the dashboard's orchestrator UI) - only loses `ceph orch` CLI status and dashboard orchestrator integration.
          - name: restful
            enabled: false # unused here; long-documented history of leaking active-mgr memory until OOMKilled

      network:
        provider: host
        connections:
          requireMsgr2: true

      resources:
        mgr:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 4Gi # active mgr leaks ~150MB/hr (unresolved, see tracker.ceph.com); bumped from 2Gi to stretch OOM cycle ~14h -> ~28h+
        osd:
          requests:
            cpu: 1000m
          limits:
            memory: 8Gi
            cpu: 2000m

      security:
        cephx:
          # CVE-2025-30156 (cephx AES-CBC auth bypass, fixed Ceph v20.2.4+): rotated
          # daemon/mon/mgr/osd/mds/admin/rbdMirrorPeer to aes256k (Stage A, 2026-08-20),
          # all unaffected since they don't go through the kernel RBD/CephFS client.
          # Stage B (aes256k-only) briefly landed but broke every NEW volume attach
          # cluster-wide (VolSync jobs, pod reschedules) with `rados: ret=-22, Invalid
          # argument` - kernel-mapped krbd/kernel-cephfs (what CSI actually uses to mount
          # RBD/CephFS on nodes) doesn't support aes256k until Linux kernel 7.0+; these
          # nodes run Talos 6.18.44. Reverted: CSI keys stay on `aes` (bumped to
          # generation 3 so the k8s Secrets actually get rewritten back to an aes-type
          # key, since generation 2's Secrets already pointed at the unusable aes256k
          # key) and `aes` stays in allowedCiphers permanently until Talos ships a
          # kernel >=7.0. Revisit narrowing to aes256k-only only after confirming the
          # node kernel version supports it.
          allowedCiphers:
            - aes
            - aes256k
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 3
            keyType: aes
            keepPriorKeyCountMax: 1
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k

      storage:
        useAllNodes: false
        # useAllDevices: false
        nodes:
          - name: "k8s-0"
            devicePathFilter: /dev/disk/by-id/nvme-WD_BLACK_SN850X_2000GB_*
          - name: "k8s-1"
            devicePathFilter: /dev/disk/by-id/nvme-WD_BLACK_SN850X_2000GB_*
          - name: "k8s-2"
            devicePathFilter: /dev/disk/by-id/nvme-WD_BLACK_SN850X_2000GB_*
        config:
          osdsPerDevice: "1"
          bluestore_block_db_size: "214748364800" # 200Gi
          # devicePathFilter: /dev/disk/by-id/nvme-SPCC_M.2_PCIe_SSD_*

    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - noatime
            - discard
          parameters:
            # compression_mode: aggressive
            # compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete

    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete

    cephObjectStores: []
