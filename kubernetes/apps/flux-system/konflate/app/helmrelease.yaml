---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate

spec:
  chartRef:
    kind: OCIRepository
    name: konflate

  interval: 1h

  values:
    config:
      repo: github://dmfrey/home-gitops
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.dmfrey.com
      mcp: true
      verifyImages: true
      appClientId: "Iv23liN4cJeybrbeay0q"

    secret:
      existingSecret: konflate-secret

    persistence:
      enabled: true
      storageClass: ceph-block
      size: 5Gi

    monitoring:
      serviceMonitor:
        enabled: true

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/name: Konflate
        gethomepage.dev/description: Flux PR Review
      parentRefs:
        - name: envoy-external
          namespace: network
          sectionName: https
      hostnames:
        - konflate.dmfrey.com

    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
