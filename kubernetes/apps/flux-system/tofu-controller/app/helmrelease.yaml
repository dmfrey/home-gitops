---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller

spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller

  interval: 1h

  values:
    priorityClassName: system-cluster-critical

    allowCrossNamespaceRefs: true

    # installCRDs: true

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m

    runner:
      image:
        repository: ghcr.io/flux-iac/tf-runner
        tag: v0.16.6@sha256:589aa3378863433921864a8a586025233f1b5edb1cc86a4095c248119c7f77e3
      serviceAccount:
        create: true
        allowedNamespaces:
          - download
          - media
          - security
