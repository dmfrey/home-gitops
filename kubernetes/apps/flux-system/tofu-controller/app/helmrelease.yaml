---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller

spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller

  interval: 1h

  values:
    priorityClassName: system-cluster-critical

    allowCrossNamespaceRefs: true

    # installCRDs: true

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 1m

    runner:
      image:
        repository: ghcr.io/flux-iac/tf-runner
        tag: v0.17.0@sha256:f355a568c4f803ee4276122f8b661382d058d7dc5cded285fd4616f824295516
      serviceAccount:
        create: true
        allowedNamespaces:
          - download
          - media
          - security
