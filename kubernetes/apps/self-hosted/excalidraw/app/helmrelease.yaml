---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: excalidraw
spec:
  chartRef:
    kind: OCIRepository
    name: excalidraw
  interval: 1h
  values:
    controllers:
      excalidraw:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # The image bakes the default collab-room URL into its built JS
          # bundle; upstream's own entrypoint patches it in place at boot
          # with sed -i, which only ever worked as root (those files are
          # root-owned on the image's own filesystem). Copy them to a
          # writable emptyDir here instead, so the main container never
          # needs to write anywhere under its own root filesystem. Validated
          # via a throwaway fact-finding rig (hardening-test namespace,
          # 2026-08-29).
          prepare-assets:
            image:
              repository: excalidraw/excalidraw
              tag: latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
            command:
              - /bin/sh
              - -c
              - |
                cp -r /usr/share/nginx/html/. /html/
                find /html/assets -type f -name "*.js" \
                  -exec sed -i 's|https://oss-collab\.excalidraw\.com|https://excalidraw-room.dmfrey.com|g' {} +
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image:
              repository: excalidraw/excalidraw
              tag: latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
            command:
              - nginx
            args:
              - -g
              - "daemon off;"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      excalidraw-room:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: excalidraw/excalidraw-room
              tag: latest@sha256:2fe999f9be4379e3ee282fc45d75d84a691a6383dde33544514cc395287c7a70
            env:
              REDIS_URI: redis://excalidraw-dragonflydb.self-hosted.svc.cluster.local:6379
            probes:
              liveness: &room-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *room-probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      # Every container in this release needs a writable /tmp under
      # readOnlyRootFilesystem - harmless no-op for prepare-assets, which
      # doesn't use it.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      # nginx (excalidraw's app container only - excalidraw-room is a plain
      # Node process, doesn't need these) needs these writable at runtime
      # even for pure static serving.
      cache:
        type: emptyDir
        advancedMounts:
          excalidraw:
            app:
              - path: /var/cache/nginx

      run:
        type: emptyDir
        advancedMounts:
          excalidraw:
            app:
              - path: /var/run

      # Populated by the prepare-assets initContainer (copy of the image's
      # own baked-in html dir, with the collab-room URL rewritten). Same
      # volume, different mount path per container: initContainer writes at
      # /html, app serves from the real nginx root.
      html:
        type: emptyDir
        advancedMounts:
          excalidraw:
            prepare-assets:
              - path: /html
            app:
              - path: /usr/share/nginx/html

    service:
      app:
        controller: excalidraw
        ports:
          http:
            port: 80
      room:
        controller: excalidraw-room
        ports:
          http:
            port: 80
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] < 400"]
            url: "http://excalidraw-app.self-hosted.svc.cluster.local"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Excalidraw
          gethomepage.dev/icon: excalidraw.png
          gethomepage.dev/description: Virtual collaborative whiteboard.
          gethomepage.dev/pod-selector: app.kubernetes.io/name=excalidraw
        hostnames:
          - excalidraw.dmfrey.com
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /assets/
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Cache-Control
                      value: no-store
            backendRefs:
              - identifier: app
                port: 80
          - backendRefs:
              - identifier: app
                port: 80
      outpost:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /outpost.goauthentik.io/ping
            conditions: ["[STATUS] == 204"]
        hostnames:
          - excalidraw.dmfrey.com
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
            backendRefs:
              - name: ak-outpost-authentik-embedded-outpost
                namespace: security
                port: 9000
      room:
        hostnames:
          - excalidraw-room.dmfrey.com
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: room
                port: 80
