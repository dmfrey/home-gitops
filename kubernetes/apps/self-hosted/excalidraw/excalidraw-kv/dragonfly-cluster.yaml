---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: excalidraw-dragonflydb

spec:
  replicas: 1

  # No persistence (this app has no S3 snapshot config below either), so
  # freely reschedulable - spread the cluster's 7 single-replica Dragonfly
  # instances (all sharing the app.kubernetes.io/name=dragonfly label) across
  # nodes instead of letting scheduler history cluster them all together.
  # namespaceSelector: {} is required for cross-namespace counting - each
  # instance lives alone in its own app's namespace otherwise.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
      namespaceSelector: {}

  image: ghcr.io/dragonflydb/dragonfly:v2.0.0@sha256:7426fdb31ddcf7bd9499b4205f36ebaa83b26149ba1609a0d5f8f474b3631233

  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi

  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys

  # /data (dfly's own scratch dir) is baked into the image at build time
  # already owned by dfly:dfly - no fsGroup rewrite needed. Validated via a
  # throwaway namespace (hardening-test, torn down after) with a real
  # Dragonfly CR through the operator, including a functional redis-cli
  # SET/GET round trip, 2026-08-29.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
    limits:
      memory: 512Mi
