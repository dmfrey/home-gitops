---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: homepage

  install:
    remediation:
      retries: -1

  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      homepage:
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60

            env:
              TZ: America/New_York
              HOMEPAGE_ALLOWED_HOSTS: "{{ .Release.Name }}.dmfrey.com"
              HOMEPAGE_AUTH_ENABLED: "true"
              HOMEPAGE_EXTERNAL_URL: "https://{{ .Release.Name }}.dmfrey.com"
              HOMEPAGE_OIDC_ISSUER: "https://auth.dmfrey.com/application/o/homepage/"
              HOMEPAGE_OIDC_NAME: "Authentik"

            envFrom:
              - secretRef:
                  name: homepage-secret

            resources:
              requests:
                cpu: 15m
                memory: 256Mi
              limits:
                memory: 1Gi # bumped from 512Mi 2026-08-22: OOMKilled after 12h+ of stable ~220Mi usage - a Next.js recompile/reload burst spiked past the limit within a single 30s scrape interval, invisible to container_memory_working_set_bytes until the kill. Steady-state usage is unaffected; this just gives headroom for that burst.

        serviceAccount:
          identifier: homepage

    defaultPodOptions:
      automountServiceAccountToken: true

    service:
      app:
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https

    persistence:
      config-settings:
        type: configMap
        name: homepage-config
        globalMounts:
          - subPath: bookmarks.yaml
            path: /app/config/bookmarks.yaml
          - subPath: docker.yaml
            path: /app/config/docker.yaml
          - subPath: kubernetes.yaml
            path: /app/config/kubernetes.yaml
          - subPath: services.yaml
            path: /app/config/services.yaml
          - subPath: settings.yaml
            path: /app/config/settings.yaml
          - subPath: widgets.yaml
            path: /app/config/widgets.yaml

    serviceAccount:
      homepage: {}
