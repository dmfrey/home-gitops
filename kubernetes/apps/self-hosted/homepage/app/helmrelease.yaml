---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: homepage

  install:
    remediation:
      retries: -1

  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    global:
      createDefaultServiceAccount: false

    controllers:
      homepage:
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # Next.js lazily writes a prerender-cache HTML snapshot into its
          # own build output (e.g. /app/.next/server/pages/en.html) on the
          # first request that hits a given locale route - baked-in image
          # content that's otherwise read-only, same class of issue as
          # affine's GraphQL schema regen. The image already ships this
          # owned by uid 1000 (matches our runAsUser), so this is a plain
          # copy, not a chown fight. Validated via a throwaway fact-finding
          # rig (hardening-test namespace, 2026-08-29).
          prepare-next:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
            command:
              - /bin/sh
              - -c
              - cp -r /app/.next/. /next/
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.1.2@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60

            env:
              TZ: America/New_York
              HOMEPAGE_ALLOWED_HOSTS: "{{ .Release.Name }}.dmfrey.com"
              HOMEPAGE_AUTH_ENABLED: "true"
              HOMEPAGE_EXTERNAL_URL: "https://{{ .Release.Name }}.dmfrey.com"
              HOMEPAGE_OIDC_ISSUER: "https://auth.dmfrey.com/application/o/homepage/"
              HOMEPAGE_OIDC_NAME: "Authentik"

            envFrom:
              - secretRef:
                  name: homepage-secret

            resources:
              requests:
                cpu: 15m
                memory: 256Mi
              limits:
                memory: 1Gi # bumped from 512Mi 2026-08-22: OOMKilled after 12h+ of stable ~220Mi usage - a Next.js recompile/reload burst spiked past the limit within a single 30s scrape interval, invisible to container_memory_working_set_bytes until the kill. Steady-state usage is unaffected; this just gives headroom for that burst.

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        serviceAccount:
          identifier: homepage

    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: 3000

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      # Populated by the prepare-next initContainer (copy of the image's
      # own built .next output). Same volume, different mount path per
      # container: initContainer writes at /next, app serves from the real
      # Next.js build dir.
      next:
        type: emptyDir
        advancedMounts:
          homepage:
            prepare-next:
              - path: /next
            app:
              - path: /app/.next

      # The whole config dir needs to be genuinely writable, not just a
      # /logs subdirectory (2026-08-28 attempt) - homepage lazily
      # self-bootstraps ANY of its known integration templates
      # (/app/src/skeleton/*.yaml, e.g. proxmox.yaml) it doesn't have a
      # file for yet, on the first request that touches them, by copying
      # the skeleton default into /app/config. Broke widget rendering in
      # prod 2026-08-29: EROFS crashed every request that needed
      # proxmox.yaml, which isn't one of the 6 files the ConfigMap
      # provides. This is a bare emptyDir (root of the whole dir), not
      # nested inside anything, so the 6 subPath ConfigMap overlays below
      # still work fine layered on top of it - same non-nesting rule as
      # the opencode fix.
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config

      config-settings:
        type: configMap
        name: homepage-config
        globalMounts:
          - subPath: bookmarks.yaml
            path: /app/config/bookmarks.yaml
          - subPath: docker.yaml
            path: /app/config/docker.yaml
          - subPath: kubernetes.yaml
            path: /app/config/kubernetes.yaml
          - subPath: services.yaml
            path: /app/config/services.yaml
          - subPath: settings.yaml
            path: /app/config/settings.yaml
          - subPath: widgets.yaml
            path: /app/config/widgets.yaml

    serviceAccount:
      homepage: {}
