---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reposilite
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: reposilite-secret
    template:
      engineVersion: v2
      data:
        # Bootstrap manager token, in memory only (--token is never persisted). Use it to sign in to the
        # dashboard and mint a persistent read-only token for the Mac / Gradle / Maven.
        REPOSILITE_OPTS: "--shared-configuration=/config/configuration.shared.json --token admin:{{ .ADMIN_SECRET }}"
        # Reposilite's whole shared configuration, rendered from 1Password so the Broadcom registry token
        # never lands in git or on the PVC. Read-only to the app: change mirrors here, not in the dashboard.
        # One repository `maven` with an ordered mirror list (first match wins): Broadcom first, as their docs
        # ask, then the Code Genome Project repository (private first, so a public artifact can never shadow an internal name), then Maven Central, then the Gradle plugin portal. PRIVATE because the Broadcom artifacts are
        # licensed. `internal` is a hosted repository for anything you publish yourself.
        configuration.shared.json: |
          {
            "authentication": {
              "bruteForceProtection": { "enabled": true, "maxAttempts": 10, "banDurationSeconds": 300 },
              "ldap": {
                "enabled": false, "ssl": false, "hostname": "ldap.domain.com", "port": 389,
                "baseDn": "dc=company,dc=com", "searchUserDn": "cn=reposilite,ou=admins,dc=domain,dc=com",
                "searchUserPassword": "reposilite-admin-secret", "typeAttribute": "person",
                "userAttribute": "cn", "userFilter": "(&(objectClass=person)(ou=Maven Users))", "userType": "PERSISTENT"
              }
            },
            "frontend": {
              "id": "maven-dmfrey-com",
              "title": "maven.dmfrey.com",
              "description": "Private Maven and Gradle mirror",
              "organizationWebsite": "https://maven.dmfrey.com",
              "organizationLogo": "",
              "privacyPolicy": "",
              "icpLicense": ""
            },
            "maven": {
              "repositories": [
                {
                  "id": "maven",
                  "visibility": "PRIVATE",
                  "redeployment": false,
                  "preserveSnapshots": false,
                  "storageProvider": { "type": "fs", "quota": "100%", "mount": "" },
                  "storagePolicy": "PRIORITIZE_UPSTREAM_METADATA",
                  "metadataMaxAge": 0,
                  "resolutionCacheMaxEntries": 0,
                  "parallelMetadataLookup": false,
                  "resolutionCacheLevel": "NEGATIVE_CACHING",
                  "proxied": [
                    {
                      "reference": "https://packages.broadcom.com/artifactory/spring-enterprise/",
                      "store": true,
                      "authorization": { "method": "BASIC", "login": {{ .BROADCOM_EMAIL | toJson }}, "password": {{ .BROADCOM_REGISTRY_TOKEN | toJson }} },
                      "connectTimeout": 5,
                      "readTimeout": 30
                    },
                    {
                      "reference": "https://packages.broadcom.com/artifactory/tanzu-spring-dependencies/",
                      "store": true,
                      "authorization": { "method": "BASIC", "login": {{ .BROADCOM_EMAIL | toJson }}, "password": {{ .BROADCOM_REGISTRY_TOKEN | toJson }} },
                      "connectTimeout": 5,
                      "readTimeout": 30
                    },
                    {
                      "reference": "https://artifacts.codegenomeproject.org/maven",
                      "store": true,
                      "authorization": { "method": "BASIC", "login": {{ .CODE_GENOME_PROJECT_EMAIL | toJson }}, "password": {{ .CODE_GENOME_PROJECT_TOKEN | toJson }} },
                      "connectTimeout": 5,
                      "readTimeout": 30
                    },
                    { "reference": "https://repo.maven.apache.org/maven2", "store": true, "connectTimeout": 5, "readTimeout": 30 },
                    { "reference": "https://plugins.gradle.org/m2", "store": true, "connectTimeout": 5, "readTimeout": 30 }
                  ]
                },
                {
                  "id": "internal",
                  "visibility": "PRIVATE",
                  "redeployment": false,
                  "preserveSnapshots": false,
                  "storageProvider": { "type": "fs", "quota": "100%", "mount": "" },
                  "storagePolicy": "PRIORITIZE_UPSTREAM_METADATA",
                  "metadataMaxAge": 0,
                  "resolutionCacheMaxEntries": 0,
                  "parallelMetadataLookup": false,
                  "resolutionCacheLevel": "NEGATIVE_CACHING",
                  "proxied": []
                }
              ]
            },
            "javadoc": { "enabled": true, "suffixes": ["-javadoc.jar", "-groovydoc.jar"] },
            "statistics": { "enabled": true, "resolvedRequestsInterval": "MONTHLY" },
            "web": { "forwardedIp": "X-Forwarded-For", "forwardedPrefix": "" }
          }
  data:
    - secretKey: ADMIN_SECRET
      remoteRef:
        key: reposilite
        property: ADMIN_SECRET
    - secretKey: BROADCOM_EMAIL
      remoteRef:
        key: reposilite
        property: BROADCOM_EMAIL
    - secretKey: BROADCOM_REGISTRY_TOKEN
      remoteRef:
        key: reposilite
        property: BROADCOM_REGISTRY_TOKEN
    - secretKey: CODE_GENOME_PROJECT_EMAIL
      remoteRef:
        key: reposilite
        property: CODE_GENOME_PROJECT_EMAIL
    - secretKey: CODE_GENOME_PROJECT_TOKEN
      remoteRef:
        key: reposilite
        property: CODE_GENOME_PROJECT_TOKEN
