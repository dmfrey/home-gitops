---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
spec:
  chartRef:
    kind: OCIRepository
    name: freshrss
  interval: 1h
  values:
    controllers:
      freshrss:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fix-data-ownership:
            # Idempotent insurance against a regression seen 2026-09-16 (and
            # again 2026-09-24): data/users/favicons/tokens/etc. under the
            # data/ PVC mount occasionally come up root:root instead of
            # root:www-data, which the app's own Apache/PHP worker (running
            # as www-data) then can't write to - fails the app's requirements
            # self-check every 30m. Confirmed via a live test (restart with
            # no image/volume change) that a plain pod restart does NOT
            # reset correct ownership on its own, so this only needs to run
            # once per actual regression - cheap no-op the rest of the time.
            # Root cause of the regression itself is still unconfirmed
            # (image-version transition and/or fresh-volume provisioning are
            # the two known triggers so far) - this fixes the symptom
            # unconditionally rather than chasing the exact trigger.
            image:
              repository: docker.io/library/busybox
              tag: latest@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command: ["/bin/sh", "-c"]
            args:
              - chgrp -R www-data /var/www/FreshRSS/data
        containers:
          app:
            image:
              repository: docker.io/freshrss/freshrss
              tag: 1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
            env:
              TZ: America/New_York
              CRON_MIN: "1,31"
              FRESHRSS_ENV: production
              # Database (individual keys from CNPG app secret)
              DB_TYPE: pgsql
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: freshrss-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: freshrss-cnpg-app
                    key: port
              DB_BASE:
                valueFrom:
                  secretKeyRef:
                    name: freshrss-cnpg-app
                    key: dbname
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: freshrss-cnpg-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: freshrss-cnpg-app
                    key: password
              # OIDC via mod_auth_openidc
              OIDC_ENABLED: "1"
              OIDC_PROVIDER_METADATA_URL: "https://auth.dmfrey.com/application/o/freshrss/.well-known/openid-configuration"
              OIDC_SCOPES: "openid email profile"
              OIDC_X_FORWARDED_HEADERS: "X-Forwarded-Proto"
            envFrom:
              - secretRef:
                  name: freshrss-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            url: "https://rss.dmfrey.com/api/"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: FreshRSS
          gethomepage.dev/icon: freshrss.svg
          gethomepage.dev/description: RSS Feed Aggregator
        hostnames:
          - rss.dmfrey.com
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /var/www/FreshRSS/data
            subPath: data
          - path: /var/www/FreshRSS/extensions
            subPath: extensions

      # SimplePie/feed-parse cache (.spc, cached favicons/page previews) -
      # fully regenerable from re-fetching feeds, FreshRSS self-prunes it on
      # a timer (CLEANCACHE_HOURS). Was ~84MB of the ~87MB PVC, all of it
      # getting backed up by VolSync every cycle for no reason. sizeLimit is
      # a backstop, not a tuned value - current usage is well under it.
      cache:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /var/www/FreshRSS/data/cache
