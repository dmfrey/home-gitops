---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: affine-secret
    template:
      engineVersion: v2
      data:
        AFFINE_ADMIN_EMAIL: "{{ .AFFINE_ADMIN_EMAIL }}"
        AFFINE_ADMIN_PASSWORD: "{{ .AFFINE_ADMIN_PASSWORD }}"
        config.json: |
          {
            "oauth": {
              "providers.oidc": {
                "clientId": "{{ .AUTHENTIK_CLIENT_ID }}",
                "clientSecret": "{{ .AUTHENTIK_CLIENT_SECRET }}",
                "issuer": "https://auth.dmfrey.com/application/o/affine/"
              }
            },
            "copilot": {
              "enabled": true,
              "byok": {
                "enabled": true,
                "allowCustomEndpoint": true,
                "allowPrivateEndpoint": true
              },
              "providers": {
                "profiles": [
                  {
                    "id": "ollama",
                    "displayName": "Ollama",
                    "type": "openai",
                    "enabled": true,
                    "models": [
                      "qwen3:4b",
                      "gemma3:4b",
                      "mistral:latest",
                      "nomic-embed-text:latest",
                      "qllama/bge-reranker-v2-m3:latest",
                      "qwen2.5vl:7b"
                    ],
                    "config": {
                      "apiKey": "ollama",
                      "baseURL": "http://ollama.ai.svc.cluster.local:11434/v1",
                      "oldApiStyle": true
                    }
                  }
                ],
                "defaults": {
                  "text": "ollama",
                  "object": "ollama",
                  "embedding": "ollama",
                  "image": "ollama",
                  "rerank": "ollama",
                  "structured": "ollama",
                  "fallback": "ollama"
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: affine
