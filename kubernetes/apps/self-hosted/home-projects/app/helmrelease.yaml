---
# ── HelmRelease ──────────────────────────────────────────────────────────────
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-projects

spec:
  chartRef:
    kind: OCIRepository
    name: home-projects

  interval: 1h

  values:
    controllers:
      home-projects:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: nginx
              tag: stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
              pullPolicy: IfNotPresent

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness: *probes

            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 50m
                memory: 64Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port
            protocol: HTTP

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-external
            namespace: network

    persistence:
      # nginx needs these writable at runtime even for pure static serving -
      # confirmed via a throwaway non-root fact-finding rig
      # (hardening-test namespace, 2026-08-28).
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx

      run:
        type: emptyDir
        globalMounts:
          - path: /var/run

      nginx-config:
        type: configMap
        name: nginx-config
        globalMounts:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true

      # Landing page → /usr/share/nginx/html/index.html
      index:
        type: configMap
        name: index-html
        globalMounts:
          - path: /usr/share/nginx/html/index.html
            subPath: index.html
            readOnly: true

      # Bedroom suite viewer → /usr/share/nginx/html/bedroom-suite-viewer.html
      bedroom-suite-viewer:
        type: configMap
        name: bedroom-suite-viewer-html
        globalMounts:
          - path: /usr/share/nginx/html/bedroom-suite-viewer.html
            subPath: bedroom-suite-viewer.html
            readOnly: true

      # Bedroom suite sheet layout → /usr/share/nginx/html/bedroom-suite-sheet-layout.html
      bedroom-suite-sheet-layout:
        type: configMap
        name: bedroom-suite-sheet-layout-html
        globalMounts:
          - path: /usr/share/nginx/html/bedroom-suite-sheet-layout.html
            subPath: bedroom-suite-sheet-layout.html
            readOnly: true
