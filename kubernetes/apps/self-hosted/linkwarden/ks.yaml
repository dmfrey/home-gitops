---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkwarden-db
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: datastore
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: linkwarden-cnpg
      namespace: self-hosted
  interval: 1h
  path: "./kubernetes/apps/self-hosted/linkwarden/linkwarden-db"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linkwarden
spec:
  components:
    - ../../../../components/nfs-scaler
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: linkwarden-db
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: "./kubernetes/apps/self-hosted/linkwarden/app"
  postBuild:
    substitute:
      APP: linkwarden
      CONTROLLER: StatefulSet
      KOPIUR_CACHE_CAPACITY: 10Gi
      KOPIUR_CAPACITY: 20Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: self-hosted
  wait: true
