---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  chartRef:
    kind: OCIRepository
    name: bambuddy
  interval: 1h
  values:
    controllers:
      bambuddy:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.3.2@sha256:16be075c5517b5ceab201d0105938c1a890f5b315bf185fdfa98d47f12f6bd03
            env:
              TZ: America/New_York
              PORT: "8000"
              LOG_LEVEL: INFO
              LOG_TO_FILE: "false"
              HA_URL: http://home-assistant-app.home.svc.cluster.local:8123
              VIRTUAL_PRINTER_PASV_ADDRESS: "192.168.50.6"
            envFrom:
              - secretRef:
                  name: bambuddy-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 512Mi
          # Slicer-API sidecars (maziggy/orca-slicer-api): headless Bambu Studio
          # and OrcaSlicer CLIs behind /slice, called by Bambuddy's in-app
          # slicing at its built-in defaults (localhost:3001 / localhost:3003;
          # the virtual printer owns 3000/3002). Stateless: Bambuddy sends the
          # model plus an explicit profile triplet with each request. The
          # images run as root (their default) and need /app/data. Tags follow
          # Bambuddy's release: keep bambuddy-X.Y.Z in step with the main
          # image above. amd64 only. Enable "use slicer API" in Settings.
          bambu-studio-api:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.3.1@sha256:7dbe1531e74a6ec3cb3fc390cd399882c62511f294d25425537efd0649d227b8
            env:
              NODE_ENV: production
              PORT: "3001"
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: &slicer-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3001
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *slicer-probe
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 3Gi
          orca-slicer-api:
            image:
              repository: ghcr.io/maziggy/orca-slicer-api
              tag: bambuddy-1.3.1@sha256:558a91b06a539794ccb5562989b859daf19952dcb4ff6477e2946e7e4e78635c
            env:
              NODE_ENV: production
              PORT: "3003"
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: &orca-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3003
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *orca-probe
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 3Gi
    defaultPodOptions:
      priorityClassName: low
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "iot-vlan",
            "namespace": "kube-system",
            "ips": ["192.168.50.6/24", "${IPV6_IOT_PREFIX}:4::1/64"],
            "mac": "a6:41:7a:c3:2b:e8"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /api/v1/metrics
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] < 400"]
            url: "https://bambuddy.dmfrey.com"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: BambuBuddy
          gethomepage.dev/icon: bambuddy.png
          gethomepage.dev/description: "Bambu Labs 3D Printer Monitor"
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # advancedMounts (app container only): globalMounts would also put the
      # data PVC at /app/data in the slicer sidecars, clashing with their own.
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
      tmpfs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /app/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
      slicer-data-bambu:
        type: emptyDir
        advancedMounts:
          bambuddy:
            bambu-studio-api:
              - path: /app/data
      slicer-data-orca:
        type: emptyDir
        advancedMounts:
          bambuddy:
            orca-slicer-api:
              - path: /app/data
