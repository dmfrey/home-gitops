---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Slicer-API sidecars for Bambuddy: HTTP wrappers around the Bambu Studio and
# OrcaSlicer CLIs (maziggy/orca-slicer-api, built from Bambuddy's
# slicer-api/docker-compose.yml). Bambuddy sends the model plus an explicit
# profile triplet with every /slice request, so the sidecars keep no state
# worth backing up (emptyDir). Cluster-internal only, no route.
#
# Bambuddy settings (Settings -> Slicer), set in the UI, not in git:
#   bambu_studio_api_url  http://slicer-api-bambu-studio.self-hosted.svc.cluster.local:3000
#   orcaslicer_api_url    http://slicer-api-orca.self-hosted.svc.cluster.local:3000
#   use_slicer_api        on
#
# Images are tagged per Bambuddy release; keep bambuddy-X.Y.Z in step with the
# Bambuddy image in ../../bambuddy/app/helmrelease.yaml. amd64 only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slicer-api
spec:
  chartRef:
    kind: OCIRepository
    name: slicer-api
  interval: 1h
  values:
    controllers:
      bambu-studio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.3.1@sha256:7dbe1531e74a6ec3cb3fc390cd399882c62511f294d25425537efd0649d227b8
            env:
              NODE_ENV: production
              PORT: &port "3000"
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 3Gi
      orca:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/orca-slicer-api
              tag: bambuddy-1.3.1@sha256:558a91b06a539794ccb5562989b859daf19952dcb4ff6477e2946e7e4e78635c
            env:
              NODE_ENV: production
              PORT: *port
              MAX_MODEL_UPLOAD_MB: "512"
            probes:
              liveness: *probes
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 3Gi
    defaultPodOptions:
      priorityClassName: low
    service:
      bambu-studio:
        controller: bambu-studio
        ports:
          http:
            port: 3000
      orca:
        controller: orca
        ports:
          http:
            port: 3000
    persistence:
      data-bambu:
        type: emptyDir
        advancedMounts:
          bambu-studio:
            app:
              - path: /app/data
      data-orca:
        type: emptyDir
        advancedMounts:
          orca:
            app:
              - path: /app/data
