---
# Shared app-owned blob storage (affine documents, immich photo uploads),
# consumed by affine and immich - not owned by either app individually, so
# it lives here rather than in one app's own directory. Consolidated from 2
# separate QNAP subfolders (/media/affine, /media/immich) into one UNAS
# Shared Drive with matching subfolders, each app scoped via subPath - same
# pattern as downloads-staging/app-backups. Last of the 14 shares in the
# QNAP->UNAS migration.
# 2026-11-12 UNAS BAD BLOCKS: pointed at the QNAP (192.168.30.2) copy until the UNAS pool is
# rebuilt. PV spec.nfs is immutable: changing it means deleting the PV and PVC first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-data
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 500Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /app_data
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: app-data
  storageClassName: ""
