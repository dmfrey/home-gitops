---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich

spec:
  chartRef:
    kind: OCIRepository
    name: immich

  interval: 1h

  values:
    controllers:
      immich-server:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: immich-cnpg-app,immich-secret

        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb

            env:
              TZ: America/New_York
              DB_VECTOR_EXTENSION: vectorchord
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-cnpg-app
                    key: uri
              REDIS_HOSTNAME: immich-dragonflydb.self-hosted.svc.cluster.local
              REDIS_PORT: 6379
              IMMICH_CONFIG_FILE: /config/immich-config.json
              UPLOAD_LOCATION: /usr/src/app/upload

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 2283
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

      immich-machine-learning:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e

            env:
              TZ: America/New_York

            probes:
              liveness: &mlProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &mlPort 3003
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *mlProbes

            # CPU-only: the cluster's one Intel GPU is already contended by
            # Plex/Jellyfin. Face/CLIP indexing runs as background jobs, not
            # user-facing latency, so CPU is fine here.
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 4000m
                memory: 4Gi

    service:
      immich-server:
        controller: immich-server
        ports:
          http:
            port: *port
      immich-machine-learning:
        controller: immich-machine-learning
        # 2026-07-29: forceRename so the Service resolves at exactly
        # "immich-machine-learning" (app-template's default naming would
        # produce "immich-immich-machine-learning" instead) - Immich's
        # built-in machine learning URL default is
        # http://immich-machine-learning:3003, only configurable via the
        # admin system-settings DB, not an env var, so matching the hostname
        # infra-side is the only git-trackable fix. Confirmed this mismatch
        # was causing every face-detection/smart-search ML request to fail
        # with "fetch failed" (DNS didn't resolve) once face detection was
        # actually triggered in bulk for the first time.
        forceRename: immich-machine-learning
        ports:
          http:
            port: *mlPort

    route:
      immich-server:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            url: "https://photos.dmfrey.com/api/server/ping"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Immich
          gethomepage.dev/icon: immich.png
          gethomepage.dev/description: Self-hosted photo and video backup
        hostnames:
          - "photos.dmfrey.com"
        parentRefs:
          - name: envoy-external
            namespace: network
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: immich-immich-server
                port: *port

    persistence:
      library:
        enabled: true
        type: nfs
        server: nas.internal
        path: /media/immich
        advancedMounts:
          immich-server:
            app:
              - path: /usr/src/app/upload

      config:
        type: secret
        name: immich-secret
        advancedMounts:
          immich-server:
            app:
              - path: /config/immich-config.json
                subPath: immich-config.json
                readOnly: true

      ml-cache:
        existingClaim: immich-ml-cache
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /cache

      tmp:
        type: emptyDir
        advancedMounts:
          immich-server:
            app:
              - path: /tmp
