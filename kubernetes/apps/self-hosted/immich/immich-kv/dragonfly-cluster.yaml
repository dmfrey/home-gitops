---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: immich-dragonflydb
  annotations:
    secret.reloader.stakater.com/reload: immich-dragonflydb-s3-secret

spec:
  replicas: 1

  # No persistence (state recovers from the S3 snapshot below), so freely
  # reschedulable - spread the cluster's 7 single-replica Dragonfly
  # instances (all sharing the app.kubernetes.io/name=dragonfly label) across
  # nodes instead of letting scheduler history cluster them all together.
  # topologySpreadConstraints was tried first, but this CRD's schema for it
  # is a hand-trimmed subset that omits namespaceSelector (confirmed via the
  # CRD's own OpenAPI schema) - useless here since each instance lives alone
  # in its own app's namespace, so same-namespace-only counting is always
  # trivially satisfied. affinity.podAntiAffinity's schema is the full
  # upstream PodAffinityTerm type and does support namespaceSelector.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: dragonfly
                app.kubernetes.io/part-of: dragonfly
            namespaceSelector: {}
            topologyKey: kubernetes.io/hostname

  image: ghcr.io/dragonflydb/dragonfly:v2.0.0@sha256:7426fdb31ddcf7bd9499b4205f36ebaa83b26149ba1609a0d5f8f474b3631233

  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: immich-dragonflydb-s3-secret
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: immich-dragonflydb-s3-secret
          key: AWS_SECRET_ACCESS_KEY

  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys
    - --s3_endpoint=garage.garage-system.svc.cluster.local:3900
    - --s3_use_https=false

  snapshot:
    cron: 0 0 * * *
    dir: "s3://dragonflydb/immich"

  # /data (dfly's own scratch dir) is baked into the image at build time
  # already owned by dfly:dfly - no fsGroup rewrite needed. Validated via a
  # throwaway namespace (hardening-test, torn down after) with a real
  # Dragonfly CR through the operator, including a functional redis-cli
  # SET/GET round trip, 2026-08-29.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
    limits:
      memory: 512Mi
