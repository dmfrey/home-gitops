---
# Backing volume for the "nfs" ClusterRepository (clusterrepository-nfs.yaml)
# - UNAS Pro migration (2026-09-29), moved off the QNAP's nas.internal:/Kopia/kopiur.
# ClusterRepository.spec.backend.filesystem.volume.nfs is an inline
# v1.NFSVolumeSource, which has no mountOptions field - same limitation
# hit throughout this migration for app-template's persistence.type: nfs
# shorthand. The UNAS Pro speaks NFSv4.1 as of 2026-11-27 (was v3-only, hence the old vers=4.1) and needs
# vers=4.1, so this uses volume.pvc instead, backed by a real static
# PV/PVC pair here.
# 2026-11-15: UNAS pool rebuilt (RAID6, new pool UUID); restored from the QNAP copy
# (rsync, all files 1000:1000). PV spec.nfs is immutable: changing it means
# deleting the PV and PVC first. The share's export path ends in /.data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopia-nfs-repo
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=4.1
  nfs:
    server: nas.internal
    path: /kopia_nfs_repo
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopia-nfs-repo
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: kopia-nfs-repo
  storageClassName: ""
