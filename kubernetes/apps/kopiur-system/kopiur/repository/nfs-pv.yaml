---
# Backing volume for the "nfs" ClusterRepository (clusterrepository-nfs.yaml),
# on the UNAS Pro's kopia_nfs_repo share (moved off the QNAP's /Kopia/kopiur on
# 2026-09-29). The ClusterRepository references it as volume.pvc. This is a PV
# rather than an inline NFS volume from the days when the UNAS was NFSv3-only
# and the mount needed an explicit vers option; the UNAS has spoken NFSv4.1 since
# 2026-11-27 and Talos nodes default to nfsvers=4.1 (/etc/nfsmount.conf), so the
# vers=4.1 below is now just explicit, and an inline volume would also work.
# 2026-11-15: UNAS pool rebuilt; restored from the QNAP copy (rsync, all files
# 1000:1000). PV spec.nfs is immutable: changing it means deleting the PV and PVC
# first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopia-nfs-repo
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=4.1
  nfs:
    server: nas.internal
    path: /kopia_nfs_repo
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopia-nfs-repo
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: kopia-nfs-repo
  storageClassName: ""
