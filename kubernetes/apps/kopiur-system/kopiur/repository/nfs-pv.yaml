---
# Backing volume for the "nfs" ClusterRepository (clusterrepository-nfs.yaml)
# - UNAS Pro migration (2026-09-29), moved off the QNAP's nas.internal:/Kopia/kopiur.
# ClusterRepository.spec.backend.filesystem.volume.nfs is an inline
# v1.NFSVolumeSource, which has no mountOptions field - same limitation
# hit throughout this migration for app-template's persistence.type: nfs
# shorthand. The UNAS Pro only speaks NFSv3 to Linux clients and needs
# vers=3+nolock, so this uses volume.pvc instead, backed by a real static
# PV/PVC pair here.
# 2026-11-12 UNAS BAD BLOCKS: pointed at the QNAP (192.168.30.2:/kopia_nfs_repo,
# rsync copy) until the UNAS pool is rebuilt. PV spec.nfs is immutable: changing
# it means deleting the PV and PVC first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopia-nfs-repo
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /kopia_nfs_repo
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopia-nfs-repo
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: kopia-nfs-repo
  storageClassName: ""
