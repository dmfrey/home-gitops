---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: garage
spec:
  # Pilot scope: only the wizarr app (media namespace) backs up here for now.
  # kopiur-system must ALSO be listed - the operator's managed Maintenance CR
  # (maintenance.namespace below) lands there, and the admission webhook
  # enforces allowedNamespaces against every namespace touching this
  # ClusterRepository, including its own operator namespace, not just
  # consumer apps. See project_kopiur_pilot memory. Widen this list if the
  # pilot graduates.
  allowedNamespaces:
    list:
      - media
      - kopiur-system
  # Owner-side opt-in for credential projection - necessary but not
  # sufficient on its own; the consumer (wizarr's SnapshotPolicy) must also
  # set credentialProjection.enabled: true. Fail-closed by design.
  credentialProjection:
    allowed: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: garage.garage-system.svc.cluster.local:3900
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    namespace: kopiur-system
