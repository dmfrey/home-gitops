---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: garage
spec:
  # Phase 2 (2026-08-26, project_kopiur_pilot): widened from wizarr-only
  # (media) to 3 more apps of varying shapes - plex (media, large PVC),
  # linkwarden (self-hosted, real CNPG DB), dependency-track (security,
  # real CNPG DB), mosquitto (home, runs as root - different UID shape
  # than every other kopiur app so far). kopiur-system must ALSO be
  # listed - the operator's managed Maintenance CR (maintenance.namespace
  # below) lands there, and the admission webhook enforces
  # allowedNamespaces against every namespace touching this
  # ClusterRepository, including its own operator namespace, not just
  # consumer apps.
  #
  # Fleet-wide rollout (2026-09-02): every namespace with at least one app
  # still on VolSync, listed upfront rather than discovered one rejected
  # SnapshotPolicy at a time (as happened with unifi-toolkit/observability).
  # garage-system is deliberately NOT here - the garage app itself is this
  # repository's own S3 backend, backing it up via kopiur/garage would be
  # circular.
  allowedNamespaces:
    list:
      - media
      - self-hosted
      - security
      - home
      - kopiur-system
      - observability
      - ai
      - download
      - spring-notes
  # Owner-side opt-in for credential projection - necessary but not
  # sufficient on its own; the consumer (wizarr's SnapshotPolicy) must also
  # set credentialProjection.enabled: true. Fail-closed by design.
  credentialProjection:
    allowed: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: garage.garage-system.svc.cluster.local:3900
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    namespace: kopiur-system
  # 2026-09-09: default 24h epoch gate (minDuration) was blocking index-blob
  # compaction - content-index blobs grew unbounded (6934 -> 8209 overnight,
  # then kept climbing to 4800+ per kopiur's own status, which turned out to
  # be stale/inaccurate - see below). Root cause: minDuration is only the
  # gate (minimum epoch age before it MAY advance) - the actual triggers are
  # advanceOnCount/advanceOnSizeMiB, evaluated per epoch, and this repo's
  # snapshot activity apparently never accumulates enough blobs/size within
  # a single epoch to cross the kopia defaults (20 blobs / 10MiB) regardless
  # of age.
  #
  # Confirmed kopiur does NOT actually push advanceOnCount/advanceOnSizeMiB
  # from this CRD into the repository's own persisted format-blob config
  # (only minDuration made it through, unclear why) - verified directly via
  # `kopia repository status` showing the kopia-default 20/10.5MB still
  # active on the live repo despite this field declaring 5/2 for hours.
  # Applied out-of-band via `kopia repository set-parameters` instead
  # (matches the documented workaround in the now-closed kopiur#258) -
  # kopia enforces a minimum on advanceOnCount higher than 5 ("epoch
  # advance on count too low"), so used the lowest value it actually
  # accepted (10) to match what's really live. Left declared here anyway
  # for GitOps visibility/intent, even though it isn't confirmed to
  # actually apply - re-verify with `kopia repository status` after any
  # future kopiur upgrade in case propagation gets fixed upstream.
  #
  # Despite advanceOnCount/advanceOnSizeMiB never taking effect, the
  # minDuration:6h fix ALONE was already working in practice -
  # `kopia maintenance info` showed real compaction (thousands of index
  # blobs merged per cycle) and real cleanup (10,728 pack blobs / 3.9GB
  # deleted by full-delete-blobs; 8,507 superseded index blobs deleted by
  # delete-superseded-epoch-indexes) starting right after that fix landed -
  # kopiur's own IndexBlobHealth condition/lastContentReclaimedBytes status
  # simply never reflected this real activity (a kopiur reporting gap, not
  # an actual stuck repository). Live blob count via `kopia repository
  # status` was already down to ~1013 by the time this was diagnosed,
  # nowhere near the 4800+ kopiur's own condition kept reporting.
  parameters:
    epoch:
      minDuration: 6h
      advanceOnCount: 10
      advanceOnSizeMiB: 2
