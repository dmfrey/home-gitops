---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: garage
spec:
  # Phase 2 (2026-08-26, project_kopiur_pilot): widened from wizarr-only
  # (media) to 3 more apps of varying shapes - plex (media, large PVC),
  # linkwarden (self-hosted, real CNPG DB), dependency-track (security,
  # real CNPG DB), mosquitto (home, runs as root - different UID shape
  # than every other kopiur app so far). kopiur-system must ALSO be
  # listed - the operator's managed Maintenance CR (maintenance.namespace
  # below) lands there, and the admission webhook enforces
  # allowedNamespaces against every namespace touching this
  # ClusterRepository, including its own operator namespace, not just
  # consumer apps.
  #
  # Fleet-wide rollout (2026-09-02): every namespace with at least one app
  # still on VolSync, listed upfront rather than discovered one rejected
  # SnapshotPolicy at a time (as happened with unifi-toolkit/observability).
  # garage-system is deliberately NOT here - the garage app itself is this
  # repository's own S3 backend, backing it up via kopiur/garage would be
  # circular.
  allowedNamespaces:
    list:
      - media
      - self-hosted
      - security
      - home
      - kopiur-system
      - observability
      - ai
      - download
      - spring-notes
  # Owner-side opt-in for credential projection - necessary but not
  # sufficient on its own; the consumer (wizarr's SnapshotPolicy) must also
  # set credentialProjection.enabled: true. Fail-closed by design.
  credentialProjection:
    allowed: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: garage.garage-system.svc.cluster.local:3900
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    namespace: kopiur-system
    # TEMPORARY 2026-09-09 19:58 UTC: forcing another earlier `full` run to
    # verify the revised epoch parameters below actually compact - the
    # first forced run (19:33 UTC, minDuration:6h alone) reclaimed 0 bytes,
    # because minDuration only gates WHEN an epoch may advance, it doesn't
    # cause advancement. advanceOnCount/advanceOnSizeMiB do. Revert to the
    # default schedule (omit this block entirely) once confirmed - do not
    # leave this override in place.
    schedule:
      full:
        cron: "2 20 * * *"
        jitter: 0s
      quick:
        cron: "0 */6 * * *"
  # 2026-09-09: default 24h epoch gate (minDuration) was blocking index-blob
  # compaction - content-index blobs grew unbounded (6934 -> 8209 overnight,
  # then kept climbing to 4700+) since full maintenance kept reclaiming 0
  # bytes even after minDuration was lowered to 6h. Root cause: minDuration
  # is only the gate (minimum epoch age before it MAY advance) - the actual
  # triggers are advanceOnCount/advanceOnSizeMiB, evaluated per epoch, and
  # this repo's snapshot activity apparently never accumulates enough
  # blobs/size within a single epoch to cross the kopia defaults (20 blobs /
  # 10MiB) regardless of age. Lowered both to match this repo's actual
  # (homelab-scale, not enterprise) per-epoch accumulation rate.
  parameters:
    epoch:
      minDuration: 6h
      advanceOnCount: 5
      advanceOnSizeMiB: 2
