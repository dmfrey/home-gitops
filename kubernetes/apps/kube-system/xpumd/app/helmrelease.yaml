---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xpumd
spec:
  chartRef:
    kind: OCIRepository
    name: xpumd
  interval: 1h
  values:
    image:
      repository: ghcr.io/intel/xpumanager/xpumd
      tag: v2.0.0-rc.0@sha256:8f020012f68888314402c0332a53718ace4ade9913476bbd125af89edb760a8b
    gpuAccess: dra
    nodeSelector:
      node.kubernetes.io/gpu: "true"
    prometheus:
      monitor: true
      release: kube-prometheus-stack
    grafana:
      dashboards: true
      namespace: kube-system
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1version
                value: 2.0.0-rc.0
            target:
              labelSelector: "app.kubernetes.io/instance=xpumd"
          - patch: |-
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: xpumd-config
              data:
                config.yaml: |-
                  exporters:
                    intelxpuinfo:
                      # The Intel GPU DRA kubelet plugin v0.12.1 dials /run/xpumd/intel_xpu_info.sock
                      # (DefaultSocketFilename in cmd/kubelet-gpu-plugin/xpumd.go). The old name,
                      # intelxpuinfo.sock, made the plugin crash-loop with "failed to connect to xpumd"
                      # after the 0.12.0 -> 0.12.1 chart bump (home-gitops#5883).
                      endpoint: /run/xpumd/intel_xpu_info.sock
                    prometheus:
                      endpoint: 0.0.0.0:8080
                  extensions: {}
                  processors:
                    intelxpustatus: {}
                  receivers:
                    intelxpu:
                      collection_interval: 5s
                      initial_delay: 1s
                      log_level: info
                      metrics: {}
                      sampling_interval: 1s
                      timeout: 0
                  service:
                    pipelines:
                      metrics:
                        exporters:
                        - intelxpuinfo
                        - prometheus
                        processors:
                        - intelxpustatus
                        receivers:
                        - intelxpu
                    telemetry:
                      logs:
                        level: info
            target:
              kind: ConfigMap
              name: xpumd-config
