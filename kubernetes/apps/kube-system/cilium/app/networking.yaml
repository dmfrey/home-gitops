---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.168.29.0/24
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpadvertisement_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: l3-bgp-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgppeerconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: l3-bgp-peer-config
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: l3-bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cilium
      localASN: 64514
      peers:
        - name: unifi
          peerASN: 64513
          peerAddress: 192.168.86.1
          peerConfigRef:
            name: l3-bgp-peer-config
---
apiVersion: v1
kind: Service
metadata:
  name: kube-api
  annotations:
    # external-dns v0.22.0's "service" source only reads its own
    # HostnameKey constant (external-dns.kubernetes.io/hostname, no
    # "alpha.") - it does not derive this from --annotation-prefix and
    # never recognized the old "alpha." variant this repo used. This is
    # the ONLY bare Service in the repo relying on annotation-based
    # discovery (everything else publishes via HTTPRoute's own
    # spec.hostnames through the gateway-httproute source, unaffected by
    # this), so k8s.dmfrey.com - k8s.internal's CNAME target, and
    # cluster.controlPlane.endpoint in talos/machineconfig.yaml.j2 - was
    # silently never being published. Confirmed via unifi-dns debug
    # logging ("No endpoints could be generated from
    # 'service/kube-system/kube-api'" before this fix, "Endpoints
    # generated from service" after) and live DNS resolution against the
    # UDM-SE. Not a UDM-SE sync bug, not a Talos migration regression.
    external-dns.kubernetes.io/hostname: k8s.dmfrey.com
    lbipam.cilium.io/ips: 192.168.29.120
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    k8s-app: kube-apiserver
    tier: control-plane
  ports:
    - port: 6443
