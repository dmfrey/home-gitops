---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium

spec:
  chartRef:
    kind: OCIRepository
    name: cilium

  interval: 1h

  values:
    priorityClassName: system-cluster-critical

    autoDirectNodeRoutes: true

    bandwidthManager:
      enabled: true
      bbr: true

    bpf:
      datapathMode: netkit
      masquerade: true
      preallocateMaps: true
      # bpf.tproxy was true here and is dropped: this cluster has no Cilium network policies (no L7 or FQDN
      # rules), so nothing uses it, and Cilium 1.19+ refuses to start with tproxy and netkit together
      # (onedr0p/home-ops removed it in its 1.19.0 upgrade, #10451).

    bpfClockProbe: true

    bgpControlPlane:
      enabled: true

    cgroup:
      # Was `automount` (lowercase), which the chart ignores, so the mount-cgroup init container kept running.
      # Talos already mounts cgroup2 at /sys/fs/cgroup, which is what hostRoot points at.
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    cni:
      exclusive: false

    dashboards:
      enabled: true

    # 2026-07-29: all 3 nodes migrated to the net0/bond0 LinkAliasConfig
    # (talos/machineconfig.yaml.j2) - eth0 is now an enslaved bond0 member with no
    # IP anywhere in the cluster, so native routing/BGP only need to match bond0.
    devices: bond+

    enableIPv4BIGTCP: true

    endpointRoutes:
      enabled: true

    envoy:
      enabled: false

    hubble:
      enabled: false

    ipam:
      mode: kubernetes

    ipv4NativeRoutingCIDR: 10.42.0.0/16

    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256

    l2announcements:
      enabled: false

    loadBalancer:
      algorithm: maglev
      mode: dsr
      # spegel-registry sets trafficDistribution: PreferSameNode and Cilium only honours it with service topology
      # on (same as onedr0p/home-ops). It is the only Service here that sets trafficDistribution.
      serviceTopology: true

    localRedirectPolicies:
      enabled: true

    operator:
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Network
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 2
      rollOutPods: true

    pmtuDiscovery:
      enabled: true

    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    rollOutCiliumPods: true

    routingMode: native

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    socketLB:
      enabled: true
      hostNamespaceOnly: false
