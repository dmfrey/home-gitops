---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: garage
spec:
  # Only meta-garage-0 is backed up (belt-and-suspenders insurance), not all
  # 3 per-replica meta PVCs, and not the (much larger, replicated) data-*
  # PVCs at all - same scope as the VolSync ReplicationSource this replaces.
  # See replicationsource.yaml's own comment for the full reasoning: with
  # replication_factor=3, the normal recovery path for a lost/corrupted
  # node's metadata is to evict it from the layout and let it resync from
  # the other 2 healthy replicas, not restore from a backup.
  #
  # Uses the independent "nfs" ClusterRepository (filesystem/NFS backend),
  # NOT the "garage" ClusterRepository - backing garage-system up to
  # Garage's own S3 would be circular.
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  mover:
    cache:
      # Bumped 1Gi -> 5Gi and moved to openebs-hostpath, matching the
      # shared components/kopiur/policy/snapshotpolicy.yaml fix
      # (2026-09-09) - this app predates/bypasses that shared component
      # (uses the "nfs" repository, not "garage"), so it needed the same
      # fix applied by hand.
      capacity: 5Gi
      mode: Persistent
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  repository:
    kind: ClusterRepository
    name: nfs
  # Cadence dropped from hourly to daily (see snapshotschedule.yaml) and
  # retention further lightened on 2026-09-07 - meta-garage-0 is an LMDB
  # file, which rewrites/reorganizes pages internally on writes, so
  # consecutive snapshots dedup poorly against each other regardless of
  # cadence (confirmed: 36 hourly-cadence snapshots of a ~10GB dataset were
  # consuming ~180GB of genuinely-unique pack-blob content). This backup is
  # genuinely tertiary insurance, not the primary defense: meta-garage-0
  # already has two redundancy layers ahead of it - Ceph's own block-level
  # replication, and Garage's own replication_factor=3 application-level
  # resync (the documented recovery path for a lost/corrupted node's
  # metadata is evicting it and letting it resync from the other 2 healthy
  # replicas, not restoring from here). This backup exists only for the
  # failure modes replication can't help with - accidental deletion, a bug
  # that corrupts logical data, a bad layout change - none of which need
  # hourly granularity. keepLatest covers an immediate bad-snapshot margin,
  # keepDaily gives ~2 weeks of day-level recovery points, keepWeekly
  # extends coarse coverage out to ~1 month.
  retention:
    keepLatest: 2
    keepDaily: 14
    keepWeekly: 4
  verification:
    quick:
      schedule:
        cron: "H H * * *"
    deep:
      schedule:
        cron: "H H * * 0"
      # Without this, the deep-verify scratch-restore target falls back to a
      # node-local emptyDir, which isn't guaranteed to have room for a full
      # restore of meta-garage-0's actual data (~10GB as of 2026-09-03) -
      # confirmed failing with "no space left on device" on the first-ever
      # run. Sized with real headroom above that, on the same StorageClass as
      # everything else.
      capacity: 20Gi
      storageClassName: ceph-block
    verifyFilesPercent: 100
  sources:
    - pvc:
        name: meta-garage-0
  volumeSnapshotClassName: csi-ceph-blockpool
