---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Name must exactly match what the garage StatefulSet's meta
  # volumeClaimTemplate expects (meta-garage-0) - a StatefulSet adopts a
  # pre-existing PVC matching that name instead of creating a fresh one
  # from its template, which is what lets us wire in dataSourceRef here.
  name: meta-garage-0
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: garage
  resources:
    requests:
      storage: 20Gi
  storageClassName: ceph-block
