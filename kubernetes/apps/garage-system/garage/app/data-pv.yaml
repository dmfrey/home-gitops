---
# Current state (2026-11-27): garage-0 is on a retained Ceph RBD volume (no PV
# here), garage-1 is garage-data-1 below (UNAS nas.internal:/garage_1, NFSv4.1
# from the node default plus the explicit option), garage-2 is garage-data-2
# (QNAP 192.168.30.2:/garage_data_2, NFSv3 + nolock, which overrides the nodes'
# default nfsvers=4.1 from talos/machineconfig.yaml.j2). These stay static PVs
# because each ordinal needs its own export/backing store, which inline volumes
# in a volumeClaimTemplate can't provide.
#
# Static per-replica NFS PersistentVolumes for Garage's object data. NFS volumes
# don't get per-ordinal templating the way StatefulSet volumeClaimTemplates give
# Ceph PVCs (see the "meta" volumeClaimTemplate in helmrelease.yaml) — each of
# these is pre-bound via claimRef to the specific PVC name that ordinal's
# volumeClaimTemplate will generate (data-garage-0/1/2), so each pod deterministically
# gets its own NFS export instead of accidentally sharing one.
#
# UNAS Pro migration (2026-09-29): all 3 now point at dedicated UNAS Shared
# Drives (garage_data_0/1/2), migrated one at a time via Garage's own
# node-replacement mechanics (empty volume + resync from the other 2 healthy
# RF=3 replicas over the internal cluster network), not a manual copy - see
# project_qnap_to_unas_migration memory for the full procedure, including the
# data_layout marker-file gotcha in each node's metadata volume.
# 2026-11-12 UNAS BAD BLOCKS: the UNAS RAID10 pool reported unrecoverable bad
# blocks, so these three point at the QNAP (192.168.30.2, exports /garage_data_N,
# copied with rsync --numeric-ids and size-verified) until the UNAS pool is rebuilt.
# Temporary: all three exports sit on ONE QNAP volume, so RF=3 does not protect
# against losing that volume. When the UNAS is rebuilt, do not copy data back;
# use Garage's node-replacement/resync workflow. PV spec.nfs is immutable: changing
# it means deleting the PV and the data-garage-N PVC first (Garage scaled to 0).
# 2026-11-17: UNAS rebuilt. garage-1 moved back to the UNAS (garage_1 share) by
# rsync (pre-copy, live catch-up, then a final --delete sync with the pod stopped)
# instead of resync-from-peers. garage-0 goes to Ceph and garage-2 stays on the
# QNAP so the three replicas sit on three failure domains.
# garage-0 -> Ceph (2026-11-17): data-garage-0 is bound by hand to a retained
# ceph-block RBD volume (a dynamic, RWO PV; pvc-f6902815-c57e-4d13-91f9-5f9a32eb2304,
# reclaimPolicy Retain, claimRef set to garage-system/data-garage-0), so there is no
# garage-data-0 PV here any more. The StatefulSet's RWX claim template does not match
# an RBD volume, so if that PVC is ever deleted, re-bind it to the retained PV rather
# than letting the StatefulSet provision a new one (an empty volume would resync
# ~150 GB from peers).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-data-1
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=4.1
  nfs:
    server: nas.internal
    path: /garage_1
  claimRef:
    name: data-garage-1
    namespace: garage-system
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-data-2
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # QNAP export: NFSv3 only, so pin it explicitly (nodes default to nfsvers=4.1).
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /garage_data_2
  claimRef:
    name: data-garage-2
    namespace: garage-system
