---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: garage
spec:
  # NOTE: components/volsync was dropped here. It assumed a single existingClaim
  # PVC named after the release ("garage"), which no longer matches: the meta
  # volume is now a per-replica StatefulSet volumeClaimTemplate, so Kubernetes
  # names the 3 PVCs meta-garage-0/1/2 instead. Only meta-garage-0 is backed up,
  # via a standalone ReplicationSource in app/ (not the shared component, since
  # its pvc.yaml/bootstrap-restore pattern assumes a single app-wide PVC that
  # doesn't apply here) — see app/replicationsource.yaml.
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  # kopiur-repository was briefly added here (2026-09-03) so garage's own
  # SnapshotPolicy could reference the "nfs" ClusterRepository - removed
  # again the same day: kopiur-repository's healthCheck watches the
  # "garage" ClusterRepository (S3-backed, used by every other app's
  # backups), which can't reach Ready while garage's own pods are down -
  # e.g. during this exact PVC cutover, or any future garage restart.
  # That's a real self-deadlock, not just a cutover-time inconvenience:
  # garage's Kustomization would never be able to reconcile again once
  # scaled down. garage doesn't actually need kopiur-repository's CRs to
  # be runtime-Ready anyway, only applied (kubectl apply succeeds
  # instantly regardless of ClusterRepository health), so there's no
  # correctness reason to keep this dependency.
  # Re-enabled 2026-08-04: was left commented out since 2026-03-26 with no
  # explanation, surviving the single-node -> 3-node migration. Apps that
  # depend on garage (e.g. every *-kv Kustomization for a DragonflyDB
  # instance using it as an S3 snapshot backend) need this to actually gate
  # on the HelmRelease being Ready, not just applied - a bare dependsOn on
  # this Kustomization without it only waits for kubectl apply to succeed.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: garage
      namespace: garage-system
  interval: 1h
  path: "./kubernetes/apps/garage-system/garage/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: garage-system
  wait: false
