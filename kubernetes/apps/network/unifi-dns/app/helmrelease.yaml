---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-dns

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: unifi-dns

  install:
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206

  upgrade:
    disableSchemaValidation: true # Ref: https://github.com/kubernetes-sigs/external-dns/issues/5206

  values:
    fullnameOverride: *app

    logLevel: &logLevel info

    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.10@sha256:9ff9e2a9ba4ab42026ae3b500524d26e6f8b47e7c84c3162121c15627d8dcb6b # kashalls/external-dns-unifi-webhook moved to home-operations org; v0.9.0 predates fixes for unbounded connection pool (0.10.4) and redundant CNAME-update deletes (0.10.8)

        env:
          - name: &name UNIFI_HOST
            valueFrom:
              secretKeyRef:
                name: &secret unifi-dns-secret
                key: *name
          - name: &name UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: *secret
                key: *name
          - name: LOG_LEVEL
            value: *logLevel

        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5

        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5

    # extraArgs:
    #   - --ignore-ingress-tls-spec

    triggerLoopOnEvent: true

    policy: sync

    sources:
      - gateway-httproute
      - service

    txtOwnerId: main
    txtPrefix: k8s.main.
    domainFilters:
      - dmfrey.com

    serviceMonitor:
      enabled: true

    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
