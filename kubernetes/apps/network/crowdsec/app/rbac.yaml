---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/serviceaccount.json
# The agent reads envoy-external's access logs through the Kubernetes API
# (additionalAcquisition in helmrelease.yaml), so it needs pod get/list/watch and pod logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-agent
subjects:
  - kind: ServiceAccount
    name: crowdsec-agent
    namespace: network
