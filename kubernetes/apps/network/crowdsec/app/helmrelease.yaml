---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec

  interval: 1h

  install:
    disableSchemaValidation: true # the chart schema rejects the kubernetes acquisition source

  upgrade:
    disableSchemaValidation: true

  values:
    container_runtime: containerd # the default (docker) mounts /var/lib/docker/containers into the agent

    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec

    lapi:
      env:
        - name: USE_WAL
          value: "true"
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      # The chart defaults request 500m CPU per component; this traffic is light.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      metrics:
        serviceMonitor:
          enabled: true

    config:
      postoverflows:
        s01-whitelist:
          # Never ban the home connection (Gatus's external checks and any hairpin traffic arrive from here)
          # or add travel addresses below when needed. Applies before a ban decision is created.
          home-whitelist.yaml: |
            name: dmfrey/home-whitelist
            description: "Home WAN addresses are never banned"
            whitelist:
              reason: "home WAN"
              ip:
                - "73.13.36.43"
              cidr:
                - "2601:40:cb81:f0c0::/64"

    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      # Parse envoy-external's access logs (Envoy Gateway's default JSON format) via the Kubernetes API.
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      metrics:
        serviceMonitor:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
