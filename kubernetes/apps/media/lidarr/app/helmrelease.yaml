---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
spec:
  chartRef:
    kind: OCIRepository
    name: lidarr
  interval: 1h
  values:
    controllers:
      lidarr:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.1.3@sha256:cd237339c1fef890437e1f5e896cb25e7c0b2abbe71abd1a614122f8aa13f89d
            env:
              TZ: America/New_York
              LIDARR__INSTANCE_NAME: lidarr
              LIDARR__PORT: &port 8686
              LIDARR__LOG_LEVEL: info
              LIDARR__ANALYTICS_ENABLED: "False"
              LIDARR__AUTHENTICATION_METHOD: External
              LIDARR__APPLICATION_URL: "https://lidarr.dmfrey.com"
              LIDARR__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-secret
                    key: LIDARR_API_KEY
              LIDARR__POSTGRES__HOST:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-cnpg-app
                    key: host
              LIDARR__POSTGRES__PORT:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-cnpg-app
                    key: port
              LIDARR__POSTGRES__USER:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-cnpg-app
                    key: user
              LIDARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-cnpg-app
                    key: password
              LIDARR__POSTGRES__MAINDB:
                valueFrom:
                  secretKeyRef:
                    name: lidarr-cnpg-app
                    key: dbname
              LIDARR__POSTGRES__LOGDB: lidarr-log
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Lidarr
          gethomepage.dev/icon: lidarr.png
          gethomepage.dev/description: Music Downloads
          gethomepage.dev/widget.type: lidarr
          gethomepage.dev/widget.url: http://lidarr.media.svc.cluster.local:8686
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_LIDARR_TOKEN}}` }}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      outpost:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
            backendRefs:
              - name: ak-outpost-authentik-embedded-outpost
                namespace: security
                port: 9000
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: nas.internal
        path: /media/
      backups:
        enabled: true
        type: nfs
        server: nas.internal
        path: /plexbackups/backups/lidarr
        advancedMounts:
          lidarr:
            app:
              - path: /config/Backups
                readOnly: false
      tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          lidarr:
            app:
              - path: /config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
