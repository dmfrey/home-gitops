---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
  - ./pvc-config.yaml
  - ./resourceclaimtemplate.yaml
  - ./snapshotpolicy.yaml
  - ./snapshotschedule.yaml

configMapGenerator:
  - name: plex-loki-rules
    files:
      - plex.yaml=./resources/lokirule.yaml
    options:
      labels:
        loki_rule: "true"

generatorOptions:
  disableNameSuffixHash: true
