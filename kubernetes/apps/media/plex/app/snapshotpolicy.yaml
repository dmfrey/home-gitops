---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  # kopiur phase 2 (project_kopiur_pilot) - backs up the SAME PVC VolSync
  # already backs up to nas.internal:/Kopia, additively. VolSync stays the
  # real backup path. Picked as the "something larger" phase-2 candidate
  # (35Gi, the biggest app-config PVC in the fleet outside garage/prometheus).
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 4Gi
      mode: Persistent
      storageClassName: ceph-block
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  repository:
    kind: ClusterRepository
    name: garage
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  verification:
    quick:
      schedule:
        cron: "H H * * *"
    deep:
      schedule:
        cron: "H H * * 0"
    verifyFilesPercent: 100
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: csi-ceph-blockpool
