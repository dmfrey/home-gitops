---
# unpackerr runs in the `media` namespace, but qbittorrent's own
# media-tv-downloads/media-music-downloads/media-movies-downloads PVCs live in
# `download` (kubernetes/apps/download/downloads-staging/app/nfs-pv.yaml) -
# PVCs are namespace-scoped, so unpackerr needs its own PVC per share
# pointing at the same underlying NFS export, same pattern used for the
# garage-system/kopiur-system split on kopia_nfs_repo. PV names must be
# unique cluster-wide; PVC names match what qbittorrent itself uses since
# they're in a different namespace.
# 2026-11-17: media_tv/media_music PVs are back on the rebuilt UNAS (copied from the QNAP).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-tv-downloads-media-ns
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 4Ti
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: nas.internal
    path: /volume/bca65fde-53e9-4a44-9c10-970f844d3152/.srv/.unifi-drive/media_tv/.data
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-tv-downloads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
  volumeName: media-tv-downloads-media-ns
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-music-downloads-media-ns
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Ti
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: nas.internal
    path: /volume/bca65fde-53e9-4a44-9c10-970f844d3152/.srv/.unifi-drive/media_music/.data
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-music-downloads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  volumeName: media-music-downloads-media-ns
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-movies-downloads-media-ns
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 8Ti
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /media_movies
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-movies-downloads
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Ti
  volumeName: media-movies-downloads-media-ns
  storageClassName: ""
