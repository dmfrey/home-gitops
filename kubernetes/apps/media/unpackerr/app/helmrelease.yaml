---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unpackerr
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/golift/unpackerr
              # Held below the current unstable digest (Renovate PR #5001,
              # 2026-08-28) - that build's /unpackerr binary fails to exec
              # entirely (exec: "/unpackerr": permission denied, reproduced
              # both as uid 1000 and as the image's own default user - not
              # a non-root permission issue, the binary itself is broken).
              # Checked the tag's newest digest as of 2026-08-29 too
              # (91382f89...) - still broken, so this isn't a one-off, the
              # unstable channel's build pipeline is bad right now. See
              # .renovate/overrides.json5 for the version hold.
              tag: unstable@sha256:3bd27abc303c6aa279ffbf7de87f123184de95a42e6ade6253a6d72d6c0bbf81
            env:
              TZ: America/New_York
              UN_INTERVAL: "1m"
              UN_WEBSERVER_METRICS: "true"
              # Paths updated 2026-10-01 - the old /media/downloads/<category>
              # values were the pre-category-routing-redesign (2026-09-29)
              # layout and haven't pointed at real content in a while; qbittorrent
              # moved completed downloads to per-media-type UNAS PVCs that same
              # day. NZBGet downloads need no entry here - its own
              # Category.Unpack=yes already extracts them itself; these paths
              # are qBittorrent-specific, the client with no built-in unpacking.
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local:8989
              UN_SONARR_0_PATHS_0: /media/tv/downloads/qbittorrent
              # UN_SONARR_0_API_KEY: # set in externalsecret
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local:7878
              UN_RADARR_0_PATHS_0: /media/movies-downloads/downloads/qbittorrent
              # UN_RADARR_0_API_KEY: # set in externalsecret
              UN_LIDARR_0_URL: http://lidarr.media.svc.cluster.local:8686
              UN_LIDARR_0_PATHS_0: /media/music-downloads/downloads/qbittorrent
              # UN_LIDARR_0_API_KEY: # set in externalsecret
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      priorityClassName: low
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
        supplementalGroups:
          - 568
          - 1568
    service:
      app:
        ports:
          http:
            port: 5656
    persistence:
      # Split off the old whole-root nas.internal:/media QNAP mount
      # (2026-10-01) - never migrated when the rest of download/media moved
      # to per-share UNAS PVCs, and its configured watch paths (above) had
      # gone stale anyway. Mounts the exact same 3 PVCs qbittorrent itself
      # uses at the exact same container paths, matching qbittorrent's own
      # mount-shape comments for why each is structured this way.
      media-tv:
        type: persistentVolumeClaim
        existingClaim: media-tv-downloads
        globalMounts:
          - path: /media/tv
      media-music:
        type: persistentVolumeClaim
        existingClaim: media-music-downloads
        globalMounts:
          - path: /media/music-downloads
      media-movies:
        type: persistentVolumeClaim
        existingClaim: media-movies-downloads
        globalMounts:
          - path: /media/movies-downloads
