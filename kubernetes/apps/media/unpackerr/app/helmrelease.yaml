---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unpackerr
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/golift/unpackerr
              # Held below the current unstable digest (Renovate PR #5001,
              # 2026-08-28) - that build's /unpackerr binary fails to exec
              # entirely (exec: "/unpackerr": permission denied, reproduced
              # both as uid 1000 and as the image's own default user - not
              # a non-root permission issue, the binary itself is broken).
              # Checked the tag's newest digest as of 2026-08-29 too
              # (91382f89...) - still broken, so this isn't a one-off, the
              # unstable channel's build pipeline is bad right now. See
              # .renovate/overrides.json5 for the version hold.
              tag: unstable@sha256:3bd27abc303c6aa279ffbf7de87f123184de95a42e6ade6253a6d72d6c0bbf81
            env:
              TZ: America/New_York
              UN_INTERVAL: "1m"
              UN_WEBSERVER_METRICS: "true"
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local:8989
              UN_SONARR_0_PATHS_0: /media/downloads/series
              # UN_SONARR_0_API_KEY: # set in externalsecret
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local:7878
              UN_RADARR_0_PATHS_0: /media/downloads/movies
              # UN_RADARR_0_API_KEY: # set in externalsecret
              UN_LIDARR_0_URL: http://lidarr.media.svc.cluster.local:8686
              UN_LIDARR_0_PATHS_0: /media/downloads/music
              # UN_LIDARR_0_API_KEY: # set in externalsecret
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
        supplementalGroups:
          - 568
          - 1568
    service:
      app:
        ports:
          http:
            port: 5656
    persistence:
      media:
        type: nfs
        server: nas.internal
        path: /media
