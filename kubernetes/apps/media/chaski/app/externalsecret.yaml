---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: chaski-secret
    template:
      engineVersion: v2
      data:
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        PUSHOVER_SONARR_API_KEY: "{{ .PUSHOVER_SONARR_API_KEY }}"
        PUSHOVER_RADARR_API_KEY: "{{ .PUSHOVER_RADARR_API_KEY }}"
  dataFrom:
    - extract:
        key: pushover
