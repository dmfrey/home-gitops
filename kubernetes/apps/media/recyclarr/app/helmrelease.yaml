---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: recyclarr

  values:
    defaultPodOptions:
      priorityClassName: low
      restartPolicy: OnFailure

    controllers:
      recyclarr:
        type: cronjob

        cronjob:
          schedule: "@daily"
          ttlSecondsAfterFinished: 86400

        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209

            command: ["/bin/sh", "-c"]

            args:
              - "/app/recyclarr/recyclarr state repair --adopt; /app/recyclarr/recyclarr sync"

            envFrom:
              - secretRef:
                  name: recyclarr-secret

    persistence:
      config:
        type: configMap
        name: recyclarr-configmap
        globalMounts:
          - path: /config/configs
            readOnly: true
        defaultMode: 0775
