---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: recyclarr

  values:
    defaultPodOptions:
      restartPolicy: OnFailure

    controllers:
      recyclarr:
        type: cronjob

        cronjob:
          schedule: "@daily"
          ttlSecondsAfterFinished: 86400

        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.1@sha256:73303ba5ee647b6492fee917d3a781c6e59b6cab08f9dfce9482a950846f564f

            command: ["/bin/sh", "-c"]

            args:
              - "/app/recyclarr/recyclarr state repair --adopt; /app/recyclarr/recyclarr sync"

            envFrom:
              - secretRef:
                  name: recyclarr-secret

    persistence:
      config:
        type: configMap
        name: recyclarr-configmap
        globalMounts:
          - path: /config/configs
            readOnly: true
        defaultMode: 0775
