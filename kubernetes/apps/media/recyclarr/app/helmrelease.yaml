---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr

spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: recyclarr

  values:
    defaultPodOptions:
      priorityClassName: low
      restartPolicy: OnFailure

    controllers:
      recyclarr:
        type: cronjob

        cronjob:
          schedule: "@daily"
          ttlSecondsAfterFinished: 86400

        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.3@sha256:9c6c74d52cfc6f740a5a3624aa83867e171bb70b90453ddb7a4048b8c80445f9

            command: ["/bin/sh", "-c"]

            args:
              - "/app/recyclarr/recyclarr state repair --adopt; /app/recyclarr/recyclarr sync"

            envFrom:
              - secretRef:
                  name: recyclarr-secret

    persistence:
      config:
        type: configMap
        name: recyclarr-configmap
        globalMounts:
          - path: /config/configs
            readOnly: true
        defaultMode: 0775
