---
# Shared app-config backup share (renamed from the stale QNAP-era
# /plexbackups - no longer Plex-specific, just *arr/pinepods app-config
# backups), consumed by radarr/sonarr/lidarr/bazarr/pinepods here plus
# prowlarr in the download namespace (separate PV/PVC there, same
# underlying export - see kubernetes/apps/download/prowlarr/app/nfs-pv.yaml).
# Secondary safety net on top of each app's own internal backup rotation,
# not primary data - not part of the hardlink-routing redesign.
# 2026-11-16: UNAS pool rebuilt (RAID6, new pool UUID); restored from the QNAP copy.
# PV spec.nfs is immutable: changing it means deleting the PV and PVC first. The
# share's export path ends in /.data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-backups
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: nas.internal
    path: /volume/bca65fde-53e9-4a44-9c10-970f844d3152/.srv/.unifi-drive/app_backups/.data
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-backups
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: app-backups
  storageClassName: ""
