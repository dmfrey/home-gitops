---
# Shared app-config backup share (renamed from the stale QNAP-era
# /plexbackups - no longer Plex-specific, just *arr/pinepods app-config
# backups), consumed by radarr/sonarr/lidarr/bazarr/pinepods here plus
# prowlarr in the download namespace (separate PV/PVC there, same
# underlying export - see kubernetes/apps/download/prowlarr/app/nfs-pv.yaml).
# Secondary safety net on top of each app's own internal backup rotation,
# not primary data - not part of the hardlink-routing redesign.
# 2026-11-12 UNAS BAD BLOCKS: pointed at the QNAP (192.168.30.2) copy until the UNAS pool is
# rebuilt. PV spec.nfs is immutable: changing it means deleting the PV and PVC first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-backups
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /app_backups
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-backups
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: app-backups
  storageClassName: ""
