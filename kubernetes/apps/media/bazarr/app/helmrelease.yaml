---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr

spec:
  chartRef:
    kind: OCIRepository
    name: bazarr

  interval: 1h

  values:
    controllers:
      bazarr:
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/bazarr
              tag: 1.6.0

            env:
              TZ: America/New_York
              BAZARR__AUTHENTICATION_REQUIRED: DisabledForLocalAddresses
              BAZARR__LOG_LEVEL: info
              POSTGRES_ENABLED: true
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-cnpg-app
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-cnpg-app
                    key: port
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-cnpg-app
                    key: dbname
              POSTGRES_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-cnpg-app
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bazarr-cnpg-app
                    key: password

            envFrom:
              - secretRef:
                  name: bazarr-secret

            probes:
              # Bazarr's startup does a DB migration against its CNPG-backed
              # Postgres plus outbound calls to Sonarr/Radarr/GitHub, and can
              # run past liveness's tight ~30s (periodSeconds*failureThreshold)
              # budget under any storage/DB latency spike (e.g. confirmed
              # 2026-09-08: a Ceph OSD recovery backfill after a node outage
              # slowed Postgres just enough to push startup past that window,
              # causing a real restart loop with no actual error in the logs -
              # kubelet killing an app that was still mid-startup, not hung).
              # This gates liveness/readiness until first success, giving up
              # to 5m of startup grace without loosening steady-state checks.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 6767
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 500Mi

            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          subcleaner:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717

            env:
              GITSYNC_REPO: https://github.com/KBlixt/subcleaner
              GITSYNC_REF: master
              GITSYNC_PERIOD: 24h
              GITSYNC_ROOT: /add-ons

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi

            securityContext: *securityContext

          # exporter:
          #   image:
          #     repository: ghcr.io/onedr0p/exportarr
          #     tag: v2.1.0

          #   args:
          #     - bazarr
          #     - --enable-additional-metrics

          #   env:
          #     URL: "http://localhost:6767"
          #     PORT: &metricsPort 9710
          #     APIKEY:
          #       valueFrom:
          #         secretKeyRef:
          #           name: bazarr-secret
          #           key: BAZARR_API_KEY

          #   resources:
          #     requests:
          #       cpu: 10m
          #     limits:
          #       memory: 128Mi

          #   securityContext: *securityContext

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: bazarr
        ports:
          http:
            port: *port
            # metrics:
            #   port: *metricsPort

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Bazarr
          gethomepage.dev/icon: bazarr.png
          gethomepage.dev/description: Subtitle Downloads
          gethomepage.dev/widget.type: bazarr
          gethomepage.dev/widget.url: http://bazarr.media.svc.cluster.local:6767
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_BAZARR_TOKEN}}` }}"
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      add-ons:
        type: emptyDir

      # cache:
      #   type: emptyDir
      #   medium: Memory
      #   globalMounts:
      #     - path: /config/cache

      config:
        existingClaim: "{{ .Release.Name }}"

      # log:
      #   type: emptyDir
      #   globalMounts:
      #     - path: /config/log

      media:
        type: nfs
        server: nas.internal
        path: /media

      scripts:
        type: configMap
        name: bazarr-scripts
        defaultMode: 0775
        globalMounts:
          - readOnly: true

      tmp:
        type: emptyDir

      backups:
        type: nfs
        server: nas.internal
        path: /plexbackups/backups/bazarr
        globalMounts:
          - path: /config/backup
            # serviceMonitor:
            #   metrics:
            #     serviceName: bazarr
            #     endpoints:
            #       - port: metrics
            #         scheme: http
            #         path: /metrics
            #         interval: 10m
            #         scrapeTimeout: 10s
