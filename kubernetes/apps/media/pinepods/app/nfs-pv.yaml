---
# UNAS Pro migration (2026-09-29): app-template's persistence.type: nfs
# shorthand maps to a plain Kubernetes v1.NFSVolumeSource, which has no
# mountOptions field at all - only PersistentVolume.spec.mountOptions
# supports it. The UNAS Pro only speaks NFSv3 to Linux clients (confirmed
# via its own web UI) and Talos nodes default to NFSv4.1 (deliberate
# global /etc/nfsmount.conf tuning for the old QNAP, see
# talos/machineconfig.yaml.j2), so this mount needs an explicit static
# PV/PVC pair instead of the usual shorthand.
#
# No data migration was done for this share - PinePods no longer
# downloads podcast episodes server-side (episodes now sync straight to
# the Android app instead), so the old QNAP content is historical/static
# and was deliberately left behind rather than copied over. This mount is
# kept (not removed) in case that setup ever changes back.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pinepods-media
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: unas.internal
    path: /volume/98306492-ba3e-4373-ba5a-e6e661135f84/.srv/.unifi-drive/media_podcasts/.data
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinepods-media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: pinepods-media
  storageClassName: ""
