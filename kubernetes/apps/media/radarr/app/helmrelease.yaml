---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr

spec:
  chartRef:
    kind: OCIRepository
    name: radarr

  interval: 1h

  values:
    controllers:
      radarr:
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e

            env:
              TZ: America/New_York
              RADARR__INSTANCE_NAME: radarr
              RADARR__PORT: &port 7878
              RADARR__APPLICATION_URL: https://radarr.dmfrey.com
              RADARR__LOG_LEVEL: info
              RADARR__ANALYTICS_ENABLED: "False"
              RADARR__AUTHENTICATION_METHOD: External
              RADARR__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR_API_KEY

            probes:
              # httpGet sends no Host header of its own, so kubelet defaults
              # it to the pod IP - once Allowed Hosts is configured (General
              # settings, set live via API since devopsarr/radarr has no
              # terraform resource for it) that pod-IP Host header gets
              # rejected with 400, crash-looping the pod on every probe.
              # Confirmed live 2026-09-14: explicit httpHeaders here is
              # required, not optional, the moment Allowed Hosts is set to
              # anything.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: radarr.media.svc.cluster.local
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 350Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: radarr
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Radarr
          gethomepage.dev/icon: radarr.png
          gethomepage.dev/description: Movie Downloads
          gethomepage.dev/widget.type: radarr
          gethomepage.dev/widget.url: http://radarr.media.svc.cluster.local:7878
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_RADARR_TOKEN}}` }}"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=radarr
        parentRefs:
          - name: envoy-internal
            namespace: network
      outpost:
        hostnames:
          - "{{ .Release.Name }}.dmfrey.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /outpost.goauthentik.io
            backendRefs:
              - name: ak-outpost-authentik-embedded-outpost
                namespace: security
                port: 9000

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"

      media:
        type: nfs
        server: nas.internal
        path: /media

      backups:
        enabled: true
        type: nfs
        server: nas.internal
        path: /plexbackups/backups/radarr
        advancedMounts:
          radarr:
            app:
              - path: /config/Backups

      tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          radarr:
            app:
              - path: /tmp
