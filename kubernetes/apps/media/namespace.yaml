---
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # pinepods's SnapshotPolicy mover needs runAsUser: 0 (its PVC is
    # root:root owned) - kopiur fail-closes privileged movers per-namespace
    # by design, this is the documented opt-in.
    kopiur.home-operations.com/privileged-movers: "true"
