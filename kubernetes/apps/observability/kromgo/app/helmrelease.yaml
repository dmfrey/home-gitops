---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  chartRef:
    kind: OCIRepository
    name: kromgo
  interval: 1h
  values:
    config:
      prometheus: http://prometheus-operated.{{ .Release.Namespace }}.svc.cluster.local:9090
      badges:
        - title: Talos
          id: talos_version
          query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
          valueExpr: labels["version_id"]
          icon: si:talos

        - title: Kubernetes
          id: kubernetes_version
          query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)")
          valueExpr: labels["git_version"]
          icon: si:kubernetes

        - title: Flux
          id: flux_version
          query: label_replace(flux_instance_info, "revision", "$1", "revision", "v(.+)@sha256:.+")
          valueExpr: labels["revision"]
          icon: si:flux

        - title: Nodes
          id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: '"green"'

        - title: Pods
          id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          valueExpr: humanizeCommas(result)
          colorExpr: '"green"'

        - title: CPU
          id: cluster_cpu_usage
          query: round(avg(instance:node_cpu_utilisation:rate5m{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Memory
          id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Power
          id: cluster_power_usage
          query: unpoller_device_ups_power_output_watts{device_name="UPS Tower"}
          valueExpr: humanizeCommas(math.round(result)) + "w"
          colorExpr: 'colorScale(result, [400.0, 750.0], ["green", "orange", "red"])'

        - title: Age
          id: cluster_age_days
          query: round(time() - min(kube_node_created))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Uptime
          id: cluster_uptime_days
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Alerts
          id: cluster_alert_count
          query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
          colorExpr: 'colorScale(result, [1.0], ["green", "red"])'

        - title: Spring Notes Uptime
          id: spring_notes_uptime_days
          query: process_uptime_seconds{job="spring-notes"}
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [86400.0, 604800.0], ["orange", "green"])'

        - title: Spring Notes Requests
          id: spring_notes_request_rate
          query: round(sum(rate(http_server_requests_seconds_count{job="spring-notes"}[5m])), 0.01)
          valueExpr: string(result) + "/s"
          colorExpr: '"green"'

        - title: Spring Notes Error Rate
          id: spring_notes_error_rate
          query: round(sum(rate(http_server_requests_seconds_count{job="spring-notes", outcome="SERVER_ERROR"}[15m])) / sum(rate(http_server_requests_seconds_count{job="spring-notes"}[15m])) * 100, 0.01) or vector(0)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [1.0, 5.0], ["green", "orange", "red"])'

        - title: Spring Notes P95 Latency
          id: spring_notes_p95_latency
          query: round(histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="spring-notes"}[15m])) by (le)) * 1000, 1)
          valueExpr: string(result) + "ms"
          colorExpr: 'colorScale(result, [200.0, 750.0], ["green", "orange", "red"])'

        - title: Spring Notes JVM Heap
          id: spring_notes_jvm_heap
          # jvm_memory_max_bytes is -1 for every heap pool on this app's
          # GraalVM native image runtime (no fixed generational max the way
          # a standard HotSpot JVM has), so committed is used as the
          # denominator instead of max.
          query: round(sum(jvm_memory_used_bytes{job="spring-notes", area="heap"}) / sum(jvm_memory_committed_bytes{job="spring-notes", area="heap"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [60.0, 85.0], ["green", "orange", "red"])'

        - title: Spring Notes DB Pool
          id: spring_notes_db_pool
          query: round(sum(hikaricp_connections_active{job="spring-notes"}) / sum(hikaricp_connections_max{job="spring-notes"}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [60.0, 85.0], ["green", "orange", "red"])'

        - title: Spring Notes Restarts
          id: spring_notes_restarts
          query: sum(kube_pod_container_status_restarts_total{namespace="spring-notes", container="app"})
          colorExpr: 'colorScale(result, [1.0, 5.0], ["green", "orange", "red"])'

    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      hostnames:
        - "{{ .Release.Name }}.dmfrey.com"
      parentRefs:
        - name: envoy-external
          namespace: network

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
