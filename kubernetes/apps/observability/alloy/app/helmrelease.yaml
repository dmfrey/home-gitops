---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  chartRef:
    kind: OCIRepository
    name: alloy
  interval: 1h
  values:
    alloy:
      # otelcol.receiver.tcplog (kernel-log pipeline below) is gated at the
      # "experimental" stability level - confirmed live 2026-09-16, the
      # component docs don't flag this but the chart's default
      # "generally-available" level refuses to load it. Only unlocks
      # additional components; doesn't affect the already-GA ones in use
      # here (otelcol.receiver.otlp, loki.source.kubernetes, etc).
      stabilityLevel: experimental
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
        - name: kernel-tcp
          port: 6514
          targetPort: 6514
          protocol: TCP
        # The UniFi syslog UDP listener (5514) is deliberately NOT listed here.
        # A containerPort changes the pod template and rolls every Alloy pod,
        # and Alloy's tail positions live in the container's ephemeral /tmp, so
        # each restart re-reads and re-sends all retained container logs. The
        # alloy-unifi-syslog Service targets the numeric port, so it works
        # without a declared containerPort.
      configMap:
        create: true
        content: |-
          // Discover Kubernetes pods on this node only. Without the selector
          // every DaemonSet pod tails the whole cluster (3x duplicate entries
          // that Loki silently dedups on ingest). coalesce guards against an
          // empty env var, which would match only unscheduled pods.
          discovery.kubernetes "pods" {
            role = "pod"

            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("K8S_NODE_NAME"), sys.env("HOSTNAME"))
            }
          }

          // Relabel discovered pods to extract metadata
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            // ---- Canonical log schema (foundation / infra.layer / workload.id) ----
            // foundation and infra_layer become Loki labels (low cardinality,
            // fully determined by namespace). workload_id is carried as a temp
            // label only so loki.process can move it to structured metadata.
            rule {
              target_label = "foundation"
              replacement  = "homelab-k8s-001"
            }

            // infra_layer: default "app", then override by namespace.
            // EDIT THE NAMESPACE LISTS HERE - this is the single place they live.
            rule {
              target_label = "infra_layer"
              replacement  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              regex         = "rook-ceph|openebs-system|garage-system|network"
              target_label  = "infra_layer"
              replacement   = "infra"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              regex         = "kube-system|flux-system|cert-manager|datastore|observability|external-secrets|cilium-secrets|kopiur-system|system-upgrade|actions-runner-system"
              target_label  = "infra_layer"
              replacement   = "platform"
            }

            // workload_app, lowest to highest priority (each rule only fires
            // when its source is non-empty, so later rules override earlier
            // ones). cnpg.io/cluster and the legacy "app" label sit above
            // app.kubernetes.io/name because CNPG and DragonflyDB pods all
            // share one generic app.kubernetes.io/name per kind.
            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_component"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            // Job pods: strip the trailing run number (e.g. -29853710).
            rule {
              source_labels = ["__meta_kubernetes_pod_controller_kind", "__meta_kubernetes_pod_controller_name"]
              regex         = "Job;(.+)-[0-9]+"
              target_label  = "workload_app"
              replacement   = "$1"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            // workload_id = <namespace>/<workload_app>; the regex requires both
            // halves so a missing app never yields a bare "namespace/".
            rule {
              source_labels = ["__meta_kubernetes_namespace", "workload_app"]
              separator     = "/"
              regex         = "(.+/.+)"
              target_label  = "workload_id"
              replacement   = "$1"
            }

            rule {
              action = "labeldrop"
              regex  = "workload_app"
            }
          }

          // Collect logs from Kubernetes pods
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pods.receiver]
          }

          // Process logs
          loki.process "pods" {
            // Drop empty log lines
            stage.drop {
              expression = "^\\s*$"
            }

            // Canonical schema: infra_host (= the pod's node name, already a
            // short lowercase hostname) and workload_id go in as structured
            // metadata, not labels. workload_id only exists as a temp label to
            // get it into this stage (target labels seed the extracted map),
            // so drop it afterwards to keep it out of the stream labels.
            stage.structured_metadata {
              values = {
                infra_host  = "node",
                workload_id = "workload_id",
              }
            }

            stage.label_drop {
              values = ["workload_id"]
            }

            forward_to = [loki.write.default.receiver]
          }

          // Write logs to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.observability.svc.cluster.local:80/loki/api/v1/push"
            }
          }

          // Receive OTLP traces and metrics from applications
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces  = [otelcol.processor.batch.default.input]
              metrics = [otelcol.exporter.prometheus.otlp.input]
            }
          }

          // Batch traces before exporting
          otelcol.processor.batch "default" {
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Export traces to Tempo
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.observability.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }

          // Convert OTLP metrics to Prometheus format
          otelcol.exporter.prometheus "otlp" {
            forward_to = [prometheus.remote_write.default.receiver]
          }

          // Forward metrics to Prometheus via remote write
          prometheus.remote_write "default" {
            endpoint {
              url = "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
            }
          }

          // Receive Talos kernel-log JSON lines over raw TCP (KmsgLogConfig
          // destination, see talos/machineconfig.yaml.j2). Replaces a
          // loki.source.file tailing /dev/kmsg that never worked - /dev/kmsg
          // is a character device, and file-tailers can't read those; zero
          // lines were ever ingested. otelcol.receiver.tcplog has no syslog
          // PRI-header requirement, matching Talos's plain JSON-lines output.
          // add_attributes adds net.peer.ip, which is the only way to tell
          // nodes apart here since the KmsgLogConfig url is identical on
          // all 3 nodes.
          otelcol.receiver.tcplog "kernel" {
            listen_address = "0.0.0.0:6514"
            add_attributes = true
            output {
              logs = [otelcol.processor.transform.kernel.input]
            }
          }

          // Map each node's known static IP to its hostname.
          otelcol.processor.transform "kernel" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                `set(log.attributes["node"], "k8s-0") where log.attributes["net.peer.ip"] == "192.168.30.10"`,
                `set(log.attributes["node"], "k8s-1") where log.attributes["net.peer.ip"] == "192.168.30.11"`,
                `set(log.attributes["node"], "k8s-2") where log.attributes["net.peer.ip"] == "192.168.30.12"`,
                // Canonical schema. infra.host is only set when the IP mapped
                // to a hostname above, so an unmapped IP never leaks as a host.
                `set(log.attributes["foundation"], "homelab-k8s-001")`,
                `set(log.attributes["infra.layer"], "infra")`,
                `set(log.attributes["infra.host"], log.attributes["node"]) where log.attributes["node"] != nil`,
              ]
            }

            output {
              logs = [otelcol.processor.attributes.kernel.input]
            }
          }

          // Tag job="kernel" (matches resources/lokirule.yaml's
          // NodeFilesystemEmergencyReadOnly alert) and promote job/node plus
          // the canonical infra.layer/foundation to real Loki labels
          // (infra.layer becomes the infra_layer label).
          otelcol.processor.attributes "kernel" {
            action {
              key    = "job"
              value  = "kernel"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,node,infra.layer,foundation"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.kernel.input]
            }
          }

          // Bridge OTLP-formatted logs into the existing Loki write pipeline.
          otelcol.exporter.loki "kernel" {
            forward_to = [loki.process.kernel.receiver]
          }

          // The exporter can only promote labels; every other attribute lands
          // inside the JSON log line ({"body":..., "attributes":{...}}). Lift
          // infra.host out into structured metadata so kernel records carry
          // the same schema as pod records. The line itself is left unchanged.
          loki.process "kernel" {
            stage.json {
              expressions = {
                infra_host = "attributes.\"infra.host\"",
              }
            }

            stage.structured_metadata {
              values = {
                infra_host = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // Receive UniFi syslog over UDP (UniFi cannot send TCP). The syslog
          // receiver parses RFC3164 when it can (appname/hostname/message/priority) and
          // forwards anything unparseable as a raw body with only net.* attributes, so
          // no datagram is dropped. add_attributes gives net.peer.ip, the only reliable
          // way to tell devices apart.
          otelcol.receiver.syslog "unifi" {
            protocol = "rfc3164"

            udp {
              listen_address     = "0.0.0.0:5514"
              add_attributes     = true
              one_log_per_packet = true
            }

            output {
              logs = [otelcol.processor.transform.unifi.input]
            }
          }

          // Map each known device's static IP to a canonical hostname and stamp the
          // canonical schema. Unmapped sources (APs, the UDM SE until its source IP is
          // confirmed from samples) are kept but get no infra.host.
          otelcol.processor.transform "unifi" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                // RFC3164 timestamps have no year or timezone, and unparsed records
                // carry a zero (1970) timestamp, which Loki would reject as too old.
                // Always stamp receive time instead.
                `set(log.time, log.observed_time)`,
                // Make the body the parsed message text when the datagram parsed (the
                // raw line otherwise), so loki.process can store it as the line without
                // a Go template. The chart runs this whole config through Helm tpl,
                // which would evaluate and mangle any double-brace template written here.
                `set(log.body, log.attributes["message"]) where log.attributes["message"] != nil`,
                `set(log.attributes["infra.host"], "usw-pro-max-24") where log.attributes["net.peer.ip"] == "192.168.86.148"`,
                `set(log.attributes["infra.host"], "usw-ultra-basement") where log.attributes["net.peer.ip"] == "192.168.86.120"`,
                `set(log.attributes["infra.host"], "usw-flex-patio") where log.attributes["net.peer.ip"] == "192.168.86.21"`,
                `set(log.attributes["foundation"], "homelab-k8s-001")`,
                `set(log.attributes["infra.layer"], "infra")`,
                `set(log.attributes["infra.component"], "network")`,
              ]
            }

            output {
              logs = [otelcol.processor.attributes.unifi.input]
            }
          }

          // job/infra.layer/foundation become Loki labels; everything else goes to
          // structured metadata in loki.process below.
          otelcol.processor.attributes "unifi" {
            action {
              key    = "job"
              value  = "unifi-syslog"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,infra.layer,foundation"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.unifi.input]
            }
          }

          otelcol.exporter.loki "unifi" {
            forward_to = [loki.process.unifi.receiver]
          }

          // Unwrap the exporter's JSON envelope: the stored line is the syslog message
          // text only (falling back to the whole raw body when the datagram didn't
          // parse), and the header fields move to structured metadata.
          loki.process "unifi" {
            stage.json {
              expressions = {
                line_out        = "body",
                infra_host      = "attributes.\"infra.host\"",
                infra_component = "attributes.\"infra.component\"",
                appname         = "attributes.appname",
                syslog_hostname = "attributes.hostname",
                severity        = "severity",
              }
            }

            stage.structured_metadata {
              values = {
                infra_host      = "",
                infra_component = "",
                appname         = "",
                syslog_hostname = "",
                severity        = "",
              }
            }

            stage.output {
              source = "line_out"
            }

            // otelcol.exporter.loki derives a "level" label from the syslog severity;
            // severity is already kept as structured metadata, and the schema promotes
            // only infra_layer/foundation, so drop it to keep streams unsplit.
            stage.label_drop {
              values = ["level"]
            }

            forward_to = [loki.write.default.receiver]
          }

    controller:
      type: daemonset

    serviceMonitor:
      enabled: true
