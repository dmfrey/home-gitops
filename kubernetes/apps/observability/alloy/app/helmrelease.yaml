---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  chartRef:
    kind: OCIRepository
    name: alloy
  interval: 1h
  values:
    alloy:
      # otelcol.receiver.tcplog (kernel-log pipeline below) is gated at the
      # "experimental" stability level - confirmed live 2026-09-16, the
      # component docs don't flag this but the chart's default
      # "generally-available" level refuses to load it. Only unlocks
      # additional components; doesn't affect the already-GA ones in use
      # here (otelcol.receiver.otlp, loki.source.kubernetes, etc).
      stabilityLevel: experimental
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
        - name: kernel-tcp
          port: 6514
          targetPort: 6514
          protocol: TCP
      configMap:
        create: true
        content: |-
          // Discover Kubernetes pods
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Relabel discovered pods to extract metadata
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          // Collect logs from Kubernetes pods
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pods.receiver]
          }

          // Process logs
          loki.process "pods" {
            // Drop empty log lines
            stage.drop {
              expression = "^\\s*$"
            }

            forward_to = [loki.write.default.receiver]
          }

          // Write logs to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.observability.svc.cluster.local:80/loki/api/v1/push"
            }
          }

          // Receive OTLP traces and metrics from applications
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces  = [otelcol.processor.batch.default.input]
              metrics = [otelcol.exporter.prometheus.otlp.input]
            }
          }

          // Batch traces before exporting
          otelcol.processor.batch "default" {
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Export traces to Tempo
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.observability.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }

          // Convert OTLP metrics to Prometheus format
          otelcol.exporter.prometheus "otlp" {
            forward_to = [prometheus.remote_write.default.receiver]
          }

          // Forward metrics to Prometheus via remote write
          prometheus.remote_write "default" {
            endpoint {
              url = "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
            }
          }

          // Receive Talos kernel-log JSON lines over raw TCP (KmsgLogConfig
          // destination, see talos/machineconfig.yaml.j2). Replaces a
          // loki.source.file tailing /dev/kmsg that never worked - /dev/kmsg
          // is a character device, and file-tailers can't read those; zero
          // lines were ever ingested. otelcol.receiver.tcplog has no syslog
          // PRI-header requirement, matching Talos's plain JSON-lines output.
          // add_attributes adds net.peer.ip, which is the only way to tell
          // nodes apart here since the KmsgLogConfig url is identical on
          // all 3 nodes.
          otelcol.receiver.tcplog "kernel" {
            listen_address = "0.0.0.0:6514"
            add_attributes = true
            output {
              logs = [otelcol.processor.transform.kernel.input]
            }
          }

          // Map each node's known static IP to its hostname.
          otelcol.processor.transform "kernel" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                `set(attributes["node"], "k8s-0") where attributes["net.peer.ip"] == "192.168.30.10"`,
                `set(attributes["node"], "k8s-1") where attributes["net.peer.ip"] == "192.168.30.11"`,
                `set(attributes["node"], "k8s-2") where attributes["net.peer.ip"] == "192.168.30.12"`,
              ]
            }

            output {
              logs = [otelcol.processor.attributes.kernel.input]
            }
          }

          // Tag job="kernel" (matches resources/lokirule.yaml's
          // NodeFilesystemEmergencyReadOnly alert) and promote job/node to
          // real Loki labels. loki.attribute.labels as a comma-separated
          // list is unverified against docs - confirm live once deployed.
          otelcol.processor.attributes "kernel" {
            action {
              key    = "job"
              value  = "kernel"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,node"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.kernel.input]
            }
          }

          // Bridge OTLP-formatted logs into the existing Loki write pipeline.
          otelcol.exporter.loki "kernel" {
            forward_to = [loki.write.default.receiver]
          }

    controller:
      type: daemonset

    serviceMonitor:
      enabled: true
