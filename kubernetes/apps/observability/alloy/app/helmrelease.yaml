---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  chartRef:
    kind: OCIRepository
    name: alloy
  interval: 1h
  values:
    alloy:
      # otelcol.receiver.tcplog (kernel-log pipeline below) is gated at the
      # "experimental" stability level - confirmed live 2026-09-16, the
      # component docs don't flag this but the chart's default
      # "generally-available" level refuses to load it. Only unlocks
      # additional components; doesn't affect the already-GA ones in use
      # here (otelcol.receiver.otlp, loki.source.kubernetes, etc).
      stabilityLevel: experimental
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
        - name: kernel-tcp
          port: 6514
          targetPort: 6514
          protocol: TCP
        # The UniFi syslog UDP listener (5514) is deliberately NOT listed here.
        # A containerPort changes the pod template and rolls every Alloy pod,
        # and Alloy's tail positions live in the container's ephemeral /tmp, so
        # each restart re-reads and re-sends all retained container logs. The
        # alloy-unifi-syslog Service targets the numeric port, so it works
        # without a declared containerPort.
      configMap:
        create: true
        content: |-
          // Namespace-to-layer classification, the ONE place these lists live. Used by
          // the pod relabel rules (infra_layer label) and by the OTLP logs pipeline
          // (infra.layer attribute), so both classify a namespace identically.
          // Everything not listed is "app". Edit the lists here (regex alternations).
          declare "namespace_layers" {
            export "infra" {
              value = "rook-ceph|openebs-system|garage-system|network"
            }

            export "platform" {
              value = "kube-system|flux-system|cert-manager|datastore|observability|external-secrets|cilium-secrets|kopiur-system|system-upgrade|actions-runner-system"
            }
          }

          namespace_layers "default" {}

          // Discover Kubernetes pods on this node only. Without the selector
          // every DaemonSet pod tails the whole cluster (3x duplicate entries
          // that Loki silently dedups on ingest). coalesce guards against an
          // empty env var, which would match only unscheduled pods.
          discovery.kubernetes "pods" {
            role = "pod"

            selectors {
              role  = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("K8S_NODE_NAME"), sys.env("HOSTNAME"))
            }
          }

          // Relabel discovered pods to extract metadata
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            // ---- Canonical log schema (foundation / infra.layer / workload.id) ----
            // foundation and infra_layer become Loki labels (low cardinality,
            // fully determined by namespace). workload_id is carried as a temp
            // label only so loki.process can move it to structured metadata.
            rule {
              target_label = "foundation"
              replacement  = "homelab-k8s-001"
            }

            // infra_layer: default "app", then override by namespace. The namespace
            // lists live in the namespace_layers block at the top of this config.
            rule {
              target_label = "infra_layer"
              replacement  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              regex         = namespace_layers.default.infra
              target_label  = "infra_layer"
              replacement   = "infra"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              regex         = namespace_layers.default.platform
              target_label  = "infra_layer"
              replacement   = "platform"
            }

            // workload_app, lowest to highest priority (each rule only fires
            // when its source is non-empty, so later rules override earlier
            // ones). cnpg.io/cluster and the legacy "app" label sit above
            // app.kubernetes.io/name because CNPG and DragonflyDB pods all
            // share one generic app.kubernetes.io/name per kind.
            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_component"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            // Job pods: strip the trailing run number (e.g. -29853710).
            rule {
              source_labels = ["__meta_kubernetes_pod_controller_kind", "__meta_kubernetes_pod_controller_name"]
              regex         = "Job;(.+)-[0-9]+"
              target_label  = "workload_app"
              replacement   = "$1"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
              regex         = "(.+)"
              target_label  = "workload_app"
            }

            // workload_id = <namespace>/<workload_app>; the regex requires both
            // halves so a missing app never yields a bare "namespace/".
            rule {
              source_labels = ["__meta_kubernetes_namespace", "workload_app"]
              separator     = "/"
              regex         = "(.+/.+)"
              target_label  = "workload_id"
              replacement   = "$1"
            }

            rule {
              action = "labeldrop"
              regex  = "workload_app"
            }
          }

          // Collect logs from Kubernetes pods
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pods.receiver]
          }

          // Process logs
          loki.process "pods" {
            // Drop empty log lines
            stage.drop {
              expression = "^\\s*$"
            }

            // Canonical schema: infra_host (= the pod's node name, already a
            // short lowercase hostname) and workload_id go in as structured
            // metadata, not labels. workload_id only exists as a temp label to
            // get it into this stage (target labels seed the extracted map),
            // so drop it afterwards to keep it out of the stream labels.
            stage.structured_metadata {
              values = {
                infra_host  = "node",
                workload_id = "workload_id",
              }
            }

            stage.label_drop {
              values = ["workload_id"]
            }

            forward_to = [loki.write.default.receiver]
          }

          // Write logs to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.observability.svc.cluster.local:80/loki/api/v1/push"
            }
          }

          // Receive OTLP traces, metrics and logs from applications
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            http {
              endpoint = "0.0.0.0:4318"
            }
            output {
              traces  = [otelcol.processor.batch.default.input]
              metrics = [otelcol.exporter.prometheus.otlp.input]
              logs    = [otelcol.processor.k8sattributes.otlp_logs.input]
            }
          }

          // Batch traces before exporting
          otelcol.processor.batch "default" {
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Export traces to Tempo
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.observability.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }

          // Convert OTLP metrics to Prometheus format
          otelcol.exporter.prometheus "otlp" {
            forward_to = [prometheus.remote_write.default.receiver]
          }

          // Forward metrics to Prometheus via remote write
          prometheus.remote_write "default" {
            endpoint {
              url = "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
            }
          }

          // ---- OTLP logs: canonical schema, then Loki ----
          // Nothing sends OTLP logs yet; this makes the path exist. The sender pod is
          // found by its connection IP and enriched with namespace, pod, node and the
          // pod labels the workload.id chain needs. Senders Alloy cannot associate (outside
          // the cluster, no match) just skip the enrichment and get the fallbacks below.
          otelcol.processor.k8sattributes "otlp_logs" {
            extract {
              metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.node.name"]

              label {
                from     = "pod"
                key      = "cnpg.io/cluster"
                tag_name = "k8s.pod.label.cnpg_cluster"
              }
              label {
                from     = "pod"
                key      = "app"
                tag_name = "k8s.pod.label.app"
              }
              label {
                from     = "pod"
                key      = "app.kubernetes.io/name"
                tag_name = "k8s.pod.label.app_name"
              }
              label {
                from     = "pod"
                key      = "k8s-app"
                tag_name = "k8s.pod.label.k8s_app"
              }
              label {
                from     = "pod"
                key      = "component"
                tag_name = "k8s.pod.label.component"
              }
            }

            pod_association {
              source {
                from = "connection"
              }
            }

            output {
              logs = [otelcol.processor.transform.otlp_logs.input]
            }
          }

          // Stamp the same schema pod and UniFi logs carry. infra.layer uses the shared
          // namespace_layers lists. workload.id follows the pod chain (cnpg.io/cluster >
          // app > app.kubernetes.io/name > k8s-app > component), then falls back to the
          // sender's own service.name. Statements run in order; a later one overrides an
          // earlier one, so the chain is written lowest priority first.
          otelcol.processor.transform "otlp_logs" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                // Apps carry real timestamps; only fall back to receive time if it is zero.
                `set(log.time, log.observed_time) where log.time_unix_nano == 0`,
                `set(log.attributes["foundation"], "homelab-k8s-001")`,
                `set(log.attributes["log_source"], "otlp")`,
                `set(log.attributes["infra.layer"], "app")`,
                string.format(`set(log.attributes["infra.layer"], "infra") where IsMatch(resource.attributes["k8s.namespace.name"], "^(%s)$")`, namespace_layers.default.infra),
                string.format(`set(log.attributes["infra.layer"], "platform") where IsMatch(resource.attributes["k8s.namespace.name"], "^(%s)$")`, namespace_layers.default.platform),
                `set(log.attributes["namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil`,
                `set(log.attributes["infra.host"], resource.attributes["k8s.node.name"]) where resource.attributes["k8s.node.name"] != nil`,
                `set(log.attributes["workload.app"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil`,
                `set(log.attributes["workload.app"], resource.attributes["k8s.pod.label.component"]) where resource.attributes["k8s.pod.label.component"] != nil`,
                `set(log.attributes["workload.app"], resource.attributes["k8s.pod.label.k8s_app"]) where resource.attributes["k8s.pod.label.k8s_app"] != nil`,
                `set(log.attributes["workload.app"], resource.attributes["k8s.pod.label.app_name"]) where resource.attributes["k8s.pod.label.app_name"] != nil`,
                `set(log.attributes["workload.app"], resource.attributes["k8s.pod.label.app"]) where resource.attributes["k8s.pod.label.app"] != nil`,
                `set(log.attributes["workload.app"], resource.attributes["k8s.pod.label.cnpg_cluster"]) where resource.attributes["k8s.pod.label.cnpg_cluster"] != nil`,
                `set(log.attributes["workload.id"], Concat([resource.attributes["k8s.namespace.name"], "/", log.attributes["workload.app"]], "")) where resource.attributes["k8s.namespace.name"] != nil and log.attributes["workload.app"] != nil`,
                `set(log.attributes["workload.id"], log.attributes["workload.app"]) where resource.attributes["k8s.namespace.name"] == nil and log.attributes["workload.app"] != nil`,
                `delete_key(log.attributes, "workload.app")`,
              ]
            }

            output {
              logs = [otelcol.processor.attributes.otlp_logs.input]
            }
          }

          // job/infra.layer/foundation/namespace and the sender's service.name become
          // Loki labels; everything else goes to structured metadata in loki.process.
          otelcol.processor.attributes "otlp_logs" {
            action {
              key    = "job"
              value  = "otlp"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,infra.layer,foundation,namespace"
              action = "insert"
            }
            action {
              key    = "loki.resource.labels"
              value  = "service.name"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.otlp.input]
            }
          }

          otelcol.exporter.loki "otlp" {
            forward_to = [loki.process.otlp.receiver]
          }

          // Unwrap the exporter's JSON envelope: the stored line is the log body only,
          // and the schema fields plus trace/span IDs (for log-to-trace correlation with
          // Tempo) move to structured metadata. No Go templates here (Helm tpl).
          loki.process "otlp" {
            stage.json {
              expressions = {
                line_out     = "body",
                infra_host   = "attributes.\"infra.host\"",
                workload_id  = "attributes.\"workload.id\"",
                log_source   = "attributes.log_source",
                severity     = "severity",
                trace_id     = "traceid",
                span_id      = "spanid",
                k8s_pod_name = "resources.\"k8s.pod.name\"",
              }
            }

            stage.structured_metadata {
              values = {
                infra_host   = "",
                workload_id  = "",
                log_source   = "",
                severity     = "",
                trace_id     = "",
                span_id      = "",
                k8s_pod_name = "",
              }
            }

            stage.output {
              source = "line_out"
            }

            // otelcol.exporter.loki derives a "level" label from severity; severity is
            // kept as structured metadata, so drop it to keep streams unsplit.
            stage.label_drop {
              values = ["level"]
            }

            forward_to = [loki.write.default.receiver]
          }

          // Receive Talos kernel-log JSON lines over raw TCP (KmsgLogConfig
          // destination, see talos/machineconfig.yaml.j2). Replaces a
          // loki.source.file tailing /dev/kmsg that never worked - /dev/kmsg
          // is a character device, and file-tailers can't read those; zero
          // lines were ever ingested. otelcol.receiver.tcplog has no syslog
          // PRI-header requirement, matching Talos's plain JSON-lines output.
          // add_attributes adds net.peer.ip, which is the only way to tell
          // nodes apart here since the KmsgLogConfig url is identical on
          // all 3 nodes.
          otelcol.receiver.tcplog "kernel" {
            listen_address = "0.0.0.0:6514"
            add_attributes = true
            output {
              logs = [otelcol.processor.transform.kernel.input]
            }
          }

          // Map each node's known static IP to its hostname.
          otelcol.processor.transform "kernel" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                `set(log.attributes["node"], "k8s-0") where log.attributes["net.peer.ip"] == "192.168.30.10"`,
                `set(log.attributes["node"], "k8s-1") where log.attributes["net.peer.ip"] == "192.168.30.11"`,
                `set(log.attributes["node"], "k8s-2") where log.attributes["net.peer.ip"] == "192.168.30.12"`,
                // Canonical schema. infra.host is only set when the IP mapped
                // to a hostname above, so an unmapped IP never leaks as a host.
                `set(log.attributes["foundation"], "homelab-k8s-001")`,
                `set(log.attributes["infra.layer"], "infra")`,
                `set(log.attributes["infra.host"], log.attributes["node"]) where log.attributes["node"] != nil`,
              ]
            }

            output {
              logs = [otelcol.processor.attributes.kernel.input]
            }
          }

          // Tag job="kernel" (matches resources/lokirule.yaml's
          // NodeFilesystemEmergencyReadOnly alert) and promote job/node plus
          // the canonical infra.layer/foundation to real Loki labels
          // (infra.layer becomes the infra_layer label).
          otelcol.processor.attributes "kernel" {
            action {
              key    = "job"
              value  = "kernel"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,node,infra.layer,foundation"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.kernel.input]
            }
          }

          // Bridge OTLP-formatted logs into the existing Loki write pipeline.
          otelcol.exporter.loki "kernel" {
            forward_to = [loki.process.kernel.receiver]
          }

          // The exporter can only promote labels; every other attribute lands
          // inside the JSON log line ({"body":..., "attributes":{...}}). Lift
          // infra.host out into structured metadata so kernel records carry
          // the same schema as pod records. The line itself is left unchanged.
          loki.process "kernel" {
            stage.json {
              expressions = {
                infra_host = "attributes.\"infra.host\"",
              }
            }

            stage.structured_metadata {
              values = {
                infra_host = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // Receive UniFi syslog over UDP (UniFi cannot send TCP). The syslog
          // receiver parses RFC3164 when it can (appname/hostname/message/priority) and
          // forwards anything unparseable as a raw body with only net.* attributes, so
          // no datagram is dropped. add_attributes gives net.peer.ip, the only reliable
          // way to tell devices apart.
          otelcol.receiver.syslog "unifi" {
            protocol = "rfc3164"

            udp {
              listen_address     = "0.0.0.0:5514"
              add_attributes     = true
              one_log_per_packet = true
            }

            output {
              logs = [otelcol.processor.transform.unifi.input]
            }
          }

          // Map each known device's static IP to a canonical hostname and stamp the
          // canonical schema. The filter below then drops everything that did not map,
          // so this list is the allowlist: to add a device, add its IP here. The UDM SE
          // sends from its gateway address on the cluster VLAN (192.168.30.1), not its
          // LAN address.
          otelcol.processor.transform "unifi" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                // RFC3164 timestamps have no year or timezone, and unparsed records
                // carry a zero (1970) timestamp, which Loki would reject as too old.
                // Always stamp receive time instead.
                `set(log.time, log.observed_time)`,
                // Make the body the parsed message text when the datagram parsed (the
                // raw line otherwise), so loki.process can store it as the line without
                // a Go template. The chart runs this whole config through Helm tpl,
                // which would evaluate and mangle any double-brace template written here.
                `set(log.body, log.attributes["message"]) where log.attributes["message"] != nil`,
                `set(log.attributes["infra.host"], "usw-pro-max-24") where log.attributes["net.peer.ip"] == "192.168.86.148"`,
                `set(log.attributes["infra.host"], "usw-ultra-basement") where log.attributes["net.peer.ip"] == "192.168.86.120"`,
                `set(log.attributes["infra.host"], "usw-flex-patio") where log.attributes["net.peer.ip"] == "192.168.86.21"`,
                `set(log.attributes["infra.host"], "usp-pdu-pro") where log.attributes["net.peer.ip"] == "192.168.86.25"`,
                `set(log.attributes["infra.host"], "usp-rps") where log.attributes["net.peer.ip"] == "192.168.86.31"`,
                `set(log.attributes["infra.host"], "ups-tower") where log.attributes["net.peer.ip"] == "192.168.86.115"`,
                `set(log.attributes["infra.host"], "ups-2u") where log.attributes["net.peer.ip"] == "192.168.86.183"`,
                `set(log.attributes["infra.host"], "udm-se") where log.attributes["net.peer.ip"] == "192.168.30.1"`,
                `set(log.attributes["foundation"], "homelab-k8s-001")`,
                `set(log.attributes["infra.layer"], "infra")`,
                `set(log.attributes["infra.component"], "network")`,
              ]
            }

            output {
              logs = [otelcol.processor.filter.unifi.input]
            }
          }

          // Allowlist: drop every record whose source IP is not in the map above (the
          // APs, any other device on the LAN). Dropped counts are visible as the
          // difference between otelcol_processor_incoming_items_total and
          // otelcol_processor_outgoing_items_total for this processor. A mapped
          // device that goes quiet after a change here usually means its source IP moved.
          otelcol.processor.filter "unifi" {
            error_mode = "ignore"

            log_conditions {
              context    = "log"
              conditions = [`attributes["infra.host"] == nil`]
            }

            output {
              logs = [otelcol.processor.attributes.unifi.input]
            }
          }

          // job/infra.layer/foundation become Loki labels; everything else goes to
          // structured metadata in loki.process below.
          otelcol.processor.attributes "unifi" {
            action {
              key    = "job"
              value  = "unifi-syslog"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,infra.layer,foundation"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.unifi.input]
            }
          }

          otelcol.exporter.loki "unifi" {
            forward_to = [loki.process.unifi.receiver]
          }

          // Unwrap the exporter's JSON envelope: the stored line is the message text
          // only (the raw body when the datagram didn't parse, with the per-source
          // prefixes stripped below), and the header fields move to structured metadata.
          loki.process "unifi" {
            stage.json {
              expressions = {
                line_out        = "body",
                source_ip       = "attributes.\"net.peer.ip\"",
                infra_host      = "attributes.\"infra.host\"",
                infra_component = "attributes.\"infra.component\"",
                appname         = "attributes.appname",
                syslog_hostname = "attributes.hostname",
                severity        = "severity",
              }
            }

            // Normalize the stored line per source format. Each stage parses line_out;
            // a named group called line_out replaces it, the other groups become
            // structured metadata, and a stage that does not match changes nothing, so
            // an unexpected format degrades to the raw line instead of losing data.
            // No Go templates here (the chart runs this config through Helm tpl).
            //
            // 1. UDM Activity (CEF) arrives without a syslog PRI, so it stays raw:
            //    "Oct 05 15:06:33 <host> CEF:0|vendor|product|ver|sig|name|sev|ext".
            //    Strip the local-time timestamp/host prefix and lift the CEF header.
            stage.regex {
              source     = "line_out"
              expression = "(?s)^[A-Za-z]{3} +[0-9]+ [0-9:]{8} (?P<syslog_hostname>\\S+) (?P<line_out>CEF:0\\|[^|]*\\|[^|]*\\|[^|]*\\|(?P<cef_signature>[^|]*)\\|(?P<cef_name>[^|]*)\\|(?P<cef_severity>[^|]*)\\|.*)$"
            }

            // 2. The CEF extension's UniFi category (Audit, ...).
            stage.regex {
              source     = "line_out"
              expression = "UNIFIcategory=(?P<unifi_category>[A-Za-z]+)"
            }

            // 3. The Ultra and UPS units send "<PRI>host mac,model-fw: msg" with no
            //    timestamp, so the syslog parser rejects them. Recover host and device
            //    tag (the model may contain a space, e.g. "UPS 2U-1.6.4.432").
            stage.regex {
              source     = "line_out"
              expression = "(?s)^<[0-9]+>(?P<syslog_hostname>\\S+) (?P<appname>[0-9a-f]{12},[^:]+): (?P<line_out>.*)$"
            }

            // 4. Everything else carries "process[pid]: message" buried in the message,
            //    optionally behind a leading ": " (switches, power gear) or a repeated
            //    hostname (UDM). Runs last so it also handles the output of step 3.
            stage.regex {
              source     = "line_out"
              expression = "(?s)^(?:: ?|[A-Za-z0-9._-]+ )?(?P<process>[A-Za-z0-9_./-]+)(?:\\[[0-9]+\\])?: (?P<line_out>.*)$"
            }

            // source_ip is the datagram's network source. The line no longer carries
            // the exporter's JSON envelope (where net.peer.ip used to live), and
            // unmapped devices have no infra_host, so without this their source IP
            // would be unrecoverable. Needed to confirm and extend the IP-to-hostname map.
            stage.structured_metadata {
              values = {
                source_ip       = "",
                infra_host      = "",
                infra_component = "",
                appname         = "",
                syslog_hostname = "",
                severity        = "",
                process         = "",
                cef_name        = "",
                cef_severity    = "",
                cef_signature   = "",
                unifi_category  = "",
              }
            }

            stage.output {
              source = "line_out"
            }

            // otelcol.exporter.loki derives a "level" label from the syslog severity;
            // severity is already kept as structured metadata, and the schema promotes
            // only infra_layer/foundation, so drop it to keep streams unsplit.
            stage.label_drop {
              values = ["level"]
            }

            forward_to = [loki.write.default.receiver]
          }

          // Receive Talos service logs (apid, machined, kubelet, etcd, cri, ...) as
          // JSON lines over raw TCP: a machine.logging destination in
          // talos/machineconfig.yaml.j2 would point here via the alloy-talos-logs
          // LoadBalancer. Nothing sends to this port until that destination exists.
          // Same shape as the kernel pipeline: machined runs on the bare host, so the
          // sender needs a real LoadBalancer IP, and net.peer.ip is the only way to
          // tell the nodes apart. No extraPorts entry on purpose (a containerPort
          // would roll every Alloy pod); the Service targets the numeric port.
          otelcol.receiver.tcplog "talos" {
            listen_address = "0.0.0.0:6515"
            add_attributes = true
            output {
              logs = [otelcol.processor.transform.talos.input]
            }
          }

          // Unwrap Talos's JSON record (msg, talos-level, talos-service, talos-time),
          // map the node by source IP, and stamp the canonical schema. Receive time is
          // used as the event time. The IP map is the allowlist, as for UniFi: the
          // filter below drops anything that did not map.
          otelcol.processor.transform "talos" {
            error_mode = "ignore"

            log_statements {
              context = "log"
              statements = [
                `merge_maps(log.cache, ParseJSON(log.body), "upsert") where IsMatch(log.body, "^[{]")`,
                `set(log.attributes["process"], log.cache["talos-service"]) where log.cache["talos-service"] != nil`,
                `set(log.attributes["severity"], log.cache["talos-level"]) where log.cache["talos-level"] != nil`,
                `set(log.body, log.cache["msg"]) where log.cache["msg"] != nil`,
                // Event time is Talos's own timestamp, not receive time: Talos replays
                // its whole buffered history (about two days, ~8k lines per node) when a
                // sender connects, and receive time would stamp all of it as "now".
                // With the original time an identical replayed line is a duplicate
                // Loki drops. A record without a parseable talos-time keeps receive time.
                `set(log.time, log.observed_time)`,
                `set(log.time, Time(log.cache["talos-time"], "%Y-%m-%dT%H:%M:%S.%f%z")) where log.cache["talos-time"] != nil`,
                `set(log.attributes["infra.host"], "k8s-0") where log.attributes["net.peer.ip"] == "192.168.30.10"`,
                `set(log.attributes["infra.host"], "k8s-1") where log.attributes["net.peer.ip"] == "192.168.30.11"`,
                `set(log.attributes["infra.host"], "k8s-2") where log.attributes["net.peer.ip"] == "192.168.30.12"`,
                `set(log.attributes["node"], log.attributes["infra.host"]) where log.attributes["infra.host"] != nil`,
                `set(log.attributes["foundation"], "homelab-k8s-001")`,
                `set(log.attributes["infra.layer"], "infra")`,
                `set(log.attributes["infra.component"], "talos")`,
              ]
            }

            output {
              logs = [otelcol.processor.filter.talos.input]
            }
          }

          // Drop (1) records from an unmapped source IP, (2) kernel messages (duplicates
          // of the kernel pipeline) and (3) the successful
          // read-only RPC access lines that apid and machined log for every call. The
          // node consoles' dashboards poll these nine RPCs about 11 times a second per
          // node (~33 lines/s cluster-wide) and the lines carry no information. Fails
          // safe: errors, any RPC not listed, and every mutating RPC (ApplyConfiguration,
          // Upgrade, Reboot, Reset, ServiceRestart, ...) are kept as an audit trail.
          // The pattern is unanchored because the exact msg prefix is Talos's own.
          // Dropped counts: otelcol_processor_incoming_items_total minus
          // otelcol_processor_outgoing_items_total for this processor.
          otelcol.processor.filter "talos" {
            error_mode = "ignore"

            log_conditions {
              context = "log"
              conditions = [
                `attributes["infra.host"] == nil`,
                // Already shipped, with more context, by the kernel pipeline (job="kernel").
                `attributes["process"] == "kernel"`,
                // Too old for Loki to accept (its out-of-order window is about an hour
                // behind the newest line in a stream, and a rejected line only produces
                // push errors): the buffered history a sender replays on connect. Keep
                // well inside that window; recent lines still arrive with their own time.
                `Now() - time > Duration("30m")`,
                `IsMatch(body, "OK [[]/machine[.]MachineService/(CPUFreqStats|CPUInfo|DiskStats|LoadAvg|Memory|NetworkDeviceStats|Processes|ServiceList|SystemStat)[]]")`,
              ]
            }

            output {
              logs = [otelcol.processor.attributes.talos.input]
            }
          }

          // job/infra.layer/foundation/node become Loki labels; the rest goes to
          // structured metadata in loki.process below.
          otelcol.processor.attributes "talos" {
            action {
              key    = "job"
              value  = "talos"
              action = "insert"
            }
            action {
              key    = "loki.attribute.labels"
              value  = "job,node,infra.layer,foundation"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.talos.input]
            }
          }

          otelcol.exporter.loki "talos" {
            forward_to = [loki.process.talos.receiver]
          }

          // Unwrap the exporter's JSON envelope: the stored line is the Talos message
          // only, and the header fields move to structured metadata.
          loki.process "talos" {
            stage.json {
              expressions = {
                line_out        = "body",
                source_ip       = "attributes.\"net.peer.ip\"",
                infra_host      = "attributes.\"infra.host\"",
                infra_component = "attributes.\"infra.component\"",
                process         = "attributes.process",
                severity        = "attributes.severity",
              }
            }

            stage.structured_metadata {
              values = {
                source_ip       = "",
                infra_host      = "",
                infra_component = "",
                process         = "",
                severity        = "",
              }
            }

            stage.output {
              source = "line_out"
            }

            // Same as the UniFi pipeline: keep streams unsplit.
            stage.label_drop {
              values = ["level"]
            }

            forward_to = [loki.write.default.receiver]
          }

    controller:
      type: daemonset

    serviceMonitor:
      enabled: true
