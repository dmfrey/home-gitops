---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack

spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: observability

  interval: 1h

  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml

  values:
    cleanPrometheusOperatorObjectNames: true

    defaultRules:
      disabled:
        KubeHpaMaxedOut: true

    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.dmfrey.com
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Observability
            gethomepage.dev/name: Alert Manager
            gethomepage.dev/icon: alertmanager.png
            gethomepage.dev/description: Application & System Alerts
            gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
          parentRefs:
            - name: envoy-internal
              namespace: network

      alertmanagerSpec:
        priorityClassName: high
        alertmanagerConfiguration:
          name: alertmanager

        externalUrl: https://alertmanager.dmfrey.com

        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi

    kubeApiServer:
      serviceMonitor:
        # Setting metricRelabelings replaces the chart's default list, so the first
        # rule is the chart default (coarser request-duration buckets) copied verbatim.
        # The second drops per-resource histogram families that nothing uses (checked
        # 2026-10-16 against every PrometheusRule, ConfigMap and URL-sourced dashboard
        # in the cluster, and the repo). With this cluster's many CRDs they were about
        # 113k live series, a quarter of the Prometheus head, across the 3 apiservers.
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__, le]
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          - action: drop
            sourceLabels: [__name__]
            regex: apiserver_(watch_events_dispatch_duration_seconds|watch_list_duration_seconds|request_body_size_bytes|storage_list_duration_seconds|watch_cache_read_wait_seconds|watch_cache_initialization_duration_seconds|response_sizes|watch_events_sizes)_bucket

    kubeEtcd:
      service:
        selector:
          k8s-app: kube-apiserver # etcd runs on control plane nodes

    kubeProxy:
      enabled: false

    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.dmfrey.com
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Observability
            gethomepage.dev/name: Prometheus
            gethomepage.dev/icon: prometheus.png
            gethomepage.dev/description: Application & System Metrics
            gethomepage.dev/widget.type: prometheus
            gethomepage.dev/widget.url: http://prometheus-operated.observability.svc.cluster.local:9090
            gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
          parentRefs:
            - name: envoy-internal
              namespace: network

      prometheusSpec:
        priorityClassName: high
        enableRemoteWriteReceiver: true

        externalUrl: https://prometheus.dmfrey.com

        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false

        retention: 14d
        # Below the 50Gi PVC: retention only prunes when it hits this size, and a full
        # disk corrupts the TSDB. Was 50GB, the same as the disk.
        retentionSize: 42GB

        resources:
          requests:
            cpu: 100m
            memory: 1500Mi
          limits:
            memory: 6000Mi # bumped from 4000Mi 2026-10-16 to get out of an OOM crash loop (about 620k head series, 91k of them envoy db_client_* buckets, now dropped in envoy's ServiceMonitors); lower again once the head has shrunk. Earlier, from 2000Mi 2026-08-21: prometheus was sitting at ~91% of the old limit and failing its own /-/ready and /-/healthy probes (context deadline exceeded), which cascaded into prometheus-adapter's external-metrics API failing cluster-wide and every nfs-scaler HPA getting stuck at 0 replicas (~29 apps). Investigate root cause of the memory growth (cardinality?) separately; this buys headroom in the meantime.

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi

    prometheus-node-exporter:
      fullnameOverride: node-exporter

      # prometheus:
      #   monitor:
      #     enabled: true
      #     relabelings:
      #       - action: replace
      #         regex: (.*)
      #         replacement: $1
      #         sourceLabels:
      #           - __meta_kubernetes_pod_node_name
      #         targetLabel: kubernetes_node

    kube-state-metrics:
      fullnameOverride: kube-state-metrics

      # Added 2026-10-17: was BestEffort. 7d peak working set 178Mi, p95 CPU 11m.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi

      # metricLabelsAllowlist:
      #   - pods=[*]
      #   - deployments=[*]
      #   - persistentvolumeclaims=[*]

      # prometheus:
      #   monitor:
      #     enabled: true
      #     relabelings:
      #       - action: replace
      #         regex: (.*)
      #         replacement: $1
      #         sourceLabels:
      #           - __meta_kubernetes_pod_node_name
      #         targetLabel: kubernetes_node

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana

    additionalPrometheusRulesMap:
      kubernetes-apps-overrides:
        groups:
          - name: kubernetes-apps
            rules:
              - alert: KubeHpaMaxedOut
                annotations:
                  description: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been running at max replicas for longer than 15 minutes on cluster {{ $labels.cluster }}.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubehpamaxedout
                  summary: HPA is running at max replicas
                expr: |-
                  (
                    kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics", namespace=~".*"}
                      ==
                    kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
                  )
                  and on (namespace, horizontalpodautoscaler) (
                    kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
                      !=
                    kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics", namespace=~".*"}
                  )
                  and on (namespace, horizontalpodautoscaler) (
                    kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics", namespace=~".*"}
                      > 1
                  )
                for: 15m
                labels:
                  severity: warning
      prometheus-capacity:
        groups:
          - name: prometheus-capacity
            rules:
              # 2026-10-16: Prometheus crash-looped on OOM at about 620k head series and
              # only the OomKilled alert said so, after the fact. After the envoy and
              # apiserver histogram drops the live head should sit near 380k, so 500k
              # means something new is adding series, with room left before the 6000Mi
              # limit bites.
              - alert: PrometheusHeadSeriesHigh
                expr: |
                  max(prometheus_tsdb_head_series{job="kube-prometheus-stack-prometheus"}) > 500000
                for: 1h
                annotations:
                  summary: >-
                    Prometheus holds {{ $value | humanize }} head series (expected about 380k); find the new cardinality with topk(10, count by (__name__) ({__name__=~".+"})) before it OOMs
                labels:
                  severity: warning
              # GOMEMLIMIT is 90% of the limit, so a healthy Prometheus sits near 0.9;
              # working set also counts page cache from the mmapped blocks, hence the
              # high threshold and long window.
              - alert: PrometheusMemoryNearLimit
                expr: |
                  max(
                    container_memory_working_set_bytes{namespace="observability", pod="prometheus-kube-prometheus-stack-0", container="prometheus"}
                    / on (namespace, pod, container)
                    kube_pod_container_resource_limits{namespace="observability", pod="prometheus-kube-prometheus-stack-0", container="prometheus", resource="memory"}
                  ) > 0.97
                for: 30m
                annotations:
                  summary: >-
                    Prometheus has been above 97% of its memory limit for 30 minutes
                labels:
                  severity: warning
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical

    #   zfs-rules:
    #     groups:
    #       - name: zfs
    #         rules:
    #           - alert: ZfsUnexpectedPoolState
    #             annotations:
    #               summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
    #             expr: node_zfs_zpool_state{state!="online"} > 0
    #             labels:
    #               severity: critical
