---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: lan-icmp

spec:
  module: icmp

  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115

  targets:
    staticConfig:
      static:
        - k8s-0.internal
        - k8s-1.internal
        - k8s-2.internal
        # TEMP 2026-10-01: QNAP physically shut down/unplugged, nas.internal
        # answers nothing right now. UNAS is pending its 10Gb port move
        # (SFP+ adapter arrives tomorrow), after which nas.internal gets
        # reused for it and this reverts back. Until then, point at UNAS's
        # current name directly so the probe (and anything alerting off it)
        # stops false-firing.
        - unas.internal

  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-nfs
spec:
  jobName: nfs_probe

  module: tcp_connect

  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115

  targets:
    staticConfig:
      static:
        # TEMP 2026-10-01: see lan-icmp above - revert to nas.internal:2049
        # once UNAS is on its permanent 10Gb port and the DNS name moves over.
        - unas.internal:2049

  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
