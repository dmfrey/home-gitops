---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# 1Password item "rt":
#   RT_ROOT_PASSWORD                   RT's `root` user (UI admin).
#   RT_ENVOY_MCP_USER / RT_ENVOY_MCP_PASS   the dedicated RT user the MCP server
#                                      logs in as (rights on the Envoy queue).
# The password field is currently labelled RT_ENVOY_MCP-PASS (hyphen) in
# 1Password; accept either spelling so a later rename does not break the sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name rt-secret
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        RT_ROOT_PASSWORD: "{{ .RT_ROOT_PASSWORD }}"
        RT_ENVOY_MCP_USER: "{{ .RT_ENVOY_MCP_USER }}"
        RT_ENVOY_MCP_PASS: '{{ or (index . "RT_ENVOY_MCP_PASS") (index . "RT_ENVOY_MCP-PASS") }}'
  dataFrom:
    - extract:
        key: rt
