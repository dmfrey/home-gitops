---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# One credential for both RT's `root` user and the MCP server's login to RT
# (kept simple for development). 1Password item "rt", field RT_ROOT_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name rt-secret
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        RT_ROOT_PASSWORD: "{{ .RT_ROOT_PASSWORD }}"
  dataFrom:
    - extract:
        key: rt
