---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
# RT's $SecretKey signs password-reset tokens and encrypts TOTP secrets; RT
# warns at startup when it is empty. Generated once in the cluster (no
# 1Password item): refreshPolicy CreatedOnce below keeps the first value
# forever. If rt-secretkey is ever lost, RT just gets a new key: the only
# things it invalidates are outstanding reset tokens and enrolled TOTP
# secrets (none enrolled at the time of writing).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: rt-secretkey
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rt-secretkey
spec:
  refreshPolicy: CreatedOnce
  target:
    name: rt-secretkey
    # Orphan: pruning the ExternalSecret must not delete the generated key.
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        20-secretkey.pm: |
          Set($SecretKey, "{{ .password }}");
          1;
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: rt-secretkey
