---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stigs-allow-emasser-actuator
spec:
  # Targets only the stigs backend's pods, not frontend - confirmed via
  # `kubectl get pods -n spring-notes --show-labels` that app-template's
  # multi-controller releases label every controller's pods with the same
  # app.kubernetes.io/name (the release name), distinguished only by
  # app.kubernetes.io/controller. Same namespace, so no namespaceSelector
  # needed (unlike components/dragonflydb's cross-namespace example this
  # was modeled on).
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stigs
      app.kubernetes.io/controller: backend
  ingress:
    # Selecting this pod for Ingress makes Kubernetes deny all ingress not
    # explicitly allowed below - this rule restores normal app traffic
    # (Envoy -> backend:8080) that the 8081-only rule below silently broke.
    # No `from` = allow from any source, same as an unrestricted pod.
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: emasser
        # Also allows the configuration-watcher (kubernetes/apps/stigs/
        # watcher/) to reach the actuator to POST /actuator/refresh -
        # lives in this same file/policy rather than a separate one since
        # both are "who else may reach port 8081" rules for the same
        # target pod. Without this, the watcher's refresh calls would be
        # silently dropped even with its RBAC/ConfigMap wiring correct.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: watcher
      ports:
        - port: 8081
          protocol: TCP
  policyTypes:
    - Ingress
