---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emasser
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: emasser-secret
    template:
      engineVersion: v2
      data:
        # eMASSer needs these three files present in the directory it's
        # pointed at (mounted below at /data) - see MITRE's docs on
        # "Editing Environment Variables Configuration" for the exact
        # keys .env needs (EMASSER_API_KEY, EMASSER_KEY_FILE_PATH, etc.).
        .env: "{{ .EMASSER_ENV }}"
        key.pem: "{{ .EMASSER_KEY_PEM }}"
        client.pem: "{{ .EMASSER_CLIENT_PEM }}"
  dataFrom:
    - extract:
        key: emasser
