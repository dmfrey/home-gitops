---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name stigs-secret
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Same 1Password item used for the Authentik OAuth2 provider - stigs
        # does server-side OAuth2 login (BFF pattern), not frontend PKCE like
        # spring-notes, so unlike spring-notes it needs the client secret too.
        STIG_OAUTH2_CLIENT_ID: "{{ .AUTHENTIK_CLIENT_ID }}"
        STIG_OAUTH2_CLIENT_SECRET: "{{ .AUTHENTIK_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: stigs
