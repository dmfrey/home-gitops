---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stigs
spec:
  chartRef:
    kind: OCIRepository
    name: stigs
  interval: 1h
  values:
    defaultPodOptions:
      priorityClassName: low

    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: stigs-cnpg-app,stigs-secret
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/stig-server
              # No semver releases yet, only `latest` + sha-<short-sha> tags
              # (brand new app) - move to a pinned tag/digest once the repo
              # cuts real releases and the GHCR package is public (Renovate
              # can't track a private package without read:packages access).
              tag: latest
            env:
              TZ: America/New_York
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              MANAGEMENT_METRICS_TAGS_APPLICATION: stigs
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              STIG_OAUTH2_ISSUER_URI: https://auth.dmfrey.com/application/o/stigs/
              STIG_OAUTH2_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: stigs-secret
                    key: STIG_OAUTH2_CLIENT_ID
              STIG_OAUTH2_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: stigs-secret
                    key: STIG_OAUTH2_CLIENT_SECRET
              STIG_FRONTEND_BASE_URL: https://stigs.dmfrey.com
              # CNPG auto-creates stigs-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: password
            probes:
              # Confirmed empirically (per the app's own deployment notes):
              # /actuator/health returns 404 on 8080, 200 on 8081 - actuator
              # is fully moved off the main port, not duplicated onto it.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/stig-web
              # Same tagging caveat as the backend - see comment above.
              tag: latest
            probes:
              liveness: &probes
                enabled: true
                custom: false
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
        # Deliberately no 8081 here - actuator stays reachable only within
        # the pod network (probes) and to the emasser job via NetworkPolicy
        # (kubernetes/apps/stigs/emasser/app/networkpolicy.yaml), never
        # through a Service/Route.
      frontend:
        controller: frontend
        ports:
          http:
            port: 80

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Stigs
          gethomepage.dev/icon: spring.png
          gethomepage.dev/description: STIG compliance tracking
        hostnames:
          - stigs.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          # OAuth2 login flow + API + app-specific paths -> backend (8080).
          - matches:
              - path:
                  type: PathPrefix
                  value: /oauth2
              - path:
                  type: PathPrefix
                  value: /login
              - path:
                  type: PathPrefix
                  value: /logout
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /stig
            backendRefs:
              - identifier: backend
                port: 8080
          # /* -> React frontend (nginx, port 80)
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: frontend
                port: 80
