---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stigs
spec:
  chartRef:
    kind: OCIRepository
    name: stigs
  interval: 1h
  values:
    defaultPodOptions:
      priorityClassName: low

    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: stigs-cnpg-app,stigs-secret
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/stig-server
              # No semver releases yet, only `latest` + sha-<short-sha> tags
              # (brand new app). Pinned to sha-fd95f5d specifically -
              # confirmed working (this is the MANAGEMENT_SERVER_PORT fix
              # build). DO NOT advance to latest's current digest
              # (068941121c73...) without a fix first: that build crash-loops
              # on startup with NamespaceResolutionFailedException /
              # "unresolved namespace" from Spring Cloud Kubernetes' service
              # discovery auto-configuration (new in that build - confirmed
              # live 2026-09-24, reverted after ~1min of downtime). Needs
              # either an app-side fix or SPRING_CLOUD_KUBERNETES_CLIENT_NAMESPACE
              # wired to the downward API before retrying.
              tag: sha-fd95f5d@sha256:74907b8ec3526b800d6814cf7fffe9a681bfc881f7805c5ca76a94e10af2b1c2
            env:
              TZ: America/New_York
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              MANAGEMENT_METRICS_TAGS_APPLICATION: stigs
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              STIG_OAUTH2_ISSUER_URI: https://auth.dmfrey.com/application/o/stigs/
              STIG_OAUTH2_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: stigs-secret
                    key: STIG_OAUTH2_CLIENT_ID
              STIG_OAUTH2_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: stigs-secret
                    key: STIG_OAUTH2_CLIENT_SECRET
              STIG_FRONTEND_BASE_URL: https://stigs.dmfrey.com
              # CNPG auto-creates stigs-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: stigs-cnpg-app
                    key: password
              # Real Platform/Infrastructure-layer attestation content for this
              # specific deployment, overriding the bundled unreviewed classpath
              # templates - see attestations/application-override.yaml and the
              # persistence entries below.
              SPRING_CONFIG_IMPORT: "optional:file:/config/overrides/application-override.yaml"
              # Required as of app commit fd95f5d: management.server.port:8081
              # used to be hardcoded in the app's shared application.yaml, but
              # was removed from there since it shouldn't be on-by-default on
              # every platform (e.g. Cloud Foundry has no equivalent trust
              # boundary). It's now opt-in per this env var, picked up via
              # Spring's relaxed binding - lib:stig-management (Kubernetes
              # image only) needs it explicitly set or the actuator split
              # below never activates.
              MANAGEMENT_SERVER_PORT: "8081"
            probes:
              # /actuator/health returns 404 on 8080, 200 on 8081 - actuator
              # is fully moved off the main port, not duplicated onto it.
              # MANAGEMENT_SERVER_PORT above is what actually activates this
              # split; without it these probes get connection-refused and
              # the pod crash-loops on failed health checks.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/stig-web
              # Same tagging caveat as the backend - see comment above.
              tag: latest
            probes:
              liveness: &probes
                enabled: true
                custom: false
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    persistence:
      # Real, hand-reviewed Platform/Infrastructure attestation + risk-acceptance
      # files for this deployment (kubernetes/apps/stigs/stigs/app/attestations/),
      # generated via tools:stig-attestation-builder and mounted as directories -
      # backend-only, the frontend nginx container has no use for these.
      stigs-attestations:
        type: configMap
        name: stigs-attestations
        advancedMounts:
          backend:
            app:
              - path: /config/attestations
      stigs-config-override:
        type: configMap
        name: stigs-config-override
        advancedMounts:
          backend:
            app:
              - path: /config/overrides

    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
        # Deliberately no 8081 here - actuator stays reachable only within
        # the pod network (probes) and to the emasser job via NetworkPolicy
        # (kubernetes/apps/stigs/emasser/app/networkpolicy.yaml), never
        # through a Service/Route.
      frontend:
        controller: frontend
        ports:
          http:
            port: 80

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Stigs
          gethomepage.dev/icon: spring.png
          gethomepage.dev/description: STIG compliance tracking
        hostnames:
          - stigs.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          # OAuth2 login flow + API + app-specific paths -> backend (8080).
          - matches:
              - path:
                  type: PathPrefix
                  value: /oauth2
              - path:
                  type: PathPrefix
                  value: /login
              - path:
                  type: PathPrefix
                  value: /logout
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /stig
            backendRefs:
              - identifier: backend
                port: 8080
          # /* -> React frontend (nginx, port 80)
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: frontend
                port: 80
