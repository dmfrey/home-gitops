---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spring-notes-cnpg
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  enablePDB: false
  # tensorchord's CNPG-compatible Postgres image with pgvector pre-installed
  # (also bundles VectorChord's own vchord extension, unused here - only
  # standard pgvector is needed for Spring AI's PgVectorStore). Confirmed
  # this tag bundles PostgreSQL 17.10, an exact match for the vanilla
  # cloudnative-pg/postgresql:17.10 image it replaces, so this is an
  # in-place operand swap with no data/binary compatibility concerns -
  # same pattern already proven in self-hosted/immich/immich-db.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18-1.1.1@sha256:9c9246cb8ba0332f7e1115def71329410657237db8ef104160a479a89c7e03a2

  managed:
    services:
      disabledDefaultServices:
        - ro

  backup:
    volumeSnapshot:
      className: csi-ceph-blockpool

  bootstrap:
    # initdb:
    #   dataChecksums: true
    #   database: spring-notes
    #   owner: spring-notes
    #   encoding: "UTF8"
    #   localeCollate: en_US.utf8
    #   localeCType: en_US.utf8
    recovery:
      database: spring-notes
      owner: spring-notes
      source: source

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: spring-notes
          serverName: spring-notes-cnpg

  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: spring-notes

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 128MB

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: restart

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  storage:
    storageClass: ceph-block
    size: 5Gi

  walStorage:
    storageClass: ceph-block
    size: 5Gi
