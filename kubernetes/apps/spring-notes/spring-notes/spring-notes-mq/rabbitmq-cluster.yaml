---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rabbitmq.com/rabbitmqcluster_v1beta1.json
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: spring-notes-rabbitmq
spec:
  replicas: 1
  # renovate: datasource=docker depName=rabbitmq versioning=loose
  image: rabbitmq:4.4-management@sha256:c200fd496482cda18c412be4e6f244830e1e75949b8cf5f0e887cea9ea456109
  rabbitmq:
    additionalConfig: |
      # The operator default (2GB) is about the size of this PVC, which would
      # raise a free-disk alarm that blocks every publisher. A small absolute
      # floor is enough.
      disk_free_limit.absolute = 500MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: ceph-block
    storage: 2Gi
