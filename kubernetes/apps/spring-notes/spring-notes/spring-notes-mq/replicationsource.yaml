---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: spring-notes-rabbitmq
spec:
  # RabbitmqCluster's StatefulSet manages its own PVC via volumeClaimTemplates
  # (persistence-spring-notes-rabbitmq-server-0), so this doesn't fit
  # components/volsync's existingClaim-named-after-the-release assumption -
  # standalone ReplicationSource pointed at the actual PVC name instead, same
  # pattern as garage-system/garage.
  sourcePVC: persistence-spring-notes-rabbitmq-server-0
  trigger:
    schedule: "0 * * * *"
  kopia:
    accessModes:
      - ReadWriteOnce
    compression: zstd-fastest
    copyMethod: Snapshot
    moverAffinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/created-by: volsync
              topologyKey: kubernetes.io/hostname
    moverResources:
      requests:
        cpu: 100m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 8Gi
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    parallelism: 2
    repository: spring-notes-rabbitmq-volsync-secret
    retain:
      hourly: 24
      daily: 7
    storageClassName: ceph-block-ext4
    volumeSnapshotClassName: csi-ceph-blockpool
