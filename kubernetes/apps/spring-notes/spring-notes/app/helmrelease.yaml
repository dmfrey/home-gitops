---
# yaml-language-server: $schema=https://kubernetes-schemas.dmfrey.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spring-notes
spec:
  chartRef:
    kind: OCIRepository
    name: spring-notes
  interval: 1h
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: spring-notes-cnpg-app,spring-notes-secret,spring-notes-rabbitmq-default-user
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/spring-notes
              # renovate: datasource=docker depName=ghcr.io/dmfrey/spring-notes versioning=semver
              tag: v3.5.0@sha256:4072587ce84cb48e7c4ef972d6cffd95dbe3bb5f31f7831e367674ee2e1ed906
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: homelab
              # The JVM (Micrometer) dashboard (grafana.com/4701) filters on
              # `application` and `instance` labels. Micrometer common tags add
              # `application`; Alloy maps service.instance.id -> `instance`.
              # Name must sort before OTEL_RESOURCE_ATTRIBUTES: the chart renders
              # env alphabetically and $(VAR) only expands if VAR is defined earlier.
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              MANAGEMENT_METRICS_TAGS_APPLICATION: spring-notes
              # Micrometer OTLP defaults to milliseconds; the JVM dashboard and
              # Prometheus conventions expect *_seconds_* metric names.
              MANAGEMENT_OTLP_METRICS_EXPORT_BASETIMEUNIT: seconds
              # Micrometer only exports a +Inf bucket by default, which makes
              # histogram_quantile() return NaN. JSON avoids relaxed-binding
              # ambiguity for the dotted meter-name map keys.
              SPRING_APPLICATION_JSON: >-
                {"management.metrics.distribution.percentiles-histogram":
                 {"http.server.requests": true, "hikaricp.connections": true,
                  "jdbc": true, "spring.security": true,
                  "notes.load": true, "notes.create": true, "notes.delete": true}}
              # CNPG auto-creates spring-notes-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-cnpg-app
                    key: password
              # RabbitMQ Cluster Operator auto-creates spring-notes-rabbitmq-default-user
              # with host/port/username/password, same shape as CNPG's app secret.
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-rabbitmq-default-user
                    key: password
              # Spring AI chat-over-notes. No app-side defaults exist for
              # BASE_URL - unset means the app tries localhost:11434, which
              # doesn't resolve in-cluster. CHAT_MODEL is freely changeable
              # later, but EMBEDDING_MODEL is NOT: its dimension (768, for
              # nomic-embed-text) is baked into the vector_store.embedding
              # column - changing it needs a new migration + full reindex of
              # every note, so it's pinned explicitly here rather than
              # relying on the app's own default ever staying the same.
              SPRING_AI_OLLAMA_BASE_URL: http://ollama.ai.svc.cluster.local:11434
              SPRING_AI_OLLAMA_CHAT_MODEL: qwen2.5:7b-instruct
              SPRING_AI_OLLAMA_EMBEDDING_MODEL: nomic-embed-text
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.dmfrey.com/application/o/spring-notes/
              SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:
                valueFrom:
                  secretKeyRef:
                    name: spring-notes-secret
                    key: AUTHENTIK_CLIENT_ID
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/spring-notes-frontend
              # renovate: datasource=docker depName=ghcr.io/dmfrey/spring-notes-frontend versioning=loose
              # Manually bumped 2026-08-11 - Renovate doesn't reliably propose
              # updates for this git-SHA-tagged image (versioning=loose on a
              # raw commit SHA, not semver), a known gap from earlier this
              # session. This SHA is main's tip as of the v3.5.0 release-please
              # merge, which includes the chat feature's ChatPanel.jsx (added
              # in spring-notes PR #73) - the old pinned SHA predates it, so
              # the backend's new /chat API had no UI to call it.
              tag: f4fa85948a601b9813ebb4dbb046ac54baa7738e@sha256:6ddb235930fcbafb7dd2d5b48dd83bd1ba972112335d003fd26e13ec55a24543
            probes:
              liveness: &probes
                enabled: true
                custom: false
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    configMaps:
      frontend-config:
        data:
          config.json: |
            {
              "OIDC_ISSUER": "https://auth.dmfrey.com/application/o/spring-notes/",
              "OIDC_CLIENT_ID": "spring-notes",
              "OIDC_SCOPE": "openid profile email",
              "API_BASE_URL": "/api"
            }

    persistence:
      frontend-config:
        type: configMap
        name: spring-notes
        advancedMounts:
          frontend:
            app:
              - path: /usr/share/nginx/html/config.json
                subPath: config.json
                readOnly: true

    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
      frontend:
        controller: frontend
        ports:
          http:
            port: 80

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: Spring Notes
          gethomepage.dev/icon: spring.png
          gethomepage.dev/description: Spring Boot + React Demo
        hostnames:
          - spring-notes.dmfrey.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          # /api/* → strip /api prefix → Spring Boot backend (port 8080)
          # Backend endpoints are at /notes, not /api/notes — no context path configured.
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - identifier: backend
                port: 8080
          # /* → React frontend (nginx, port 80)
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: frontend
                port: 80
