---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  # kopiur phase 2 (project_kopiur_pilot) - backs up the SAME PVC VolSync
  # already backs up to nas.internal:/Kopia, additively. VolSync stays the
  # real backup path. Picked specifically because mosquitto's pod runs as
  # root (uid=0/gid=0, confirmed live via `kubectl exec ... id`) - every
  # other kopiur app so far (wizarr, plex, linkwarden, dependency-track)
  # runs as uid/gid 1000, so this is a deliberately different ownership
  # shape to prove the mover can read a root-owned PVC.
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 1Gi
      mode: Persistent
      storageClassName: ceph-block
    securityContext:
      runAsUser: 0
      runAsGroup: 0
  repository:
    kind: ClusterRepository
    name: garage
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  verification:
    quick:
      schedule:
        cron: "H H * * *"
    deep:
      schedule:
        cron: "H H * * 0"
    verifyFilesPercent: 100
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: csi-ceph-blockpool
