---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: mosquitto
  interval: 1h
  values:
    controllers:
      mosquitto:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          user-import:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
            command:
              - "/bin/sh"
              - -c
            args:
              - ls -lart /data/mosquitto_init && ls -lart /data/mosquitto_secret && ls -larth /data/external_config && /data/mosquitto_init/load-users.sh /data/mosquitto_secret /data/external_config/mosquitto_pwd && chmod 0700 /data/external_config/mosquitto_pwd && mosquitto_passwd -U /data/external_config/mosquitto_pwd && echo "User import Completed"
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 350Mi
    defaultPodOptions:
      priorityClassName: high
      terminationGracePeriodSeconds: 15
      securityContext:
        # runAsUser/Group/fsGroup pinned to 1883 (not this repo's usual 1000) -
        # matches the eclipse-mosquitto image's own built-in "mosquitto" user.
        # /mosquitto/data|config|log are baked into the image's own filesystem
        # layer (not on the mounted PVC, which only backs /data for secrets/
        # init-config staging) and owned 1883:1883 at build time, so fsGroup
        # never gets a chance to fix them up - running as 1000 caused every
        # DB-save to fail with "Permission denied" once the pod actually
        # restarted and re-exercised those paths. Confirmed live 2026-09-09.
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mqtt.dmfrey.com
          lbipam.cilium.io/ips: 192.168.29.247
        ports:
          http:
            port: 1883
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      mosquitto-config:
        enabled: true
        type: configMap
        name: mosquitto-config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
        defaultMode: 0664
      mosquitto-secret:
        enabled: true
        type: secret
        name: mosquitto-secret
        globalMounts:
          - path: /data/mosquitto_secret
        defaultMode: 0664
      mosquitto-init-config:
        enabled: true
        type: configMap
        name: mosquitto-init-config
        globalMounts:
          - path: /data/mosquitto_init/load-users.sh
            subPath: load-users.sh
        defaultMode: 0775
      external-config:
        enabled: true
        type: emptyDir
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/external_config
            user-import:
              - path: /data/external_config
