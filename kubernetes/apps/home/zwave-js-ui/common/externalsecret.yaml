---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name zwave-js-ui-secret
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        DEFAULT_USERNAME: "{{ .ZWAVE_JS_UI_DEFAULT_USERNAME }}"
        DEFAULT_PASSWORD: "{{ .ZWAVE_JS_UI_DEFAULT_PASSWORD }}"
        SESSION_SECRET: "{{ .ZWAVE_JS_UI_SESSION_SECRET }}"
        # Z-Wave network security keys (S0 legacy + S2, including Long
        # Range) - real cryptographic keys protecting the mesh, not
        # something to fabricate. Generate with e.g. `openssl rand -hex 16`
        # per key before first pairing; zwave-js-ui can also generate its
        # own on first run if these are left unset, but pinning them here
        # keeps the network key reproducible across pod restarts/reinstalls.
        KEY_S0_Legacy: "{{ .ZWAVE_JS_UI_KEY_S0_LEGACY }}"
        KEY_S2_Unauthenticated: "{{ .ZWAVE_JS_UI_KEY_S2_UNAUTHENTICATED }}"
        KEY_S2_Authenticated: "{{ .ZWAVE_JS_UI_KEY_S2_AUTHENTICATED }}"
        KEY_S2_AccessControl: "{{ .ZWAVE_JS_UI_KEY_S2_ACCESS_CONTROL }}"
        KEY_LR_S2_Authenticated: "{{ .ZWAVE_JS_UI_KEY_LR_S2_AUTHENTICATED }}"
        KEY_LR_S2_AccessControl: "{{ .ZWAVE_JS_UI_KEY_LR_S2_ACCESS_CONTROL }}"
  dataFrom:
    - extract:
        key: zwave-js-ui
