---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name zwave-js-ui-secret
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        DEFAULT_USERNAME: "{{ .ZWAVE_JS_UI_DEFAULT_USERNAME }}"
        DEFAULT_PASSWORD: "{{ .ZWAVE_JS_UI_DEFAULT_PASSWORD }}"
        SESSION_SECRET: "{{ .ZWAVE_JS_UI_SESSION_SECRET }}"
        # Z-Wave network security keys (S0 legacy + S2) - real cryptographic
        # keys protecting the mesh, not something to fabricate. Generate
        # with e.g. `openssl rand -hex 16` per key before first pairing;
        # zwave-js-ui can also generate its own on first run if these are
        # left unset, but pinning them here keeps the network key
        # reproducible across pod restarts/reinstalls.
        KEY_S0_Legacy: "{{ .ZWAVE_JS_UI_KEY_S0_LEGACY }}"
        KEY_S2_Unauthenticated: "{{ .ZWAVE_JS_UI_KEY_S2_UNAUTHENTICATED }}"
        KEY_S2_Authenticated: "{{ .ZWAVE_JS_UI_KEY_S2_AUTHENTICATED }}"
        KEY_S2_AccessControl: "{{ .ZWAVE_JS_UI_KEY_S2_ACCESS_CONTROL }}"
        # Long Range (KEY_LR_*) keys deliberately NOT templated here -
        # confirmed 2026-09-25 via zwave-js-ui 11.24.1's own source
        # (api/lib/utils.ts parseSecurityKeys): config.securityKeysLongRange
        # is normalized with `|| {}` AFTER the loop that writes into it, so
        # setting any KEY_LR_* env var on a genuinely first-ever boot (no
        # settings.json yet) throws "Cannot set properties of undefined
        # (setting 'S2_AccessControl')" and crash-loops the pod. Re-add
        # KEY_LR_S2_Authenticated/KEY_LR_S2_AccessControl only once this
        # upstream ordering bug is fixed, or once settings.json already
        # exists with a real securityKeysLongRange object in it (untested
        # whether that actually avoids the bug on a later start - verify
        # before relying on it). Not a functional loss: this network has no
        # Z-Wave Long Range devices.
  dataFrom:
    - extract:
        key: zwave-js-ui
