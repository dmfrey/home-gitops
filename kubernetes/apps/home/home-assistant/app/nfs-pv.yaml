---
# 2026-11-16: UNAS pool rebuilt (RAID6, new pool UUID); restored from the QNAP copy.
# PV spec.nfs is immutable: changing it means deleting the PV and PVC first. The
# share's export path ends in /.data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-backups
spec:
  # UNAS Pro migration (2026-09-29): app-template's persistence.type: nfs
  # shorthand maps to a plain Kubernetes v1.NFSVolumeSource, which has no
  # mountOptions field at all - only PersistentVolume.spec.mountOptions
  # supports it. The UNAS Pro speaks NFSv4.1 as of 2026-11-27 (was v3-only, hence the old vers=4.1) (confirmed
  # via its own web UI) and Talos nodes default to NFSv4.1 (deliberate
  # global /etc/nfsmount.conf tuning for the old QNAP, see
  # talos/machineconfig.yaml.j2), so this mount needs an explicit static
  # PV/PVC pair instead of the usual shorthand.
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 100Gi
  mountOptions:
    - vers=4.1
  nfs:
    server: nas.internal
    path: /homeassistant
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-backups
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: home-assistant-backups
  storageClassName: ""
