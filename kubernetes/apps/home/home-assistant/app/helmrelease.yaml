---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: home-assistant-cnpg-app
        initContainers:
          venv-cleanup:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.3@sha256:3a5bf87bb8192cbef21a2e44383477a48a227c2dd19c2383ada2cb229981c127
            command:
              - /bin/sh
              - -c
              - |
                CURRENT=$(python3 -c "from homeassistant.const import __version__; print(__version__)" 2>/dev/null || echo "unknown")
                VERSION_FILE=/config/.venv/.ha-version
                if [ -f "$VERSION_FILE" ] && [ "$(cat $VERSION_FILE)" = "$CURRENT" ]; then
                  echo "HA $CURRENT unchanged, keeping .venv cache"
                else
                  echo "HA version changed to $CURRENT, clearing .venv cache"
                  find /config/.venv -mindepth 1 -delete
                fi
                echo "$CURRENT" > "$VERSION_FILE"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.3@sha256:3a5bf87bb8192cbef21a2e44383477a48a227c2dd19c2383ada2cb229981c127
            # Overrides the image's own /entrypoint.sh - confirmed live 2026-09-30
            # that upstream's `uv venv --system-site-packages "${VENV_FOLDER}"`
            # call fails every single time with `/config/.venv` as a mounted PVC:
            # uv now refuses to create a venv at a path that already exists as a
            # directory (the mount point itself can't be unlinked, only its
            # contents can - upstream's own comment acknowledges this, but their
            # script doesn't pass the flag current `uv` needs for it). Confirmed
            # via manual exec: fails with "A directory already exists at: .venv"
            # without --allow-existing, no env-var equivalent exists for that
            # specific flag (only --clear has one, UV_VENV_CLEAR, which hits a
            # *different* uv error since the mount point isn't a uv-recognized
            # venv to clear). Net effect since whenever this uv behavior changed
            # upstream: HA silently never got a working venv, fell back to the
            # read-only base image site-packages for every custom-integration
            # pip install, and 6 integrations needing extra packages
            # (gehomesdk, py-uconnect, hyundai_kia_connect_api, pybase64,
            # mini-racer, openplantbook-sdk/json-timeseries) failed outright.
            # This is identical to upstream's entrypoint.sh with only
            # --allow-existing added to the uv venv call - drop this override
            # if home-operations/containers fixes it upstream.
            # Rebuild also when bin/activate is missing, not only when .image differs: a
            # partial clear (the init container used to `rm -rf /config/.venv/*`, which
            # skips dotfiles) left .image behind with no bin/, so the rebuild was skipped
            # and `source .../bin/activate` failed on every restart (2026-10-19, #5613).
            # The rebuild keeps .ha-version (written by the venv-cleanup init container):
            # deleting it here made every restart look like a version change, so the init
            # container cleared the whole venv and it was rebuilt on every start (follow-up to #5614).
            # NOTE: deliberately $VAR not ${VAR} throughout - Flux's own
            # postBuild.substitute scans rendered YAML for ${...} patterns in
            # strict mode and fails the whole Kustomization if it finds one it
            # doesn't recognize (hit this exact error: "variable substitution
            # failed: variable not set (strict mode): VENV_FOLDER").
            command:
              - /bin/sh
              - -c
              - |
                image="$(python3 -c 'from importlib.metadata import version; print(version("homeassistant"))')-$(uname -m)"
                if [ "$(cat "$VENV_FOLDER/.image" 2>/dev/null)" != "$image" ] || [ ! -f "$VENV_FOLDER/bin/activate" ]; then
                  mkdir -p "$VENV_FOLDER"
                  find "$VENV_FOLDER" -mindepth 1 ! -name .ha-version -delete
                  uv venv --system-site-packages --allow-existing "$VENV_FOLDER"
                  echo "$image" > "$VENV_FOLDER/.image"
                fi
                source "$VENV_FOLDER/bin/activate"
                exec python3 -P -m homeassistant --config /config
            env:
              TZ: America/New_York
              GIT_SSH_COMMAND: "ssh -i /config/.ssh/deploy_key -o StrictHostKeyChecking=no"
              HASS_RECORDER_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-cnpg-app
                    key: uri
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
            args:
              - "/config"
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
            env:
              TZ: America/New_York
              HASS_SERVER: http://localhost:8123
              HASS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: CODE_SERVER_ADDON_HASS_TOKEN
              GIT_SSH_COMMAND: "ssh -i /config/.ssh/deploy_key -o StrictHostKeyChecking=no"
              GIT_CONFIG_COUNT: "1"
              GIT_CONFIG_KEY_0: safe.directory
              GIT_CONFIG_VALUE_0: "*"
          mdns:
            # Publishes homeassistant.local over mDNS on the IoT VLAN interface (net1).
            # Home Assistant's own zeroconf only announces a uuid-based host name, and a
            # container install has no Avahi to publish homeassistant.local. Reuses the HA
            # image (it already ships the zeroconf and ifaddr libraries), so there is no
            # extra image to track; Renovate bumps this tag together with the others.
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.3@sha256:3a5bf87bb8192cbef21a2e44383477a48a227c2dd19c2383ada2cb229981c127
            command:
              - python3
              - -P
              - -c
              - |
                import ipaddress
                import os
                import signal
                import socket
                import threading

                import ifaddr
                from zeroconf import IPVersion, ServiceInfo, Zeroconf

                # Publishes <HOSTNAME>.local for the pod's address(es) on one interface, so clients on
                # that VLAN can resolve it over mDNS. Home Assistant's own zeroconf only announces a
                # uuid-based host name; nothing in a container install publishes homeassistant.local.
                host = os.environ.get("MDNS_HOSTNAME", "homeassistant")
                iface = os.environ.get("MDNS_INTERFACE", "net1")
                port = int(os.environ.get("MDNS_PORT", "8123"))

                v4, v6 = [], []
                for adapter in ifaddr.get_adapters():
                    if adapter.name != iface:
                        continue
                    for ip in adapter.ips:
                        if ip.is_IPv4:
                            v4.append(ip.ip)
                        else:
                            addr = ipaddress.ip_address(ip.ip[0])
                            if not addr.is_link_local:
                                v6.append((ip.ip[0], ip.ip[2]))
                if not v4:
                    raise SystemExit("no IPv4 address on " + iface)

                interfaces = list(v4) + [a for a in v6]
                zc = Zeroconf(interfaces=interfaces, ip_version=IPVersion.All if v6 else IPVersion.V4Only)
                info = ServiceInfo(
                    "_http._tcp.local.",
                    "Home Assistant (" + host + ")._http._tcp.local.",
                    port=port,
                    server=host + ".local.",
                    parsed_addresses=list(v4) + [a[0] for a in v6],
                )
                zc.register_service(info, allow_name_change=False)
                print("published", host + ".local ->", info.parsed_addresses(), "on", iface, flush=True)

                stop = threading.Event()
                for sig in (signal.SIGTERM, signal.SIGINT):
                    signal.signal(sig, lambda *_: stop.set())
                stop.wait()
                zc.unregister_all_services()
                zc.close()
                print("unpublished", host + ".local", flush=True)
            env:
              MDNS_HOSTNAME: homeassistant
              MDNS_INTERFACE: net1
              MDNS_PORT: "8123"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      priorityClassName: high
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "iot-vlan",
            "namespace": "kube-system",
            "ips": ["192.168.50.4/24", "${IPV6_IOT_PREFIX}:4::1/64"],
            "mac": "c6:2a:0a:f1:3d:f8"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 568
    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: &port 8123
      code:
        ports:
          http:
            port: &codePort 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/icon: home-assistant.png
          gethomepage.dev/description: Home Automation Software
          gethomepage.dev/widget.type: homeassistant
          gethomepage.dev/widget.url: https://home.dmfrey.com
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_HASS_TOKEN}}` }}"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=home-assistant
        hostnames:
          - home.dmfrey.com
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      code:
        hostnames:
          - hass-code.dmfrey.com
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Home Assistant Code Server
          gethomepage.dev/icon: vscode.png
          gethomepage.dev/description: Online Code Editor
          gethomepage.dev/pod-selector: app.kubernetes.io/name=home-assistant
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: code
                port: *codePort
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      llmvision:
        existingClaim: home-assistant-llmvision
        advancedMounts:
          home-assistant:
            app:
              - path: /config/www/llmvision
      # Split out of the old whole-root nas.internal:/media QNAP mount
      # (2026-09-30) - configuration.yaml/automations.yaml both hardcode
      # /media/llmvision and /media/reolink (HACS blueprints expect them
      # at exactly that path), so these mount at the same container paths
      # the whole-root mount used to provide, just backed by their own
      # UNAS shares now. Confirmed no other /media/* path is referenced
      # anywhere in config before retiring the catch-all mount.
      media-llmvision:
        existingClaim: home-assistant-media-llmvision
        advancedMounts:
          home-assistant:
            app:
              - path: /media/llmvision
      media-reolink:
        # Shares the same PVC reolink-ftp itself writes to (both in the
        # `home` namespace) - HA only reads here (the "cat house" shell_command
        # lists recent recordings), never writes, so mounted read-only.
        existingClaim: reolink-ftp
        advancedMounts:
          home-assistant:
            app:
              - path: /media/reolink
                readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /config/tts
            subPath: tts
          - path: /tmp
            subPath: tmp
      backups:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: home-assistant-backups
        advancedMounts:
          home-assistant:
            app:
              - path: /config/backups
                readOnly: false
      deploy-key:
        type: secret
        name: "{{ .Release.Name }}-secret"
        items:
          - key: HASS_DEPLOY_KEY
            path: deploy_key
        defaultMode: 0600
        advancedMounts:
          home-assistant:
            app:
              - path: /config/.ssh
                readOnly: true
            codeserver:
              - path: /config/.ssh
                readOnly: true
