---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper

spec:
  chartRef:
    kind: OCIRepository
    name: piper

  interval: 1h

  values:
    controllers:
      piper:
        type: statefulset

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: rhasspy/wyoming-piper
              tag: 2.4.3@sha256:f7aaafe325d18979f43a9fe8bb4db494ba28ce8c109cb982983157817705ff87

            args:
              - --voice
              - en_US-hfc_female-medium
              - --data-dir
              - /data

            env:
              TZ: America/New_York

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 350Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.29.102
        ports:
          http:
            port: 10200

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"

      tmp:
        type: emptyDir
