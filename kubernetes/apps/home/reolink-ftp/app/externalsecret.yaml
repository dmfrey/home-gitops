---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reolink-ftp
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: reolink-ftp-secret
    template:
      engineVersion: v2
      data:
        # delfer/alpine-ftp-server's combined user|pass|folder|uid format -
        # uid 1000 matches this repo's usual app UID convention so files
        # the camera writes land owned the same way everything else does.
        USERS: "reolink|{{ .PASSWORD }}|/home/reolink/uploads|1000"
  dataFrom:
    - extract:
        key: reolink-ftp
