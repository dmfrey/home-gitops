---
# 2026-11-16: UNAS pool rebuilt (RAID6, new pool UUID); restored from the QNAP copy.
# PV spec.nfs is immutable: changing it means deleting the PV and PVC first. The
# share's export path ends in /.data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reolink-ftp
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: nas.internal
    path: /volume/bca65fde-53e9-4a44-9c10-970f844d3152/.srv/.unifi-drive/reolink/.data
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reolink-ftp
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: reolink-ftp
  storageClassName: ""
