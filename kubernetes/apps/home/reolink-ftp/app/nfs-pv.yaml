---
# 2026-11-12 UNAS BAD BLOCKS: pointed at the QNAP (192.168.30.2) copy until the UNAS pool is
# rebuilt. PV spec.nfs is immutable: changing it means deleting the PV and PVC first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reolink-ftp
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 200Gi
  mountOptions:
    - vers=3
    - nolock
  nfs:
    server: 192.168.30.2
    path: /reolink
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reolink-ftp
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  volumeName: reolink-ftp
  storageClassName: ""
