---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt-common
spec:
  interval: 1h
  path: "./kubernetes/apps/home/zigbee2mqtt/common"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: zigbee2mqtt-common
    - name: mosquitto
    - name: home-assistant
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: "./kubernetes/apps/home/zigbee2mqtt/app"
  postBuild:
    substitute:
      APP: zigbee2mqtt
      CONTROLLER: StatefulSet
      KOPIUR_CACHE_CAPACITY: 2Gi
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zigbee2mqtt-02
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: zigbee2mqtt-common
    - name: mosquitto
    - name: home-assistant
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: "./kubernetes/apps/home/zigbee2mqtt/app-02"
  postBuild:
    substitute:
      APP: zigbee2mqtt-02
      CONTROLLER: StatefulSet
      KOPIUR_CACHE_CAPACITY: 2Gi
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home
  timeout: 5m
  wait: false
