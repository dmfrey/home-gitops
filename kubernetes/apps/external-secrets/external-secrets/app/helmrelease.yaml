---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets

spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets

  interval: 1h

  values:
    grafanaDashboard:
      enabled: true

    leaderElect: true

    serviceMonitor:
      enabled: true
      interval: 1m

    webhook:
      replicaCount: 2
