---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Staging Envoy, shared with coworkers over the Cloudflare tunnel (envoy-external).
# One parent only (never both gateways: two CNAME targets made the UDM dnsmasq
# churn, #5333). Sign-in (Authentik, passkey required) gates /api and /mcp.
# /v1 (ingest), /actuator and /otlp answer 404: /v1 and /actuator because they
# are unauthenticated and internal-only by design, /otlp because the frontend
# nginx proxies it to Alloy with no auth, so on the internet anyone could push
# traces into the observability stack. /api, /mcp and the OAuth
# protected-resource metadata go to the backend, everything else to the UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Not "envoy": the gatus sidecar names an endpoint after each HTTPRoute
  # (group + route name), so a second route called envoy duplicates production's
  # internal_envoy and crash-loops gatus (2026-10-12).
  name: envoy-staging
spec:
  hostnames:
    - project-envoy-staging.dmfrey.com
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /actuator
        - path:
            type: PathPrefix
            value: /otlp
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: envoy-not-found
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /mcp
        # MCP clients discover the authorization server here (RFC 9728); left
        # to the catch-all it would return the SPA page from the frontend.
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: envoy
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: envoy-frontend
          port: 80
