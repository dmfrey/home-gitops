---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Staging Envoy, shared with coworkers over the Cloudflare tunnel (envoy-external).
# One parent only (never both gateways: two CNAME targets made the UDM dnsmasq
# churn, #5333). Sign-in (Authentik, passkey required) gates /api and /mcp.
# /v1 (ingest) and /actuator answer 404 because they are unauthenticated and
# internal-only by design. /otlp reaches the frontend again since 2026-10-26
# (home-gitops#5794, envoy#346): its nginx now accepts only POST
# /otlp/v1/traces, from a signed-in session (auth_request to /api/me), with a
# 256k body cap and a per-client rate limit, and forwards to Alloy's separate
# browser receiver, which pins service.name and allowlists span attributes
# (home-gitops#5788). Before that it answered 404 here (#5507) because the old
# proxy had no authentication. /api, /mcp and the OAuth protected-resource
# metadata go to the backend, everything else to the UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Not "envoy": the gatus sidecar names an endpoint after each HTTPRoute
  # (group + route name), so a second route called envoy duplicates production's
  # internal_envoy and crash-loops gatus (2026-10-12).
  name: envoy-staging
  annotations:
    # gatus-sidecar derives the URL from the first path match (/v1), which this
    # route deliberately answers with 404, so the check was always red. Probe
    # the UI instead: it needs no sign-in and proves tunnel, gateway and
    # frontend are up. The backend's health is covered by the pod probes.
    gatus.home-operations.com/endpoint: |-
      url: "https://project-envoy-staging.dmfrey.com/"
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - project-envoy-staging.dmfrey.com
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /actuator
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: envoy-not-found
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /mcp
        # MCP clients discover the authorization server here (RFC 9728); left
        # to the catch-all it would return the SPA page from the frontend.
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: envoy
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: envoy-frontend
          port: 80
