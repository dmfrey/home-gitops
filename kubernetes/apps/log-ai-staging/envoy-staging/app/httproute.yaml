---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Internal-only UI for staging Envoy, same rules as production: one parent
# (the internal gateway, never envoy-external), /v1 (ingest) and /actuator
# answer 404, /api and /mcp go to the backend, everything else to the UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Not "envoy": the gatus sidecar names an endpoint after each HTTPRoute
  # (group + route name), so a second route called envoy duplicates production's
  # internal_envoy and crash-loops gatus (2026-10-12).
  name: envoy-staging
spec:
  hostnames:
    - project-envoy-staging.dmfrey.com
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /actuator
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: envoy-not-found
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: envoy
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: envoy-frontend
          port: 80
