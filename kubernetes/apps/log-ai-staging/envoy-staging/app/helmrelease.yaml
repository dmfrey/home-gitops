---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
# Staging Envoy (home-gitops#5475): same chart values as production
# (log-ai/log-ai) against a restored copy of its database. No log ingest and no
# Alloy routing; see envoy-staging/ks.yaml. Resource names are envoy-staging-*
# for the database and broker, but the app and Service stay "envoy": the
# frontend image's nginx proxies to http://envoy:8080 and needs that name.
kind: HelmRelease
metadata:
  name: envoy
spec:
  chartRef:
    kind: OCIRepository
    name: envoy
  interval: 1h
  # Helm's default 5m action timeout rolled the upgrade back while the
  # templating-009 migration was still running (the backend only turns Ready
  # after Liquibase finishes). Keep this above the startup probe window.
  timeout: 20m
  values:
    controllers:
      backend:
        # Envoy keeps its Drain trees in memory and is single-instance by
        # design: exactly one replica, and Recreate so a rollout never runs
        # two at once.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: envoy-staging-cnpg-app,envoy-staging-rabbitmq-default-user,envoy-staging-auth-secret
        pod:
          # Room for the @PreDestroy Drain snapshot on shutdown. Spring Boot's
          # graceful shutdown phase defaults to 30s, so this stays above it.
          terminationGracePeriodSeconds: 60
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy
              # Staging, step 6c (home-gitops#5475): 80e24f1 makes POST /logout
              # return the Authentik end-session URL so the browser navigates
              # there itself and the Authentik session really ends (envoy#142).
              # Step 6b was
              # a67d1d8efbc9d21cadaf4d7439b12b6d22f7c9ec@sha256:4b26f5aab43283fcb1bf62f120712159760af3531b71d2a191625176556b317c.
              # Step 6b: a67d1d8 stops saving the SPA's
              # first API call for replay after sign-in, so login lands on / and
              # not /api/me?continue (envoy#139). Step 6 was
              # 8adee126dc396d8a34ee37a5d97a8a549cea9b50@sha256:9c2a0ea36374b25b6409db066d67bbee0f6a5a0bb9daffbc5bcfeb5df46b0038.
              # Step 6 itself: 8adee12 turns sign-in on
              # (envoy#23) and adds the Liquibase changeset
              # audit-002-add-tool-calls-principal (nullable column, no rewrite).
              # Earlier: 7b6767ed96d9d9b424df8a144abc0d7d80588528@sha256:2d6946dda62978f57b11e05dde34801360981e2b3e11d075f4a71145df48c354
              # (step 4, adds templating-010-retire-restored-aliased-rows), 30dc658@sha256:44948697df696a2749db401a2e4b196d6b3f149bfc5d764095661e67aca84154
              # (step 2) and production's 9083e54@sha256:b1a95ee1e7691d28102265196e17b11e0523e4dcf3c9d413941039254079c1b4 (step 1).
              # Deliberately no renovate comment: staging is bumped by hand.
              # Step 7 (home-gitops#5508): 26723e8 adds ticket filing (envoy#145,
              # off unless ENVOY_REDUCER_TICKETS_ENABLED=true) and ticket chips/button
              # (envoy#146). Liquibase ticketing-001: one nullable column plus one
              # empty table. Step 6c was
              # 80e24f1234b8af6cdaaa821119735c7bd7ba9bb6@sha256:eb676c330c5195c8e696b57a99081a5c933392937b2b8078c2486aaa10aa179e.
              # Step 8 (home-gitops#5502): 5877564 adds anomaly notification email
              # (envoy#136, off unless ENVOY_REDUCER_NOTIFICATIONS_ENABLED=true).
              # Step 7 was
              # 26723e83e81ef6d72ba78a780d06b0fdf3e1ed61@sha256:6473af72e5daab9e6b98ac05436b435c1ed5977355d6847c3c69fb12584caa8c.
              # Step 9 (#5475 step 7): 0bdf6c7 adds the send-yourself test email
              # (envoy#158), tracker reconnect after an MCP session loss (envoy#160)
              # and ticket status polling (envoy#147). Liquibase ticketing-002: ticket
              # status columns, additive. Step 8 was
              # 5877564a169d54623c6b1a2bc760ac5d6d6a5b62@sha256:0b2d7669e53e91fb12e60a64729785fa0b1a15f8af25fb052c7a0540f2228414.
              tag: 0bdf6c7fc83e004826575bc99907e91dc082623f@sha256:2805aee2df9be41967215898863c52e36f029875aa0fc1e2154557f4869c0a8c
            # Authentik client id/secret for the "envoy" application, from the
            # 1Password item project-envoy (see externalsecret.yaml).
            envFrom:
              - secretRef:
                  name: envoy-staging-auth-secret
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: staging
              # Sign-in (envoy#23). Auth is on by default, so the pod will not
              # start without the client id/secret (envFrom above) and these.
              # The Authentik application is `envoy` (browser, confidential) and
              # `envoy-mcp` (public PKCE client used by MCP clients).
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE: openid,profile,email
              SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SSO_ISSUER_URI: https://auth.dmfrey.com/application/o/envoy/
              SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.dmfrey.com/application/o/envoy-mcp/
              ENVOY_REDUCER_AUTH_ACCOUNT_URL: https://auth.dmfrey.com/if/user/
              # Ticket filing through the in-cluster RT MCP server (home-gitops#5508).
              # Enabled 2026-10-14 (step 7 deployed the code and migration off).
              # Staging files into its own queue so tickets never reach the
              # production "Envoy" queue, and has no automatic rules (manual
              # "Create ticket" button only). The MCP has no auth of its own.
              ENVOY_REDUCER_TICKETS_ENABLED: "true"
              ENVOY_REDUCER_TICKETS_TRACKER: rt
              ENVOY_REDUCER_TICKETS_BASE_URL: https://project-envoy-staging.dmfrey.com
              ENVOY_REDUCER_TICKETS_MCP_URL: http://rt-mcp.observability.svc.cluster.local:8013/mcp
              ENVOY_REDUCER_TICKETS_CREATE_TOOL: create_ticket_tool
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_QUEUE: Envoy-Staging
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_SUBJECT: "{subject}"
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_TEXT: "{body}"
              # Unverified against RT's real reply: confirm with the first ticket.
              ENVOY_REDUCER_TICKETS_CREATE_SUCCESS_PATTERN: 'Ticket #(\d+) created'
              ENVOY_REDUCER_TICKETS_CREATE_URL_TEMPLATE: https://tickets.dmfrey.com/Ticket/Display.html?id={id}
              # Ticket status polling (envoy#147). Shape taken from a real
              # get_ticket_tool reply (2026-10-14): argument ticket_id, and a line
              # "  Status: new". Anchored to line start so a "Status:" inside a
              # subject can't match. No match is stored as unknown, not an error.
              ENVOY_REDUCER_TICKETS_STATUS_TOOL: get_ticket_tool
              ENVOY_REDUCER_TICKETS_STATUS_ARGUMENTS_TICKET_ID: "{externalId}"
              ENVOY_REDUCER_TICKETS_STATUS_PATTERN: '(?m)^\s*Status: (\w+)\s*$'
              ENVOY_REDUCER_TICKETS_STATUS_CLOSED_VALUES: resolved,rejected,deleted
              # Anomaly notification email (home-gitops#5502). Goes out through the
              # cluster's smtp-relay, which has no inbound auth and no TLS; it holds
              # the upstream credentials and uses STARTTLS on its own outbound hop,
              # so Envoy sets no username, password or STARTTLS. The relay's only
              # configured sender is the noreply address below. Real mail: only
              # people who subscribed at /settings/notifications receive anything.
              SPRING_MAIL_HOST: smtp-relay.kube-system.svc.cluster.local
              SPRING_MAIL_PORT: "25"
              ENVOY_REDUCER_NOTIFICATIONS_ENABLED: "true"
              ENVOY_REDUCER_NOTIFICATIONS_EMAIL_ENABLED: "true"
              ENVOY_REDUCER_NOTIFICATIONS_EMAIL_FROM: noreply@homelab5767.cc
              ENVOY_REDUCER_NOTIFICATIONS_BASE_URL: https://project-envoy-staging.dmfrey.com
              # Same pod-instance wiring as spring-notes. Name must sort before
              # OTEL_RESOURCE_ATTRIBUTES: the chart renders env alphabetically
              # and $(VAR) only expands if VAR is defined earlier.
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              # Metrics come from the ServiceMonitor scrape of
              # /actuator/prometheus. The app also defaults to pushing the same
              # meters over OTLP, which would create a second series per meter.
              # Traces still go to Alloy over OTLP.
              MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              # The app defaults its own package to debug. Info here keeps the
              # per-request lines out of the pipeline, and matters once Alloy
              # ships logs back into Envoy.
              LOGGING_LEVEL_COM_BROADCOM_TANZU_ENVOY: info
              # CNPG auto-creates envoy-staging-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: password
              # RabbitMQ Cluster Operator auto-creates envoy-staging-rabbitmq-default-user
              # with host/port/username/password, same shape as CNPG's app secret.
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: password
              # Phase 3 AI client: Ollama's OpenAI-compatible endpoint. The API
              # key is present but explicitly empty: that is Spring AI's
              # no-auth signal for a keyless server (unset is not the same).
              SPRING_AI_OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              SPRING_AI_OPENAI_API_KEY: ""
              # Non-deprecated names (Spring AI 2.0.1). The older ..._OPTIONS_MODEL
              # names write a different key than Envoy's own application.yml
              # default (spring.ai.openai.chat.model: qwen2.5:0.5b), so the
              # override might not have won. Values unchanged.
              SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-embed-text
              # qwen3:8b confirmed by the tool-calling test on dmfrey/envoy#12
              # (args 18/21 vs 12/21 for qwen2.5:7b-instruct, same tool accuracy,
              # 3.4 s median latency; thinking arrives in a separate field).
              SPRING_AI_OPENAI_CHAT_MODEL: qwen3:8b
            probes:
              # The first start runs the Liquibase migrations, so give startup
              # room (up to 600s) before liveness takes over. 150s was too
              # short for templating-009 (retires ~20k aliased template rows
              # in one transaction): the probe killed the pod mid-migration,
              # which rolled back and retried forever (2026-10-11).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy-frontend
              # Step 6c: 80e24f1 (sign-out button follows the end-session URL; envoy#142).
              # Step 6a: f897efe (nginx passes the gateway's X-Forwarded-Proto
              # through, fixing the http OIDC redirect_uri; envoy#137). Step 6:
              # 8adee126dc396d8a34ee37a5d97a8a549cea9b50@sha256:2380a84baf5277f95c0c713ba2a59780cdbf81583ade08ed8da1152203b9f631 (sign-in). Earlier: 212f8b3525b90c7426a704992ea99ea290df96ce@sha256:5da8cd8d28e359d0950d136103c00912cec70fcdfc4ec785ccc8e71896c8682a (step 5, chat layout fix), a612def7baf3c1b028d916088fc99558d4fabc00@sha256:e2ecca07f4fd8978afd3be5bacf7f5bf5bdd2c8d7d18b0734c36cf6a7123a1d8 (step 3),
              # fa557f3cb299ae2ecdbe19796f38a89e4d9410ce@sha256:979d7e115f7ba3ce00bbf07ee4e2c61ecfd9fa6ebedd773a32d2722a00103af2 (step 2) and
              # production's 7272872da1c8a7a900c760fc4e8fd6200f8a0285@sha256:a65d962e0e949d5acb258264357a91d4ff80bb4e7c75f0a72cbcc4810fb20005.
              # Step 7: 26723e8 (Create ticket button and ticket chips; envoy#146).
              # Step 6c was 80e24f1234b8af6cdaaa821119735c7bd7ba9bb6@sha256:e1710b254bfa6a0c8dcc308badfcef6957743427dc193ed5d849f97e441f80c1.
              # Step 8: 5877564 (notification settings page). Step 7 was
              # 26723e83e81ef6d72ba78a780d06b0fdf3e1ed61@sha256:932705244773542003dcf697f3b2708311552d6e35288800915dc63b9ad84f6a.
              # Step 9: 0bdf6c7 (test email button, ticket status). Step 8 was
              # 5877564a169d54623c6b1a2bc760ac5d6d6a5b62@sha256:4daaba226c8d3010df329f8e5dfa9b9c38774f7f044432fc760cbf0445a0a1b3.
              tag: 0bdf6c7fc83e004826575bc99907e91dc082623f@sha256:85836cb2e52542ebbb6be8bed2303dc581ce38728b78f47e04094ab3a1aa9086
            # Explicit port: the frontend has no app-template Service (its
            # Service is the standalone service-frontend.yaml), and a probe
            # with custom: false derives its port from the chart's service,
            # which rendered as port 0 and was rejected by the API server.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    # In-cluster only. The routed paths are defined in httproute.yaml;
    # /v1/logs (ingest) and /actuator are deliberately not reachable through the
    # gateway. This is the chart's only service, so app-template names it plain
    # "envoy" - which the frontend image needs: its nginx proxies /api/ to
    # http://envoy:8080 and resolves that name at startup, so a Service called
    # exactly "envoy" must exist or nginx refuses to start. Alloy's exporter
    # (PR B) uses the same name: http://envoy.log-ai.svc.cluster.local:8080.
    # The frontend's Service is the standalone service-frontend.yaml.
    service:
      backend:
        controller: backend
        # Opt out of gatus-sidecar's --auto-service: it names an endpoint after
        # the Service, and production has Services called envoy and
        # envoy-frontend too (duplicate endpoint, gatus crash-loops).
        annotations:
          gatus.home-operations.com/enabled: "false"
        ports:
          http:
            port: 8080
