---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
# Staging Envoy (home-gitops#5475): same chart values as production
# (log-ai/log-ai) against a restored copy of its database. No log ingest and no
# Alloy routing; see envoy-staging/ks.yaml. Resource names are envoy-staging-*
# for the database and broker, but the app and Service stay "envoy": the
# frontend image's nginx proxies to http://envoy:8080 and needs that name.
kind: HelmRelease
metadata:
  name: envoy
spec:
  chartRef:
    kind: OCIRepository
    name: envoy
  interval: 1h
  # Helm's default 5m action timeout rolled the upgrade back while the
  # templating-009 migration was still running (the backend only turns Ready
  # after Liquibase finishes). Keep this above the startup probe window.
  timeout: 20m
  values:
    controllers:
      backend:
        # Envoy keeps its Drain trees in memory and is single-instance by
        # design: exactly one replica, and Recreate so a rollout never runs
        # two at once.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: envoy-staging-cnpg-app,envoy-staging-rabbitmq-default-user,envoy-staging-auth-secret
        pod:
          # Room for the @PreDestroy Drain snapshot on shutdown. Spring Boot's
          # graceful shutdown phase defaults to 30s, so this stays above it.
          terminationGracePeriodSeconds: 60
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy
              # Staging, step 6c (home-gitops#5475): 80e24f1 makes POST /logout
              # return the Authentik end-session URL so the browser navigates
              # there itself and the Authentik session really ends (envoy#142).
              # Step 6b was
              # a67d1d8efbc9d21cadaf4d7439b12b6d22f7c9ec@sha256:4b26f5aab43283fcb1bf62f120712159760af3531b71d2a191625176556b317c.
              # Step 6b: a67d1d8 stops saving the SPA's
              # first API call for replay after sign-in, so login lands on / and
              # not /api/me?continue (envoy#139). Step 6 was
              # 8adee126dc396d8a34ee37a5d97a8a549cea9b50@sha256:9c2a0ea36374b25b6409db066d67bbee0f6a5a0bb9daffbc5bcfeb5df46b0038.
              # Step 6 itself: 8adee12 turns sign-in on
              # (envoy#23) and adds the Liquibase changeset
              # audit-002-add-tool-calls-principal (nullable column, no rewrite).
              # Earlier: 7b6767ed96d9d9b424df8a144abc0d7d80588528@sha256:2d6946dda62978f57b11e05dde34801360981e2b3e11d075f4a71145df48c354
              # (step 4, adds templating-010-retire-restored-aliased-rows), 30dc658@sha256:44948697df696a2749db401a2e4b196d6b3f149bfc5d764095661e67aca84154
              # (step 2) and production's 9083e54@sha256:b1a95ee1e7691d28102265196e17b11e0523e4dcf3c9d413941039254079c1b4 (step 1).
              # Deliberately no renovate comment: staging is bumped by hand.
              # Step 7 (home-gitops#5508): 26723e8 adds ticket filing (envoy#145,
              # off unless ENVOY_REDUCER_TICKETS_ENABLED=true) and ticket chips/button
              # (envoy#146). Liquibase ticketing-001: one nullable column plus one
              # empty table. Step 6c was
              # 80e24f1234b8af6cdaaa821119735c7bd7ba9bb6@sha256:eb676c330c5195c8e696b57a99081a5c933392937b2b8078c2486aaa10aa179e.
              # Step 8 (home-gitops#5502): 5877564 adds anomaly notification email
              # (envoy#136, off unless ENVOY_REDUCER_NOTIFICATIONS_ENABLED=true).
              # Step 7 was
              # 26723e83e81ef6d72ba78a780d06b0fdf3e1ed61@sha256:6473af72e5daab9e6b98ac05436b435c1ed5977355d6847c3c69fb12584caa8c.
              # Step 9 (#5475 step 7): 0bdf6c7 adds the send-yourself test email
              # (envoy#158), tracker reconnect after an MCP session loss (envoy#160)
              # and ticket status polling (envoy#147). Liquibase ticketing-002: ticket
              # status columns, additive. Step 8 was
              # 5877564a169d54623c6b1a2bc760ac5d6d6a5b62@sha256:0b2d7669e53e91fb12e60a64729785fa0b1a15f8af25fb052c7a0540f2228414.
              # Step 10 (#5475 step 8): e9b7c43 masks the media-automation value that
              # leaked into template text (envoy#165). Backend only; no new changeset.
              # Step 9 was
              # 0bdf6c7fc83e004826575bc99907e91dc082623f@sha256:2805aee2df9be41967215898863c52e36f029875aa0fc1e2154557f4869c0a8c.
              # Step 11 (#5475 step 9): 8a5ab21 is the production release candidate:
              # envoy#171 (NEW_TEMPLATE re-fire fix and one-time cleanup, detection-004
              # and detection-005), envoy#173 and the paged anomalies API (envoy#175).
              # Step 10 was
              # e9b7c430d9cc8b358d35814301e2f3a25ed37c64@sha256:b4f3f4d3338630218c2a66fd178fab9f5cec885c4a72303938773ed3062f1529.
              # Step 12 (#5475 step 10): 202deb1 fixes the warm-up clock (envoy#168).
              # Liquibase detection-006-create-source-warmup: one new table, seeded with
              # one row per existing source. Backend only. Step 11 was
              # 8a5ab21d96b0534171aca8d48ec04c5f3786d35b@sha256:2c9507cb07058b4c2a5cc5602335063281599635e180e69c2518bdcd7045c3dc.
              # Round 2, step 1 (home-gitops#5552): 1650590 adds the scoped reset page
              # (envoy#172). No config or Liquibase changes. 202deb1 was
              # 202deb1f639be3d8054e3ef12853aec1fd438a52@sha256:03d971f05d4863eb2d5f7afcbf4cfb1db658e81293a91a649541e1cc0b2d3663.
              # Round 2, step 2 (home-gitops#5552): c05be2a (paged MCP get_anomalies and
              # get_anomaly, logfmt and gateway masking/allowlist fixes, quiet tracker MCP
              # reconnect, per-source Drain threshold; envoy#177, #181, #182, #186, #187).
              # No config or Liquibase changes. Backend only. 1650590 was
              # 1650590ec642a24c01d9d0e9740e1efcdeea810a@sha256:1251a19d839c2b6a05c9d47dd185182418815cdb5572fd5c9195fec989dee624.
              # Round 2, step 3 (home-gitops#5552): 9067af7 replaces step 2 (which was
              # never applied there): everything in c05be2a plus the SQL statement no
              # longer being a metric label (envoy#188 / #190), per-source Drain
              # max-clusters (envoy#183 / #191) and the secret warning firing only when
              # a mask would change the text (envoy#20 / #192). No Liquibase changes.
              # Heap dump on OOM is set below (envoy#189). c05be2a was
              # c05be2aef122d108a2df5c000c49a7ba4bee6ee4@sha256:2e9971a461c8c0eec54d94c041e2c2b97557ae7223d74dd7d89a063dad3f517c.
              # Round 3 (home-gitops#5600): 972c289 adds chat stage 2, inbox grouping, the admin-only
              # heapdump endpoint, doc links. Previous (9067af7): 9067af7814b81cbeb038584dd805b6a1d7584f30@sha256:d5582ea09928bec05a1ba2576dd66d4369364a4481a72afdf6b01f8c1734acba.
              # Step 2 (home-gitops#5600, envoy#197 / #203): 4c40c94 sets management.endpoint.heapdump.access
              # in the image, so the staging-only MANAGEMENT_ENDPOINT_HEAPDUMP_ACCESS env var (#5602) is gone.
              # Backend only; the frontend stays on 972c289. Previous (972c289): 972c289b640d3018a0e9a8eea725be17a6f2925c@sha256:57e07ae87a80ae013d151359dd868168fdb1d3cd3ffaf1b16c199eead840b942.
              # Step 3 (home-gitops#5600; envoy#206, #208, #209): c513c4d adds deploys-001 (empty deploys table),
              # POST /api/deploys, mask counts on /admin/system. Previous (4c40c94): 4c40c948f0dc6985e379f69ee6857fd95200006f@sha256:49c45eabd76166a5a2763a822314988fa9f6eb047757ad63be12852df67c2444.
              # Step 4 (home-gitops#5600; envoy #211-#220): ebc5d52 adds maintenance windows, the hourly rollup, detectors,
              # anomaly windows, triage, event publishing and incident memory, all off by default. Previous (c513c4d): c513c4dd90b45993b3b2cadfe03f321022028102@sha256:9775cbd8b5a409cc9a90e14783bb48835078463af63cf4d89ecdf3d536c9b1fc.
              # 2026-10-25 (home-gitops#5774): staging now mirrors production's images, config
              # and database (restored from a fresh production backup); previously ebc5d52f7016.
              # home-gitops#5763 (staging first): 67b4a86 (raw-log clamp and label refusals, prompt v12, incident email
              # members, folder mask via config). No changesets. Keep -XX:MaxDirectMemorySize=64M.
              # Rollback: revert both images (the three MASKING_ADDITIONALMASKS_0 vars may stay).
              # Previous (8a894c5): 8a894c50fe790d83cf9ad24bebbabdda52af5d52@sha256:ea430cee24f71123734c5211751445c0a320d8430fbdb46fd8004b8becc8d8f7.
              # home-gitops#5786 (staging first): 5bcf89f (digest covers only sent events, deleted-age timer,
              # #302 follow-ups, unknown-source refusal, Boot 4.1.2). No changesets, no new settings; keep the
              # ADDITIONALMASKS_0 vars and -XX:MaxDirectMemorySize=64M. Rollback: revert both images.
              # Previous (67b4a86): 67b4a86bf96b96e5f85694fc7170b5f835b80116@sha256:690e491f50e84f8f79c1fa5f842139682223aa7b346d8393f7f86d354cc5f2dd.
              # home-gitops#5803 (staging first): 3f6198a (memberless windows not indexed and removed with their
              # merge, hidden-incident counts, opt-in chat reasoning-effort, retention refusal ordering).
              # Changeset incidents-002 (one-time, irreversible) deletes incidents whose window has no member
              # anomaly. Keep the ADDITIONALMASKS_0 vars and -XX:MaxDirectMemorySize=64M. Rollback: revert both
              # images; undoing the changeset means restoring staging from a production backup again.
              # Previous (5bcf89f): 5bcf89f6b10803f1ce8d2f4532606b47cd56f23f@sha256:7fc2871c7f31086c45f0a6fcbca69bfa5d80a264a6b97aad6920a14641389a8a.
              # home-gitops#5803 step 4 image: 1b5f9ac fixes the startup failure with triage enabled (envoy#219, PR #366).
              # No new changesets or settings since 3f6198a; only the Paketo builder bump (envoy#343) differs.
              # Rollback: revert to 3f6198a, keeping triage off.
              # Previous (3f6198a): 3f6198acec4b0de807c5da775bc4de8e1ac5dd7b@sha256:622f5b209e30429e200d4358b56c08d29ef8260dc1bbac20a10a1a7807bf3fcb.
              # home-gitops#5803 step 4, second try: c89b246 reads the triage model from the same ChatProperties value chat
              # uses (envoy#219, PR #367), so no ENVOY_REDUCER_CHAT_MODEL is needed. First image where the whole app starting
              # with triage on is covered in CI (TriageEnabledIntegrationTest). No changesets or settings since 1b5f9ac.
              # Rollback: revert to 1b5f9ac, keeping triage off.
              # Previous (1b5f9ac): 1b5f9ac8cd30842f25f924a114347c703b96746d@sha256:edf7603bf58a826d6444bf93fa9cab7dfb7c0c5a3ca84fe5519bdb276ab9dc59.
              tag: c89b246cee9cabe0c9614f149bf332b709a10c06@sha256:5ee0c7271c962c17b51def737be536c3517bd1277562b01bce5989819fc91819
            # Authentik client id/secret for the "envoy" application, from the
            # 1Password item project-envoy (see externalsecret.yaml).
            envFrom:
              - secretRef:
                  name: envoy-staging-auth-secret
            env:
              TZ: America/New_York
              DEPLOYMENT_ENVIRONMENT: staging
              # Sign-in (envoy#23). Auth is on by default, so the pod will not
              # start without the client id/secret (envFrom above) and these.
              # The Authentik application is `envoy` (browser, confidential) and
              # `envoy-mcp` (public PKCE client used by MCP clients).
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE: openid,profile,email
              SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SSO_ISSUER_URI: https://auth.dmfrey.com/application/o/envoy/
              SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.dmfrey.com/application/o/envoy-mcp/
              ENVOY_REDUCER_AUTH_ACCOUNT_URL: https://auth.dmfrey.com/if/user/
              # Deployment-specific mask (envoy#325, #327; home-gitops#5763): soularr's
              # "Folder: <name> in cache." / "not in cache." lines minted ~216 templates a day
              # from album names. Appended after the built-in masks (so a folder like
              # "1999 Greatest Hits" arrives as "<NUM> ..." and is still masked); applies to every
              # source but only matches the Folder: label ahead of that fixed tail. Indexed env
              # vars avoid escaping the regex backslashes inside SPRING_APPLICATION_JSON; the
              # single quotes keep them literal.
              ENVOY_REDUCER_TEMPLATING_MASKING_ADDITIONALMASKS_0_NAME: folder-before-cache-tail
              ENVOY_REDUCER_TEMPLATING_MASKING_ADDITIONALMASKS_0_PATTERN: '(?<=\bFolder:\s)[^\n]+?(?=\s(?:not\s)?in cache\.)'
              ENVOY_REDUCER_TEMPLATING_MASKING_ADDITIONALMASKS_0_PLACEHOLDER: <VALUE>
              # Anomaly window grouping (envoy#217, home-gitops#5678). Turns on grouping only: the
              # RATE_CHANGE and DISAPPEARANCE/SOURCE_SILENT detectors, window triage and event
              # publishing stay off. Other window settings keep their defaults (join-gap 10m,
              # close-after 30m, lookback 2h, max-per-sweep 500, sweep-interval 2m).
              ENVOY_REDUCER_DETECTION_WINDOWS_ENABLED: "true"
              # Ticket filing through the in-cluster RT MCP server (home-gitops#5508).
              # Briefly OFF on 2026-10-25 (#5774) and back ON the same day by request. Note
              # the database is a copy of production's, so it carries production's
              # recipient and subscriptions: they receive staging's mail too.
              # Enabled 2026-10-14 (step 7 deployed the code and migration off).
              # Staging files into its own queue so tickets never reach the
              # production "Envoy" queue, and has no automatic rules (manual
              # "Create ticket" button only). The MCP has no auth of its own.
              ENVOY_REDUCER_TICKETS_ENABLED: "true"
              ENVOY_REDUCER_TICKETS_TRACKER: rt
              ENVOY_REDUCER_TICKETS_BASE_URL: https://project-envoy-staging.dmfrey.com
              ENVOY_REDUCER_TICKETS_MCP_URL: http://rt-mcp.observability.svc.cluster.local:8013/mcp
              ENVOY_REDUCER_TICKETS_CREATE_TOOL: create_ticket_tool
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_QUEUE: Envoy-Staging
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_SUBJECT: "{subject}"
              ENVOY_REDUCER_TICKETS_CREATE_ARGUMENTS_TEXT: "{body}"
              # Unverified against RT's real reply: confirm with the first ticket.
              ENVOY_REDUCER_TICKETS_CREATE_SUCCESS_PATTERN: 'Ticket #(\d+) created'
              ENVOY_REDUCER_TICKETS_CREATE_URL_TEMPLATE: https://tickets.dmfrey.com/Ticket/Display.html?id={id}
              # Ticket status polling (envoy#147). Shape taken from a real
              # get_ticket_tool reply (2026-10-14): argument ticket_id, and a line
              # "  Status: new". Anchored to line start so a "Status:" inside a
              # subject can't match. No match is stored as unknown, not an error.
              ENVOY_REDUCER_TICKETS_STATUS_TOOL: get_ticket_tool
              # The tool's argument is "ticket_id", but Spring maps the env var
              # ..._ARGUMENTS_TICKET_ID to the key "ticket.id" (an env var cannot
              # carry an underscore in a map key), and the tool then rejects the
              # call. So this one argument goes in as JSON.
              # Same source-to-product mapping as production (home-gitops#5644), in bracket form so the
              # '/' in each key survives Spring's Map-key binding. Staging gets no live logs, so this
              # is parity only; it cannot be exercised here.
              SPRING_APPLICATION_JSON: '{"envoy":{"reducer":{"tickets":{"status":{"arguments":{"ticket_id":"{externalId}"}}},"detection":{"doc-links":{"source-products[infra/storage]":{"product":"ceph"},"source-products[infra/talos]":{"product":"talos"},"source-products[infra/object-storage]":{"product":"garage"},"source-products[platform/flux-system]":{"product":"flux"}}}}}}'
              ENVOY_REDUCER_TICKETS_STATUS_PATTERN: '(?m)^\s*Status: (\w+)\s*$'
              ENVOY_REDUCER_TICKETS_STATUS_CLOSED_VALUES: resolved,rejected,deleted
              # Anomaly notification email (home-gitops#5502). The restored database carries
              # production's recipients and subscriptions (2026-10-25), so they get staging
              # mail as well. Goes out through the
              # cluster's smtp-relay, which has no inbound auth and no TLS; it holds
              # the upstream credentials and uses STARTTLS on its own outbound hop,
              # so Envoy sets no username, password or STARTTLS. The relay's only
              # configured sender is the noreply address below. Real mail: only
              # people who subscribed at /settings/notifications receive anything.
              SPRING_MAIL_HOST: smtp-relay.kube-system.svc.cluster.local
              SPRING_MAIL_PORT: "25"
              ENVOY_REDUCER_NOTIFICATIONS_ENABLED: "true"
              ENVOY_REDUCER_NOTIFICATIONS_EMAIL_ENABLED: "true"
              ENVOY_REDUCER_NOTIFICATIONS_EMAIL_FROM: noreply@homelab5767.cc
              ENVOY_REDUCER_NOTIFICATIONS_BASE_URL: https://project-envoy-staging.dmfrey.com
              # home-gitops#5803 step 3 (staging only, eval B): chat reasoning effort off. Keep only if eval B
              # does not lower the data/docs scores and the mean turn time falls below eval A's 9.5 s (envoy#275);
              # otherwise remove this var.
              ENVOY_REDUCER_CHAT_REASONINGEFFORT: none
              # home-gitops#5803 step 4: triage OFF. 1b5f9ac fixed the executor-bean startup failure but the triage
              # summary adapter still fails to start: it needs envoy.reducer.chat.model (ENVOY_REDUCER_CHAT_MODEL), which
              # nothing sets (envoy#219). Turn triage on again only with that value set or defaulted in the image.
              # Same pod-instance wiring as spring-notes. Name must sort before
              # OTEL_RESOURCE_ATTRIBUTES: the chart renders env alphabetically
              # and $(VAR) only expands if VAR is defined earlier.
              APP_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              OTEL_RESOURCE_ATTRIBUTES: service.instance.id=$(APP_POD_NAME)
              # Metrics come from the ServiceMonitor scrape of
              # /actuator/prometheus. The app also defaults to pushing the same
              # meters over OTLP, which would create a second series per meter.
              # Traces still go to Alloy over OTLP.
              MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
              LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
              # The app defaults its own package to debug. Info here keeps the
              # per-request lines out of the pipeline, and matters once Alloy
              # ships logs back into Envoy.
              LOGGING_LEVEL_COM_BROADCOM_TANZU_ENVOY: info
              # CNPG auto-creates envoy-staging-cnpg-app with host/port/dbname/username/password.
              # Kubernetes env var substitution assembles the JDBC URL at runtime.
              DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: host
              DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: port
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: dbname
              SPRING_DATASOURCE_URL: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
              SPRING_DATASOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: username
              SPRING_DATASOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-cnpg-app
                    key: password
              # RabbitMQ Cluster Operator auto-creates envoy-staging-rabbitmq-default-user
              # with host/port/username/password, same shape as CNPG's app secret.
              SPRING_RABBITMQ_HOST:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: host
              SPRING_RABBITMQ_PORT:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: port
              SPRING_RABBITMQ_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: username
              SPRING_RABBITMQ_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: envoy-staging-rabbitmq-default-user
                    key: password
              # Phase 3 AI client: Ollama's OpenAI-compatible endpoint. The API
              # key is present but explicitly empty: that is Spring AI's
              # no-auth signal for a keyless server (unset is not the same).
              SPRING_AI_OPENAI_BASE_URL: http://ollama.ai.svc.cluster.local:11434/v1
              SPRING_AI_OPENAI_API_KEY: ""
              # Non-deprecated names (Spring AI 2.0.1). The older ..._OPTIONS_MODEL
              # names write a different key than Envoy's own application.yml
              # default (spring.ai.openai.chat.model: qwen2.5:0.5b), so the
              # override might not have won. Values unchanged.
              SPRING_AI_OPENAI_EMBEDDING_MODEL: nomic-embed-text
              # qwen3:8b confirmed by the tool-calling test on dmfrey/envoy#12
              # (args 18/21 vs 12/21 for qwen2.5:7b-instruct, same tool accuracy,
              # 3.4 s median latency; thinking arrives in a separate field).
              SPRING_AI_OPENAI_CHAT_MODEL: qwen3:8b
              # Write a heap dump when the JVM runs out of heap (envoy#189), so the
              # next OOM can be diagnosed. The Paketo launcher appends its own memory
              # flags after this, so they are kept. The dump goes to the emptyDir at
              # /dumps below (about the size of the heap, ~1.3 GiB).
              # envoy#293 (2026-10-23): Netty's direct-memory cap was the buildpack default of
              # 10 MiB and ran out after about 16 h, which broke SSO sign-in (new TLS connections
              # could not allocate buffers). An explicit flag is kept by the memory calculator, which
              # subtracts it from the heap budget (about 54 MiB less -Xmx; heap after GC is ~130 MiB).
              JAVA_TOOL_OPTIONS: -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps -XX:MaxDirectMemorySize=64M
            probes:
              # The first start runs the Liquibase migrations, so give startup
              # room (up to 600s) before liveness takes over. 150s was too
              # short for templating-009 (retires ~20k aliased template rows
              # in one transaction): the probe killed the pod mid-migration,
              # which rolled back and retried forever (2026-10-11).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/liveness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health/readiness
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

      frontend:
        containers:
          app:
            image:
              repository: ghcr.io/dmfrey/envoy-frontend
              # Step 6c: 80e24f1 (sign-out button follows the end-session URL; envoy#142).
              # Step 6a: f897efe (nginx passes the gateway's X-Forwarded-Proto
              # through, fixing the http OIDC redirect_uri; envoy#137). Step 6:
