---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
# Scrapes staging's backend. The job label is rewritten to envoy-staging:
# production's envoy-rules select job="envoy", and EnvoyMetricsAbsent uses
# absent(), so a second job="envoy" would hide a real production outage.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/service: envoy
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      # envoy meters db.client.operation.duration with the statement text as a label,
      # and batched inserts make every batch size a new statement: template_alias alone
      # had 830 statements (about 64k series) and templates 275 (about 22k) on
      # production on 2026-10-16 (same backend), which pushed Prometheus into an OOM crash loop.
      # Drop the buckets; _count and _sum stay. Remove once envoy stops emitting the
      # statement text as a label.
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: db_client_operation_duration_seconds_bucket
      relabelings:
        - action: replace
          targetLabel: job
          replacement: envoy-staging
