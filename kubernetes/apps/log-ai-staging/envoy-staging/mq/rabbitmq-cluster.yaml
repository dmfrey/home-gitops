---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rabbitmq.com/rabbitmqcluster_v1beta1.json
# Broker for staging Envoy's anomaly events. Same sizing as log-ai/envoy-mq;
# disposable, no backup. Runs one minor ahead (4.4) of the production and
# spring-notes brokers (4.3) while the 4.4 upgrade is proven here first.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: envoy-staging-rabbitmq
spec:
  replicas: 1
  # renovate: datasource=docker depName=rabbitmq versioning=loose
  image: rabbitmq:4.4-management@sha256:c200fd496482cda18c412be4e6f244830e1e75949b8cf5f0e887cea9ea456109
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: ceph-block
    storage: 1Gi
