---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rabbitmq.com/rabbitmqcluster_v1beta1.json
# Broker for staging Envoy's anomaly events. Same image and sizing as
# log-ai/envoy-mq; disposable, no backup.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: envoy-staging-rabbitmq
spec:
  replicas: 1
  # renovate: datasource=docker depName=rabbitmq versioning=loose
  image: rabbitmq:4.4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
  rabbitmq:
    additionalConfig: |
      # The operator default (2GB) is larger than these PVCs, which raises a
      # permanent free-disk alarm that blocks every publisher. Events are
      # transient, so a small absolute floor is enough.
      disk_free_limit.absolute = 500MB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClassName: ceph-block
    storage: 1Gi
